<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Secure Withdrawal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --bg: #0f051d; --glass: rgba(255, 255, 255, 0.07); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding-bottom: 80px; }
        .header { padding: 30px 20px; background: rgba(0,0,0,0.3); text-align: center; border-radius: 0 0 30px 30px; border-bottom: 1px solid rgba(241, 196, 15, 0.2); }
        .balance-card { background: linear-gradient(135deg, #f1c40f, #e67e22); color: #000; margin: -30px 20px 20px; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .balance-card h1 { margin: 5px 0; font-size: 32px; }
        .withdraw-form { padding: 20px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--gold); }
        select, input { width: 100%; padding: 14px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; outline: none; box-sizing: border-box; }
        .request-btn { background: linear-gradient(90deg, #f1c40f, #e67e22); color: #000; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: bold; cursor: pointer; }
        .history-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--gold); }
        
        .fee-details { background: rgba(241, 196, 15, 0.1); border-radius: 12px; padding: 12px; margin-top: 10px; display: none; }
        .fee-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0a0414; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(241, 196, 15, 0.2); }
        .nav-btn { color: #666; text-decoration: none; text-align: center; font-size: 10px; flex: 1; }
        .nav-btn.active { color: #f1c40f; }
        .nav-btn i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="header"><h2 style="margin:0; color: var(--gold);">Withdraw Funds</h2></div>

<div class="balance-card">
    <h3>Available Balance</h3>
    <h1 id="currentBalance">$0.00</h1>
    <span id="pkrValue" style="font-size: 12px; font-weight: bold;">(Rs. 0)</span>
</div>

<div class="withdraw-form">
    <div class="input-group">
        <label>Select Method</label>
        <select id="method">
            <option value="Easypaisa">Easypaisa</option>
            <option value="JazzCash">JazzCash</option>
            <option value="USDT_TRC20">USDT (TRC20)</option>
        </select>
    </div>

    <div class="input-group">
        <label id="limitLabel">Withdrawal Amount ($)</label>
        <input type="number" id="withdrawAmount" step="0.01" placeholder="Checking limit...">
        
        <div id="feeBox" class="fee-details">
            <div class="fee-row"><span>Withdrawal Fee (10%):</span> <span id="withdrawFee">$0.00</span></div>
            <div class="fee-row"><span>Maintenance Fee (5%):</span> <span id="maintFee">$0.00</span></div>
            <hr style="border: 0.5px solid rgba(255,255,255,0.1);">
            <div class="fee-row" style="color: #00ff64; font-weight: bold;"><span>You Receive:</span> <span id="finalAmount">Rs. 0</span></div>
        </div>
    </div>

    <div class="input-group"><label>Account Number</label><input type="text" id="accountNum" placeholder="Number or Address"></div>
    <div class="input-group"><label>Account Name</label><input type="text" id="accountName" placeholder="Full Name"></div>

    <button class="request-btn" id="requestBtn">CONFIRM WITHDRAWAL</button>

    <h3 style="color: var(--gold); margin-top: 30px;">Withdrawal History</h3>
    <div id="historyList"></div>
</div>

<nav class="nav-bar">
    <a href="dashboard.html" class="nav-btn"><i class="fas fa-house"></i>HOME</a>
    <a href="plans.html" class="nav-btn"><i class="fas fa-gem"></i>PLANS</a>
    <a href="mining.html" class="nav-btn"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-btn"><i class="fas fa-users"></i>REFER</a>
    <a href="profile.html" class="nav-btn active"><i class="fas fa-user-gear"></i>PROFILE</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');
    const PKR_RATE = 300; // 1$ = 300 PKR
    let currentBalanceUSD = 0;
    let minLimit = 1.0;

    if (!phone) { window.location.href = "login.html"; }

    // --- بیلنس سنکرونائزیشن ---
    db.ref('users/' + phone).on('value', (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            // ڈیش بورڈ کے مطابق بیلنس اٹھانا
            currentBalanceUSD = parseFloat(data.balance) || 0;
            
            document.getElementById('currentBalance').innerText = "$" + currentBalanceUSD.toFixed(2);
            document.getElementById('pkrValue').innerText = "(Rs. " + Math.floor(currentBalanceUSD * PKR_RATE).toLocaleString() + ")";
        }
    });

    // --- لیمٹ چیکر ---
    db.ref('withdrawals').orderByChild('phone').equalTo(phone).once('value', (snapshot) => {
        if (snapshot.exists()) {
            minLimit = 1.0;
            document.getElementById('withdrawAmount').placeholder = "Min $1.00";
        } else {
            minLimit = 0.50;
            document.getElementById('withdrawAmount').placeholder = "Min $0.50 (First Time)";
        }
    });

    // --- ٹیکس اور کیلکولیشن لاجک ---
    document.getElementById('withdrawAmount').oninput = (e) => {
        const inputVal = parseFloat(e.target.value);
        const feeBox = document.getElementById('feeBox');
        
        if (inputVal > 0) {
            feeBox.style.display = "block";
            const wFee = inputVal * 0.10; // 10%
            const mFee = inputVal * 0.05; // 5%
            const totalTax = wFee + mFee;
            const netUSD = inputVal - totalTax;
            const netPKR = netUSD * PKR_RATE;
            
            document.getElementById('withdrawFee').innerText = "$" + wFee.toFixed(2);
            document.getElementById('maintFee').innerText = "$" + mFee.toFixed(2);
            document.getElementById('finalAmount').innerText = "Rs. " + Math.floor(netPKR).toLocaleString();
        } else {
            feeBox.style.display = "none";
        }
    };

    // --- ودڈرال ریکویسٹ ---
    document.getElementById('requestBtn').onclick = function() {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const method = document.getElementById('method').value;
        const accNum = document.getElementById('accountNum').value;
        const accName = document.getElementById('accountName').value;

        if (isNaN(amount) || amount < minLimit) { alert("Minimum withdrawal is $" + minLimit); return; }
        if (amount > currentBalanceUSD) { alert("Insufficient Balance! Your balance is in Dollars."); return; }
        if (!accNum || !accName) { alert("Please fill all details!"); return; }

        this.disabled = true;
        this.innerText = "Processing...";

        db.ref('users/' + phone + '/balance').transaction((curr) => {
            if (curr >= amount) return (curr - amount);
        }, (error, committed) => {
            if (committed) {
                const withdrawID = Date.now();
                db.ref('withdrawals/' + withdrawID).set({
                    phone: phone, 
                    amount: amount, // اصل ڈالر جو کاٹے گئے
                    netAmountPKR: Math.floor((amount * 0.85) * PKR_RATE), // 15% ٹیکس کے بعد روپے
                    method: method,
                    accountNumber: accNum, 
                    accountName: accName,
                    status: "Pending", 
                    date: new Date().toLocaleString()
                }).then(() => {
                    alert("Withdrawal Requested! Amount deducted in Dollars.");
                    location.reload();
                });
            } else {
                alert("Failed! Check your connection.");
                this.disabled = false;
                this.innerText = "CONFIRM WITHDRAWAL";
            }
        });
    };

    // --- ہسٹری ---
    db.ref('withdrawals').orderByChild('phone').equalTo(phone).on('value', (snapshot) => {
        let html = '';
        snapshot.forEach((child) => {
            const data = child.val();
            const statusColor = data.status === "Pending" ? "#f1c40f" : (data.status === "Approved" ? "#2ecc71" : "#ff3232");
            html += `<div class="history-card">
                        <div style="display:flex; justify-content:space-between">
                            <span>$${data.amount}</span>
                            <b style="color:${statusColor}">${data.status}</b>
                        </div>
                        <small style="color:#888">${data.date}</small>
                    </div>`;
        });
        document.getElementById('historyList').innerHTML = html || '<p style="text-align:center; color:#555;">No records found.</p>';
    });
</script>
</body>
</html>
