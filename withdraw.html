<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, push, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com", // ڈیٹا بیس یو آر ایل لازمی ڈالیں
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const username = localStorage.getItem('userPhone'); // ہم نے یوزر نیم اسی کی (Key) میں رکھا ہے

    // میتھڈز میں عالمی آپشنز ڈالنا (HTML میں بھی تبدیل کریں)
    const methodDropdown = document.getElementById('method');
    methodDropdown.innerHTML += `<option value="USDT_TRC20">USDT (TRC20) - Global</option>`;

    let currentBalance = 0;

    // یوزر کا بیلنس لوڈ کرنا
    async function loadBalance() {
        if (!username) {
            alert("Please login again!");
            window.location.href = "index.html";
            return;
        }
        const userRef = ref(db, 'users/' + username);
        const snapshot = await get(userRef);
        if (snapshot.exists()) {
            currentBalance = snapshot.val().balance || 0;
            document.getElementById('currentBalance').innerText = "$" + currentBalance.toFixed(2);
        }
    }
    loadBalance();

    document.getElementById('requestBtn').onclick = async () => {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const method = document.getElementById('method').value;
        const accNum = document.getElementById('accountNum').value;
        const accName = document.getElementById('accountName').value;
        const btn = document.getElementById('requestBtn');

        if (!amount || amount < 5) {
            alert("Minimum withdrawal is $5");
            return;
        }

        if (amount > currentBalance) {
            alert("Insufficient Balance!");
            return;
        }

        if (!accNum || !accName) {
            alert("Please fill all account details.");
            return;
        }

        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            // سیکیورٹی: پہلے بیلنس کاٹیں پھر ریکویسٹ ڈالیں (Transaction استعمال کریں)
            const userRef = ref(db, 'users/' + username + '/balance');
            const result = await runTransaction(userRef, (current) => {
                if (current >= amount) {
                    return current - amount;
                }
                return; // اگر بیلنس کم ہے تو کینسل کر دیں
            });

            if (result.committed) {
                // ودڈرال ریکویسٹ سیو کریں
                const withdrawRef = ref(db, 'withdrawals');
                const newRequestRef = push(withdrawRef);
                
                await set(newRequestRef, {
                    username: username,
                    amount: amount,
                    method: method,
                    accountNumber: accNum,
                    accountName: accName,
                    status: "Pending",
                    timestamp: Date.now(),
                    date: new Date().toLocaleString()
                });

                alert("Withdrawal Request Submitted Successfully!");
                window.location.href = 'profile.html';
            } else {
                alert("Transaction Failed! Try again.");
                btn.innerText = "Confirm Withdrawal";
                btn.disabled = false;
            }

        } catch (e) {
            alert("Error: " + e.message);
            btn.innerText = "Confirm Withdrawal";
            btn.disabled = false;
        }
    };
</script>
