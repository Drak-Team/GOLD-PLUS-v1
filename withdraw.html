<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');
    let currentBalance = 0;

    // 1. بیلنس لوڈ کرنا
    function initApp() {
        if (!phone) {
            alert("Please Login First!");
            window.location.href = "index.html";
            return;
        }

        // بیلنس پر نظر رکھنا
        db.ref('users/' + phone + '/balance').on('value', (snapshot) => {
            currentBalance = parseFloat(snapshot.val()) || 0;
            document.getElementById('currentBalance').innerText = "$" + currentBalance.toFixed(2);
            document.getElementById('pkrValue').innerText = "(Rs. " + Math.floor(currentBalance * 300).toLocaleString() + ")";
        });

        // ہسٹری لوڈ کرنا
        loadWithdrawHistory();
    }

    // 2. ودڈرال ہسٹری دکھانا
    function loadWithdrawHistory() {
        // پہلے ایچ ٹی ایم ایل میں ایک جگہ بنا لیں ہسٹری کے لیے
        let historyDiv = document.getElementById('withdrawHistory');
        if(!historyDiv) {
            const div = document.createElement('div');
            div.id = 'withdrawHistory';
            div.innerHTML = '<h3 style="color:#f1c40f; margin-top:30px;">Withdrawal History</h3><div id="historyList"></div>';
            document.querySelector('.withdraw-form').appendChild(div);
            historyDiv = document.getElementById('historyList');
        }

        db.ref('withdrawals').orderByChild('phone').equalTo(phone).on('value', (snapshot) => {
            let html = '';
            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const data = child.val();
                    const color = data.status === "Pending" ? "#f1c40f" : (data.status === "Approved" ? "#2ecc71" : "#ff3232");
                    html += `
                        <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:10px; border-left:4px solid ${color}">
                            <div style="display:flex; justify-content:space-between">
                                <span>$${data.amount}</span>
                                <b style="color:${color}">${data.status}</b>
                            </div>
                            <small style="color:#888">${data.date}</small>
                        </div>`;
                });
            } else {
                html = '<p style="color:#666">No history found.</p>';
            }
            document.getElementById('historyList').innerHTML = html;
        });
    }

    // 3. کیلکولیٹر
    document.getElementById('withdrawAmount').addEventListener('input', (e) => {
        const val = e.target.value;
        document.getElementById('calcNote').innerText = val > 0 ? "You will receive: Rs. " + (val * 300) : "";
    });

    // 4. ودڈرال ریکویسٹ بھیجنا
    document.getElementById('requestBtn').onclick = function() {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const method = document.getElementById('method').value;
        const accNum = document.getElementById('accountNum').value;
        const accName = document.getElementById('accountName').value;
        const btn = document.getElementById('requestBtn');

        if (!amount || amount < 1.00) { alert("Min withdrawal is $1"); return; }
        if (amount > currentBalance) { alert("Low Balance!"); return; }
        if (!accNum || !accName) { alert("Enter all details!"); return; }

        btn.innerText = "Processing...";
        btn.disabled = true;

        const withdrawID = Date.now();
        const withdrawData = {
            phone: phone,
            amount: amount,
            method: method,
            accountNumber: accNum,
            accountName: accName,
            status: "Pending",
            date: new Date().toLocaleString()
        };

        // ٹرانزیکشن کے ذریعے بیلنس کاٹنا
        db.ref('users/' + phone + '/balance').transaction((curr) => {
            if (curr >= amount) return curr - amount;
            return;
        }, (error, committed) => {
            if (committed) {
                // ایڈمن اور ہسٹری دونوں کے لیے ایک ہی جگہ ڈیٹا
                db.ref('withdrawals/' + withdrawID).set(withdrawData).then(() => {
                    alert("Success! Request Sent.");
                    btn.innerText = "CONFIRM WITHDRAWAL";
                    btn.disabled = false;
                    document.getElementById('withdrawAmount').value = '';
                });
            } else {
                alert("Failed! Try again.");
                btn.innerText = "CONFIRM WITHDRAWAL";
                btn.disabled = false;
            }
        });
    };

    // شروع کریں
    initApp();
</script>
