<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Gold Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 30px;
        }

        .header { padding: 20px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.2); }
        .header i { color: var(--primary-gold); font-size: 22px; cursor: pointer; }

        .container { padding: 20px; }

        /* Wallet Card */
        .wallet-card {
            background: linear-gradient(135deg, #25163d, #1a0b2e);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .wallet-card span { font-size: 12px; color: #aaa; text-transform: uppercase; }
        .wallet-card h2 { font-size: 32px; margin: 10px 0; color: var(--primary-gold); }

        /* Form Styling */
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; }
        .input-group input, .input-group select {
            width: 100%; padding: 15px; border-radius: 15px;
            border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3);
            color: white; box-sizing: border-box; outline: none;
        }

        .withdraw-btn {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000; border: none; width: 100%; padding: 16px;
            border-radius: 18px; font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
            cursor: pointer; margin-top: 10px;
        }
        
        .note { font-size: 11px; color: #666; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="header">
    <i class="fas fa-arrow-left" onclick="history.back()"></i>
    <h2>Withdraw Funds</h2>
</div>

<div class="container">
    <div class="wallet-card">
        <span>Available Balance</span>
        <h2 id="currentBalance">$0.00</h2>
    </div>

    <div class="input-group">
        <label>Select Method</label>
        <select id="method">
            <option value="EasyPaisa">EasyPaisa</option>
            <option value="JazzCash">JazzCash</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select>
    </div>

    <div class="input-group">
        <label>Account Number</label>
        <input type="number" id="accountNum" placeholder="e.g. 03001234567">
    </div>

    <div class="input-group">
        <label>Account Holder Name</label>
        <input type="text" id="accountName" placeholder="Full Name">
    </div>

    <div class="input-group">
        <label>Withdraw Amount ($)</label>
        <input type="number" id="withdrawAmount" placeholder="Minimum $5">
    </div>

    <button class="withdraw-btn" id="requestBtn">Confirm Withdrawal</button>
    <p class="note">Withdrawal requests take 2-24 hours to process.</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentBalance = 0;

    // یوزر کا کرنٹ بیلنس چیک کرنا
    auth.onAuthStateChanged((user) => {
        if (user) {
            const balanceRef = ref(db, 'users/' + user.uid + '/balance');
            onValue(balanceRef, (snapshot) => {
                currentBalance = snapshot.val() || 0;
                document.getElementById('currentBalance').innerText = "$" + currentBalance;
            });
        }
    });

    document.getElementById('requestBtn').onclick = async () => {
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const method = document.getElementById('method').value;
        const accNum = document.getElementById('accountNum').value;
        const accName = document.getElementById('accountName').value;
        const user = auth.currentUser;

        if (!amount || amount < 5) {
            alert("Minimum withdrawal is $5");
            return;
        }

        if (amount > currentBalance) {
            alert("Insufficient Balance!");
            return;
        }

        if (accNum && accName) {
            // ودڈرا کی ریکویسٹ فائر بیس میں سیو کرنا
            const withdrawRef = ref(db, 'withdrawals/' + user.uid);
            const newRequestRef = push(withdrawRef);
            
            await set(newRequestRef, {
                amount: amount,
                method: method,
                accountNumber: accNum,
                accountName: accName,
                status: "Pending",
                date: new Date().toLocaleString()
            });

            alert("Withdraw Request Submitted!");
            window.location.href = 'profile.html';
        } else {
            alert("Please fill all details.");
        }
    };
</script>

</body>
</html>
