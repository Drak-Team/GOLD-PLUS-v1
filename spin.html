<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Lucky Spin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-gold: #f1c40f; --bg-dark: #0f051d; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f051d; color: white; text-align: center; overflow-x: hidden; }
        
        .header { padding: 20px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); }
        .header i { color: var(--primary-gold); font-size: 22px; cursor: pointer; }

        /* Wheel Design */
        .spin-container { margin-top: 50px; position: relative; display: inline-block; }
        .wheel { width: 300px; height: 300px; border: 8px solid #333; border-radius: 50%; transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); box-shadow: 0 0 30px rgba(241, 196, 15, 0.2); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 45px; z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }

        .spin-btn { background: linear-gradient(135deg, #f1c40f, #e67e22); color: #000; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 18px; margin-top: 30px; cursor: pointer; box-shadow: 0 5px 20px rgba(241, 196, 15, 0.4); }
        .spin-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }

        .info-box { background: rgba(255,255,255,0.05); margin: 30px 20px; padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        #availableSpins { color: #f1c40f; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <i class="fas fa-arrow-left" onclick="location.href='refer.html'"></i>
    <h2>Lucky Spin Wheel</h2>
</div>

<div class="spin-container">
    <img src="https://i.ibb.co/XW7Kz6p/pointer.png" class="pointer">
    <img src="https://i.ibb.co/HT6V6vB/wheel-gold.png" id="wheel" class="wheel">
</div>

<div>
    <button class="spin-btn" id="spinBtn" onclick="startSpin()">SPIN NOW</button>
</div>

<div class="info-box">
    <span>Available Spins: <span id="availableSpins">0</span></span>
    <p style="font-size: 12px; color: #aaa; margin-top: 10px;">Invite 1 active friend to get 1 free spin!</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userPhone = localStorage.getItem('userPhone');

    const prizes = [0.10, 100, 0.50, 10, 0.20, 50, 0.15, 5]; // Wheel values
    let isSpinning = false;

    window.onload = async function() {
        if(!userPhone) return;
        const snap = await get(ref(db, 'users/' + userPhone));
        if(snap.exists()){
            document.getElementById('availableSpins').innerText = snap.val().spins || 0;
        }
    };

    window.startSpin = async function() {
        if(isSpinning) return;
        const userRef = ref(db, 'users/' + userPhone);
        const snap = await get(userRef);
        let currentSpins = snap.val().spins || 0;

        if(currentSpins < 1) {
            alert("Oops! No spins left. Refer friends to earn more.");
            return;
        }

        isSpinning = true;
        document.getElementById('spinBtn').disabled = true;

        const wheel = document.getElementById('wheel');
        const randomDeg = Math.floor(Math.random() * 360) + 3600; 
        wheel.style.transform = `rotate(${randomDeg}deg)`;

        // Spin count -1 in database
        await runTransaction(userRef, (user) => {
            if(user) user.spins = (user.spins || 0) - 1;
            return user;
        });

        setTimeout(async () => {
            const actualDeg = randomDeg % 360;
            const prizeIndex = Math.floor(actualDeg / (360 / prizes.length));
            const winAmount = prizes[prizeIndex];

            // Add money to balance
            await runTransaction(ref(db, `users/${userPhone}/balance`), (b) => (b || 0) + winAmount);
            
            if(winAmount >= 10) {
                alert("🎊 CONGRATULATIONS! 🎊\nYou won a Mega Prize: $" + winAmount);
            } else {
                alert("You won: $" + winAmount);
            }

            location.reload();
        }, 4100);
    };
</script>

</body>
</html>
