<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // دوسرا کام: یہاں 'type="module"' نہیں ہونا چاہیے، بس سادہ <script> ٹیگ ہو
    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    // Firebase Initialize
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    var db = firebase.database();
    var auth = firebase.auth();

    // ریفرل چیک
    window.onload = function() {
        var urlParams = new URLSearchParams(window.location.search);
        var refCode = urlParams.get('ref');
        if (refCode) {
            document.getElementById('ref').value = refCode;
            document.getElementById('ref').readOnly = true;
            
            db.ref('users/' + refCode).once('value').then(function(snap) {
                if(snap.exists()){
                    document.getElementById('inviterText').innerText = "Invited by " + snap.val().username;
                }
            });
        }
    };

    // سائن اپ بٹن
    document.getElementById('signupBtn').onclick = function() {
        var username = document.getElementById('username').value.trim().toLowerCase();
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('pass').value;
        var confirmPass = document.getElementById('confirm_pass').value;
        var refer = document.getElementById('ref').value || "none";

        if(!username || !email || !pass) {
            alert("Please fill all fields!");
            return;
        }
        if(pass !== confirmPass) {
            alert("Passwords do not match!");
            return;
        }

        var btn = document.getElementById('signupBtn');
        btn.innerText = "Creating Account...";
        btn.disabled = true;

        // یوزر چیک کریں
        db.ref('users/' + username).once('value').then(function(snapshot) {
            if (snapshot.exists()) {
                alert("Username already taken!");
                btn.innerText = "SIGN UP NOW";
                btn.disabled = false;
                return;
            }

            // اکاؤنٹ بنانا
            auth.createUserWithEmailAndPassword(email, pass).then(function(userCredential) {
                var user = userCredential.user;

                var userData = {
                    uid: user.uid,
                    username: username,
                    email: email,
                    referredBy: refer,
                    balance: 0,
                    totalEarned: 0,
                    totalDeposit: 0,
                    status: "active",
                    joinDate: new Date().toLocaleDateString()
                };

                db.ref('users/' + username).set(userData).then(function() {
                    if (refer !== "none") {
                        db.ref('users/' + refer + '/referrals/' + username).set({
                            joinTime: new Date().toLocaleString(),
                            status: "Pending"
                        });
                    }
                    localStorage.setItem('userPhone', username);
                    alert("Account Created Successfully!");
                    window.location.href = 'dashboard.html';
                });

            }).catch(function(error) {
                alert(error.message);
                btn.innerText = "SIGN UP NOW";
                btn.disabled = false;
            });
        });
    };
</script>
