<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    // Firebase Initialize
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // ریفرل چیک (لنک سے نمبر اٹھانا)
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const refCode = params.get('ref');
        if (refCode) {
            document.getElementById('ref').value = refCode;
            document.getElementById('ref').readOnly = true;
            
            db.ref('users/' + refCode).once('value').then((snap) => {
                if(snap.exists()){
                    document.getElementById('inviterText').innerText = "Invited by " + snap.val().username;
                }
            });
        }
    };

    document.getElementById('signupBtn').addEventListener('click', function() {
        const username = document.getElementById('username').value.trim().toLowerCase();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value;
        const confirmPass = document.getElementById('confirm_pass').value;
        const refer = document.getElementById('ref').value || "none";

        if(!username || !email || !pass) {
            alert("Please fill all fields!");
            return;
        }
        if(pass !== confirmPass) {
            alert("Passwords do not match!");
            return;
        }

        const btn = document.getElementById('signupBtn');
        btn.innerText = "Creating Account...";
        btn.disabled = true;

        // یوزر نیم چیک کریں
        db.ref('users/' + username).once('value').then((userCheck) => {
            if (userCheck.exists()) {
                alert("Username already taken!");
                btn.innerText = "SIGN UP NOW";
                btn.disabled = false;
                return;
            }

            // نیا یوزر بنائیں
            auth.createUserWithEmailAndPassword(email, pass).then((userCredential) => {
                const user = userCredential.user;

                // ڈیٹا بیس میں یوزر کا ڈیٹا سیو کریں
                const userData = {
                    uid: user.uid,
                    username: username,
                    email: email,
                    referredBy: refer, // یہاں ہم نے وہی نام رکھا جو پلان والے پیج پر استعمال کیا ہے
                    balance: 0,
                    totalEarned: 0,
                    totalDeposit: 0,
                    status: "active",
                    joinDate: new Date().toLocaleDateString()
                };

                db.ref('users/' + username).set(userData).then(() => {
                    // ریفر کرنے والے کی لسٹ میں نئے بندے کو ڈالنا
                    if (refer !== "none") {
                        db.ref('users/' + refer + '/referrals/' + username).set({
                            joinTime: new Date().toLocaleString(),
                            status: "Pending"
                        });
                    }

                    localStorage.setItem('userPhone', username);
                    alert("Account Created Successfully!");
                    window.location.href = 'dashboard.html';
                });

            }).catch((error) => {
                alert(error.message);
                btn.innerText = "SIGN UP NOW";
                btn.disabled = false;
            });
        });
    });
</script>
