<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .signup-container {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px;
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .logo-area { margin-bottom: 25px; }
        .logo-area i { font-size: 50px; color: var(--primary-gold); filter: drop-shadow(0 0 10px gold); }
        .logo-area h2 { margin: 10px 0 5px; font-size: 24px; letter-spacing: 1px; }
        .logo-area p { font-size: 12px; color: #aaa; }

        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 11px; color: var(--primary-gold); margin-bottom: 8px; text-transform: uppercase; padding-left: 5px; }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i { position: absolute; left: 15px; color: #555; font-size: 14px; }
        .input-wrapper input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .input-wrapper input:focus { border-color: var(--primary-gold); }

        .signup-btn {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000; border: none; width: 100%; padding: 15px;
            border-radius: 18px; font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
            cursor: pointer; margin-top: 10px;
        }

        .login-link { margin-top: 20px; font-size: 13px; color: #aaa; }
        .login-link a { color: var(--primary-gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="signup-container">
    <div class="logo-area">
        <i class="fas fa-coins"></i>
        <h2>Gold Plus V1</h2>
        <p>Start your professional mining journey</p>
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
    </div>

    <div class="form-group">
        <label>Phone Number</label>
        <div class="input-wrapper">
            <i class="fas fa-phone"></i>
            <input type="number" id="phone" placeholder="03XXXXXXXXX">
        </div>
    </div>

    <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="pass" placeholder="Create password">
        </div>
    </div>

    <div class="form-group">
        <label>Referral Code (Optional)</label>
        <div class="input-wrapper">
            <i class="fas fa-user-plus"></i>
            <input type="text" id="ref" placeholder="Enter refer code">
        </div>
    </div>

    <button class="signup-btn" id="signupBtn">Create Account</button>

    <div class="login-link">
        Already have an account? <a href="login.html">Login Now</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    document.getElementById('signupBtn').addEventListener('click', async () => {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const pass = document.getElementById('pass').value;
        const refer = document.getElementById('ref').value || "none";

        if(!name || !phone || !pass) {
            alert("Please fill all fields!");
            return;
        }

        // فون نمبر کو بطور ID استعمال کریں گے تاکہ ہر بندہ ایک ہی بار رجسٹر ہو
        const userRef = ref(database, 'users/' + phone);
        
        try {
            const snapshot = await get(userRef);
            if (snapshot.exists()) {
                alert("This phone number is already registered!");
            } else {
                // نیا یوزر ڈیٹا بیس میں ڈالیں
                await set(userRef, {
                    name: name,
                    phone: phone,
                    password: pass,
                    referBy: refer,
                    balance: 0.00,
                    status: "active",
                    joiningDate: new Date().toISOString()
                });
                
                alert("Account created successfully!");
                // لوکل اسٹوریج میں فون نمبر سیو کریں تاکہ لاگ ان یاد رہے
                localStorage.setItem('userPhone', phone);
                window.location.href = 'dashboard.html';
            }
        } catch (error) {
            console.error(error);
            alert("Error: " + error.message);
        }
    });
</script>

</body>
</html>
