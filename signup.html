<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // ریفرل چیک
    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        const refCode = params.get('ref');
        if (refCode) {
            document.getElementById('ref').value = refCode;
            document.getElementById('ref').readOnly = true;
            
            const snap = await get(ref(db, 'users/' + refCode));
            if(snap.exists()){
                document.getElementById('inviterText').innerText = "Invited by " + snap.val().username;
            }
        }
    };

    document.getElementById('signupBtn').addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim().toLowerCase();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value;
        const confirmPass = document.getElementById('confirm_pass').value;
        const refer = document.getElementById('ref').value || "none";

        if(!username || !email || !pass) {
            alert("Please fill all fields!");
            return;
        }
        if(pass !== confirmPass) {
            alert("Passwords do not match!");
            return;
        }

        const btn = document.getElementById('signupBtn');
        btn.innerText = "Creating Account...";
        btn.disabled = true;

        try {
            const userCheck = await get(ref(db, 'users/' + username));
            if (userCheck.exists()) {
                alert("Username already taken!");
                btn.innerText = "SIGN UP NOW";
                btn.disabled = false;
                return;
            }

            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCredential.user;

            // نیا اکاؤنٹ بنانا
            await set(ref(db, 'users/' + username), {
                uid: user.uid,
                username: username,
                email: email,
                referredBy: refer, // تبدیل شدہ: referBy سے referredBy
                balance: 0,
                totalEarned: 0,
                totalDeposit: 0,
                status: "active",
                joinDate: new Date().toLocaleDateString()
            });

            // ریفر کرنے والے کی لسٹ میں نئے بندے کو ڈالنا
            if (refer !== "none") {
                const refererListRef = ref(db, `users/${refer}/referrals/${username}`);
                await set(refererListRef, {
                    joinTime: new Date().toLocaleString(),
                    status: "Pending"
                });
            }

            localStorage.setItem('userPhone', username);
            alert("Account Created Successfully!");
            window.location.href = 'dashboard.html';

        } catch (error) {
            alert(error.message);
            btn.innerText = "SIGN UP NOW";
            btn.disabled = false;
        }
    });
</script>
