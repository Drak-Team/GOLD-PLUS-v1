<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Global Signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #f1c40f;
            --dark-gold: #d4af37;
            --bg: #0f051d;
            --glass: rgba(255, 255, 255, 0.07);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .signup-container {
            width: 90%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid rgba(241, 196, 15, 0.2);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Animated Logo Section */
        .logo-area {
            margin-bottom: 25px;
        }
        .logo-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--gold), #e67e22);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #000;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); }
        }

        h2 { color: var(--gold); margin-bottom: 10px; font-weight: 600; }
        p { font-size: 13px; color: #aaa; margin-bottom: 25px; }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
        }

        input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--gold); background: rgba(0,0,0,0.5); }

        .signup-btn {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }

        .login-link { margin-top: 20px; font-size: 13px; color: #888; }
        .login-link a { color: var(--gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="signup-container">
    <div class="logo-area">
        <div class="logo-circle"><i class="fas fa-coins"></i></div>
    </div>
    
    <h2 id="inviterText">Create Account</h2>
    <p>Join Gold Plus Global Network</p>

    <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username (Unique ID)">
    </div>

    <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="Email Address">
    </div>

    <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="pass" placeholder="Password (min 6 chars)">
    </div>

    <div class="input-group">
        <i class="fas fa-shield-alt"></i>
        <input type="password" id="confirm_pass" placeholder="Confirm Password">
    </div>

    <div class="input-group">
        <i class="fas fa-user-friends"></i>
        <input type="text" id="ref" placeholder="Referral Code (Optional)">
    </div>

    <button class="signup-btn" id="signupBtn">SIGN UP NOW</button>

    <div class="login-link">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // ریفرل چیک
    window.onload = async function() {
        const params = new URLSearchParams(window.location.search);
        const refCode = params.get('ref');
        if (refCode) {
            document.getElementById('ref').value = refCode;
            document.getElementById('ref').readOnly = true;
            
            const snap = await get(ref(db, 'users/' + refCode));
            if(snap.exists()){
                document.getElementById('inviterText').innerText = "Invited by " + snap.val().username;
            }
        }
    };

    document.getElementById('signupBtn').addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim().toLowerCase();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('pass').value;
        const confirmPass = document.getElementById('confirm_pass').value;
        const refer = document.getElementById('ref').value || "none";

        if(!username || !email || !pass) {
            alert("Please fill all fields!");
            return;
        }
        if(pass !== confirmPass) {
            alert("Passwords do not match!");
            return;
        }

        const btn = document.getElementById('signupBtn');
        btn.innerText = "Creating Account...";
        btn.disabled = true;

        try {
            // یوزر نیم کی دستیابی چیک کریں
            const userCheck = await get(ref(db, 'users/' + username));
            if (userCheck.exists()) {
                alert("Username already taken! Choose another.");
                btn.innerText = "SIGN UP NOW";
                btn.disabled = false;
                return;
            }

            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCredential.user;

            await set(ref(db, 'users/' + username), {
                uid: user.uid,
                username: username,
                email: email,
                referBy: refer,
                balance: 0.00,
                status: "active",
                joiningDate: new Date().toISOString()
            });

            if (refer !== "none") {
                const refererRef = ref(db, 'users/' + refer + '/balance');
                await runTransaction(refererRef, (curr) => (curr || 0) + 0.10);
            }

            localStorage.setItem('userPhone', username); // ہم یوزر نیم ہی فون کی جگہ استعمال کریں گے
            alert("Account Created! Welcome to Gold Plus.");
            window.location.href = 'dashboard.html';

        } catch (error) {
            alert(error.message);
            btn.innerText = "SIGN UP NOW";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
