<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    document.getElementById('signupBtn').addEventListener('click', async () => {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const pass = document.getElementById('pass').value;
        const refer = document.getElementById('ref').value || "none";

        if(!name || !email || !phone || !pass) {
            alert("Please fill all fields!");
            return;
        }

        if(pass.length < 6) {
            alert("Password must be at least 6 characters!");
            return;
        }

        const btn = document.getElementById('signupBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const phoneCheck = await get(ref(database, 'users/' + phone));
            if (phoneCheck.exists()) {
                alert("Phone number already registered!");
                btn.innerText = "Create Account";
                btn.disabled = false;
                return;
            }

            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCredential.user;

            localStorage.clear();

            // 1. نیا یوزر ڈیٹا بیس میں سیو کرنا
            await set(ref(database, 'users/' + phone), {
                uid: user.uid,
                name: name,
                email: email,
                phone: phone,
                password: pass,
                referBy: refer,
                balance: 0.00,
                status: "active",
                joiningDate: new Date().toISOString()
            });

            // 2. ریفرل بونس لاجک ($0.10 سیٹ کر دیا گیا ہے)
            if (refer !== "none" && refer !== "") {
                const refererBalanceRef = ref(database, 'users/' + refer + '/balance');
                await runTransaction(refererBalanceRef, (currentBalance) => {
                    return (currentBalance || 0) + 0.10; 
                });
            }

            localStorage.setItem('userPhone', phone);
            alert("Account created successfully! $0.10 Referral bonus sent.");
            window.location.href = 'dashboard.html';

        } catch (error) {
            alert("Error: " + error.message);
            btn.innerText = "Create Account";
            btn.disabled = false;
        }
    });

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const refCode = params.get('ref');
        if (refCode) {
            document.getElementById('ref').value = refCode;
            document.getElementById('ref').readOnly = true;
        }
    }
</script>
