<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Recharge</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #fff; color: #333; padding: 20px; border-radius: 15px; max-width: 350px; margin: auto; }
        input { width: 100%; margin: 10px 0; padding: 10px; }
        .btn { background: #d4af37; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Deposit Money</h3>
        <p>Send to EasyPaisa: <b>0300XXXXXXX</b></p>
        <input type="number" id="amount" placeholder="Enter Amount">
        <input type="file" id="photo" accept="image/*">
        <button class="btn" id="uploadBtn">Submit Screenshot</button>
        <p id="msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
            authDomain: "gold-plus-v1.firebaseapp.com",
            projectId: "gold-plus-v1",
            storageBucket: "gold-plus-v1.firebasestorage.app",
            messagingSenderId: "474592887487",
            appId: "1:474592887487:web:e9261d51df5af58a367c0a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        document.getElementById('uploadBtn').onclick = async () => {
            const file = document.getElementById('photo').files[0];
            const amount = document.getElementById('amount').value;
            if(!file || !amount) return alert("Fill all fields");

            document.getElementById('msg').innerText = "Uploading...";
            
            const sRef = ref(storage, 'proofs/' + Date.now());
            await uploadBytes(sRef, file);
            const url = await getDownloadURL(sRef);

            await addDoc(collection(db, "deposits"), {
                amount, url, status: "pending", time: new Date()
            });

            alert("Sent for approval!");
            document.getElementById('msg').innerText = "";
        };
    </script>
</body>
</html>
