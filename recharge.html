<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Investment</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: radial-gradient(circle, #2c3e50 0%, #000000 100%); min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
        
        .phone-frame {
            background-color: white;
            width: 360px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 8px solid #333;
            display: flex;
            flex-direction: column;
        }

        .header { background: linear-gradient(45deg, #d4af37, #f1c40f); padding: 20px; text-align: center; color: black; font-weight: bold; }
        
        .content { padding: 20px; text-align: center; }

        .payment-box {
            background: #f9f9f9;
            border: 2px dashed #d4af37;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .payment-box p { font-size: 14px; color: #555; margin-bottom: 5px; }
        .payment-box h3 { color: #000; font-size: 20px; }

        .copy-btn {
            background: #d4af37;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .upload-section { margin-top: 20px; text-align: left; }
        .upload-section label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px; }
        
        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #000;
            color: #d4af37;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .status-msg { margin-top: 15px; font-size: 13px; color: green; display: none; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="header">RECHARGE / INVESTMENT</div>
        
        <div class="content">
            <div class="payment-box">
                <p>Transfer Payment to EasyPaisa / JazzCash</p>
                <h3 id="accountNo">03001234567</h3>
                <p>Account Name: <strong>Ahmad Nafees</strong></p>
                <button class="copy-btn" onclick="copyNumber()">Copy Number</button>
            </div>

            <div class="upload-section">
                <label>Enter Amount (PKR)</label>
                <input type="number" id="amount" placeholder="e.g. 1000" required>

                <label>Upload Screenshot</label>
                <input type="file" id="screenshot" accept="image/*" required>
                
                <button class="btn-submit" onclick="submitPayment()">Submit Proof</button>
                <p id="status" class="status-msg">Request sent! Wait for approval.</p>
            </div>
        </div>
    </div>

    <script>
        function copyNumber() {
            var num = document.getElementById("accountNo").innerText;
            navigator.clipboard.writeText(num);
            alert("Number Copied: " + num);
        }

        function submitPayment() {
            const amount = document.getElementById("amount").value;
            const file = document.getElementById("screenshot").files[0];

            if(amount && file) {
                document.getElementById("status").style.display = "block";
                // یہاں ہم Firebase کا کوڈ ڈالیں گے تاکہ فوٹو آپ کے ڈیٹا بیس میں جائے
                console.log("Submitting:", amount, file.name);
            } else {
                alert("Please fill all fields and upload screenshot.");
            }
        }
    </script>
</body>
</html>
