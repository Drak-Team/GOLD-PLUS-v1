<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const username = localStorage.getItem('userPhone');

    // لنک کاپی کرنے کا فنکشن
    window.copyLink = function() {
        const linkToCopy = document.getElementById('refLink').innerText;
        if(linkToCopy.includes("http")) {
            navigator.clipboard.writeText(linkToCopy).then(() => {
                alert("Referral Link Copied!");
            }).catch(err => {
                // اگر آٹو کاپی کام نہ کرے تو مینوئل طریقہ
                const textArea = document.createElement("textarea");
                textArea.value = linkToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("Referral Link Copied!");
            });
        }
    };

    if (!username) {
        window.location.href = "login.html";
    } else {
        // لنک بنانے کا درست طریقہ
        const currentPath = window.location.href.split('refer.html')[0];
        const finalLink = currentPath + "signup.html?ref=" + username;
        document.getElementById('refLink').innerText = finalLink;

        const userRef = ref(db, 'users/' + username);
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('teamComm').innerText = "Rs. " + (data.teamCommission || 0);
                document.getElementById('lvl1Earn').innerText = "Rs. " + (data.lvl1Commission || 0);
                
                const referrals = data.referrals || {};
                const refKeys = Object.keys(referrals);
                document.getElementById('totalInvited').innerText = refKeys.length;

                if (refKeys.length === 0) {
                    document.getElementById('inviteList').innerHTML = "<p style='text-align:center; font-size:11px; color:#555;'>No members yet.</p>";
                    document.getElementById('activeCount').innerText = "0";
                } else {
                    renderInviteList(refKeys, referrals);
                }
            }
        });
    }

    async function renderInviteList(refKeys, referralData) {
        let activeCount = 0;
        let listHTML = "";

        try {
            const allUsersSnap = await get(ref(db, 'users'));
            const allUsers = allUsersSnap.val() || {};

            refKeys.forEach(refPhone => {
                const userData = allUsers[refPhone];
                const isActivated = userData && userData.plan && userData.plan !== "" && userData.plan !== "No Active Plan";
                
                if (isActivated) activeCount++;

                const joinTime = referralData[refPhone].joinTime || "N/A";
                const statusClass = isActivated ? "active-tag" : "pending-tag";
                const statusText = isActivated ? "Activated" : "Pending";

                listHTML += `
                    <div class="invite-row">
                        <div class="user-info">
                            <h5>User: ${refPhone}</h5>
                            <small><i class="far fa-clock"></i> Joined: ${joinTime}</small>
                        </div>
                        <div class="status-tag ${statusClass}">${statusText}</div>
                    </div>
                `;
            });

            document.getElementById('activeCount').innerText = activeCount;
            document.getElementById('inviteList').innerHTML = listHTML;
        } catch (e) {
            console.error("Error loading list", e);
        }
    }
</script>
