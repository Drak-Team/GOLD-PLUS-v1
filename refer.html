<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Refer & Earn</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-gold: #f1c40f; --bg-dark: #0f051d; --card-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1a0b2e, #0f051d); color: white; padding-bottom: 100px; }
        .header { padding: 20px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.2); }
        .header i { color: var(--primary-gold); font-size: 22px; cursor: pointer; }
        .container { padding: 20px; text-align: center; }
        
        .invite-banner { background: linear-gradient(135deg, rgba(241, 196, 15, 0.2), rgba(230, 126, 34, 0.1)); border-radius: 30px; padding: 25px; border: 1px solid var(--glass-border); margin-bottom: 20px; }
        .invite-banner i { font-size: 40px; color: var(--primary-gold); margin-bottom: 10px; }

        .spin-box { background: #f1c40f; color: #000; padding: 15px; border-radius: 15px; margin-bottom: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        .referral-box { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 25px; }
        .link-input { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; color: var(--primary-gold); font-size: 13px; word-break: break-all; margin-bottom: 15px; text-align: left; min-height: 20px; }
        .share-btn { background: linear-gradient(90deg, #f1c40f, #e67e22); color: #000; border: none; width: 100%; padding: 15px; border-radius: 18px; font-weight: bold; cursor: pointer; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #110720; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--glass-border); }
        .nav-item { text-align: center; color: #555; text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--primary-gold); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="header">
    <i class="fas fa-arrow-left" onclick="window.location.href='dashboard.html'"></i>
    <h2>Invite Friends</h2>
</div>

<div class="container">
    <div class="invite-banner">
        <i class="fas fa-gift"></i>
        <h3>Refer & Earn</h3>
        <p>Active Referrals: <b id="activeCount" style="color: #00ff64;">0</b></p>
    </div>

    <div class="spin-box" onclick="window.location.href='spin.html'">
        <span><i class="fas fa-dharmachakra"></i> LUCKY SPIN WHEEL</span>
        <i class="fas fa-chevron-right"></i>
    </div>

    <div class="referral-box">
        <label style="font-size: 11px; color: #aaa; display: block; margin-bottom: 10px; text-align: left;">YOUR UNIQUE REFERRAL LINK</label>
        <div class="link-input" id="refLink">Loading your link...</div>
        <button class="share-btn" onclick="copyLink()"><i class="fas fa-copy"></i> Copy Link</button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-house"></i>HOME</a>
    <a href="mining.html" class="nav-item"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-item active"><i class="fas fa-users"></i>INVITE</a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i>PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const username = localStorage.getItem('userPhone'); // اب ہم یوزرنیم استعمال کر رہے ہیں

    window.onload = async function() {
        if (!username) {
            document.getElementById('refLink').innerText = "Please login first!";
            return;
        }

        try {
            // اب ہم یوزرنیم کو ہی لنک میں استعمال کریں گے تاکہ لنک خوبصورت لگے
            // لنک ایسا بنے گا: ...signup.html?ref=ahmad786
            const finalLink = "https://drak-team.github.io/GOLD-PLUS-v1/signup.html?ref=" + username;
            
            document.getElementById('refLink').innerText = finalLink;

            // ایکٹو ممبرز گننا
            const snapshot = await get(ref(db, 'users'));
            let activeCount = 0;
            if (snapshot.exists()) {
                const allUsers = snapshot.val();
                for(let key in allUsers) {
                    if(allUsers[key].referBy === username) {
                        activeCount++;
                    }
                }
            }
            document.getElementById('activeCount').innerText = activeCount;

        } catch (e) {
            console.error(e);
            document.getElementById('refLink').innerText = "Error loading link";
        }
    };

    window.copyLink = function() {
        const linkToCopy = document.getElementById('refLink').innerText;
        if(linkToCopy.includes("http")) {
            navigator.clipboard.writeText(linkToCopy).then(() => {
                alert("Referral Link Copied!");
            });
        }
    };
</script>
</body>
</html>
