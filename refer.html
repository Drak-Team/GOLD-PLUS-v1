<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userPhone = localStorage.getItem('userPhone');

    window.onload = async function() {
        if (!userPhone) return;

        try {
            // یوزر کا ڈیٹا حاصل کریں تاکہ نام نکالا جا سکے
            const userSnap = await get(ref(db, 'users/' + userPhone));
            if (userSnap.exists()) {
                const userData = userSnap.val();
                const userName = userData.name.replace(/\s+/g, ''); // سپیس ختم کرنے کے لیے
                
                // خوبصورت لنک: نام + فون کے آخری 3 ہندسے (تاکہ لنک یونیک رہے)
                const uniqueID = userName + userPhone.slice(-3);
                const finalLink = "https://drak-team.github.io/GOLD-PLUS-v1/signup.html?ref=" + userPhone;
                
                // دکھانے کے لیے خوبصورت ٹیکسٹ
                document.getElementById('refLink').innerText = "https://drak-team.github.io/GOLD-PLUS-v1/signup.html?id=" + uniqueID;
                
                // اصل ریفرل ڈیٹا (فون نمبر) ہم چھپا کر رکھیں گے لیکن کاپی وہی ہوگا
                document.getElementById('refLink').setAttribute('data-full-link', finalLink);
            }

            // ایکٹو ممبرز گننا
            const snapshot = await get(ref(db, 'users'));
            let activeCount = 0;
            if (snapshot.exists()) {
                const allUsers = snapshot.val();
                for(let key in allUsers) {
                    if(allUsers[key].referBy === userPhone) activeCount++;
                }
            }
            document.getElementById('activeCount').innerText = activeCount;

        } catch (e) {
            console.error("Error loading referral data", e);
        }
    };

    window.copyLink = function() {
        // ہم اصلی لنک کاپی کریں گے جس میں نمبر ہے تاکہ سسٹم بونس صحیح دے، 
        // لیکن یوزر کو اسکرین پر صرف نام والا لنک نظر آئے گا
        const linkToCopy = document.getElementById('refLink').getAttribute('data-full-link');
        navigator.clipboard.writeText(linkToCopy).then(() => {
            alert("Professional Referral Link Copied!");
        });
    };
</script>
