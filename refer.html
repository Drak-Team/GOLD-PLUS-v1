<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Report - Gold Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --dark: #050505; --card: #111; }
        body { background: var(--dark); color: #fff; font-family: sans-serif; margin: 0; padding: 20px 15px 100px 15px; }
        .header { text-align: center; padding: 20px; border-bottom: 1px solid #222; }
        
        /* Referral Link Box */
        .refer-box { background: linear-gradient(145deg, #1a1a1a, #000); border: 1px dashed var(--gold); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .link-text { background: #000; padding: 10px; border-radius: 8px; font-size: 12px; color: var(--gold); display: block; margin: 10px 0; word-break: break-all; }
        .copy-btn { background: var(--gold); border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Team Stats Grid */
        .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .team-card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .team-card i { color: var(--gold); font-size: 20px; margin-bottom: 10px; }
        .team-card h3 { margin: 5px 0; font-size: 18px; }
        .team-card p { margin: 0; font-size: 11px; color: #888; text-transform: uppercase; }

        /* Bottom Navbar */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-link { color: #666; text-decoration: none; font-size: 10px; text-align: center; }
        .nav-link i { font-size: 20px; display: block; margin-bottom: 5px; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color:var(--gold)">REFER & EARN</h2>
        <p style="font-size:12px; color:#aaa">Get 10% commission on every friend's deposit</p>
    </div>

    <div class="refer-box">
        <p style="margin:0">Your Referral Link</p>
        <span id="refLink" class="link-text">https://drak-team.github.io/GOLD-PLUS-v1/singup.html?ref=USER123</span>
        <button class="copy-btn" onclick="copyLink()">COPY LINK</button>
    </div>

    <div class="team-grid">
        <div class="team-card">
            <i class="fa-solid fa-users"></i>
            <h3 id="tSize">0</h3>
            <p>Team Size</p>
        </div>
        <div class="team-card">
            <i class="fa-solid fa-hand-holding-dollar"></i>
            <h3 id="tRecharge">Rs. 0</h3>
            <p>Team Recharge</p>
        </div>
        <div class="team-card">
            <i class="fa-solid fa-sack-dollar"></i>
            <h3 id="tIncome">Rs. 0</h3>
            <p>Refer Income</p>
        </div>
        <div class="team-card">
            <i class="fa-solid fa-users-viewfinder"></i>
            <h3 id="activeTeams">0</h3>
            <p>Active Members</p>
        </div>
    </div>

    <div class="nav-bar">
        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-house"></i>Home</a>
        <a href="plans.html" class="nav-link"><i class="fa-solid fa-gem"></i>Plans</a>
        <a href="refer.html" class="nav-link active"><i class="fa-solid fa-users"></i>Team</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i>Profile</a>
    </div>

    <script>
        function copyLink() {
            const link = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(link);
            alert("Referral link copied!");
        }
    </script>
</body>
</html>
