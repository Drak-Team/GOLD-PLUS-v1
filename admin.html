<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gold Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0a0414;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: white; padding: 20px; padding-bottom: 50px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .admin-header h2 { color: var(--primary-gold); margin: 0; font-size: 20px; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box { background: var(--card-bg); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); text-align: center; }
        .stat-box b { font-size: 18px; color: var(--primary-gold); display: block; }
        .stat-box span { font-size: 11px; color: #aaa; }

        .section-title { font-size: 14px; color: var(--primary-gold); margin: 25px 0 15px; text-transform: uppercase; letter-spacing: 1px; border-left: 3px solid var(--primary-gold); padding-left: 10px; }

        /* Common Card Style */
        .admin-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; margin-bottom: 15px; }
        
        /* Withdrawal Styles */
        .req-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .req-info h4 { margin: 0; font-size: 14px; }
        .req-info p { margin: 2px 0; font-size: 11px; color: #888; }
        .amount { color: var(--primary-gold); font-weight: bold; font-size: 16px; }

        /* Chat Styles */
        .chat-item { border-left: 2px solid #444; padding-left: 15px; }
        .user-msg { font-size: 13px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; margin: 5px 0; }
        .reply-box { display: flex; gap: 8px; margin-top: 10px; }
        .reply-box input { flex: 1; background: #000; border: 1px solid var(--glass-border); padding: 8px; border-radius: 8px; color: white; font-size: 12px; outline: none; }
        .reply-btn { background: var(--primary-gold); border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .approve-btn { flex: 1; padding: 10px; background: #00ff6422; border: 1px solid #00ff64; color: #00ff64; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .reject-btn { flex: 1; padding: 10px; background: #ff444422; border: 1px solid #ff4444; color: #ff4444; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-header">
    <h2><i class="fas fa-user-shield"></i> Admin Panel</h2>
    <span id="adminName">Ahmad Nafees</span>
</div>

<div class="stat-grid">
    <div class="stat-box"><span>Pending Withdraws</span><b id="pendingReq">0</b></div>
    <div class="stat-box"><span>Support Tickets</span><b id="activeChats">0</b></div>
</div>

<div class="section-title">Withdraw Requests</div>
<div id="withdrawContainer"><p style="text-align: center; color: #444;">Loading...</p></div>

<div class="section-title">Support Messages</div>
<div id="chatContainer"><p style="text-align: center; color: #444;">No messages yet</p></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. Withdrawals Logic
    onValue(ref(db, 'withdrawals'), (snapshot) => {
        const container = document.getElementById('withdrawContainer');
        container.innerHTML = '';
        let count = 0;
        snapshot.forEach((userSnapshot) => {
            const uid = userSnapshot.key;
            userSnapshot.forEach((reqSnap) => {
                const rid = reqSnap.key;
                const data = reqSnap.val();
                if(data.status === "Pending") {
                    count++;
                    container.innerHTML += `
                        <div class="admin-card">
                            <div class="req-info">
                                <div><h4>${data.accountName}</h4><p>${data.method}: ${data.accountNumber}</p></div>
                                <div class="amount">$${data.amount}</div>
                            </div>
                            <div class="btn-group">
                                <button class="approve-btn" onclick="handleReq('${uid}', '${rid}', 'Approved')">Approve</button>
                                <button class="reject-btn" onclick="handleReq('${uid}', '${rid}', 'Rejected')">Reject</button>
                            </div>
                        </div>`;
                }
            });
        });
        document.getElementById('pendingReq').innerText = count;
        if(count === 0) container.innerHTML = '<p style="text-align:center;color:#444;">No pending withdrawals</p>';
    });

    // 2. Chat Support Logic
    onValue(ref(db, 'support'), (snapshot) => {
        const chatContainer = document.getElementById('chatContainer');
        chatContainer.innerHTML = '';
        let chatCount = 0;

        snapshot.forEach((userChat) => {
            const uid = userChat.key;
            const msgs = userChat.val().messages;
            if(!msgs) return;
            
            chatCount++;
            const lastMsg = Object.values(msgs).pop(); // آخری میسج دکھانے کے لیے
            
            chatContainer.innerHTML += `
                <div class="admin-card chat-item">
                    <div style="font-size:12px; color:var(--primary-gold); font-weight:bold;">User ID: ${uid.substring(0,8)}</div>
                    <div class="user-msg"><b>User:</b> ${lastMsg.text}</div>
                    <div class="reply-box">
                        <input type="text" id="reply_${uid}" placeholder="Type reply...">
                        <button class="reply-btn" onclick="sendReply('${uid}')">Reply</button>
                    </div>
                </div>`;
        });
        document.getElementById('activeChats').innerText = chatCount;
    });

    // Actions
    window.handleReq = (uid, rid, status) => {
        update(ref(db, `withdrawals/${uid}/${rid}`), { status: status }).then(() => alert("Success!"));
    };

    window.sendReply = (uid) => {
        const text = document.getElementById(`reply_${uid}`).value;
        if(!text) return;
        const msgRef = ref(db, `support/${uid}/messages`);
        push(msgRef, {
            sender: 'admin',
            text: text,
            date: new Date().toDateString()
        }).then(() => {
            alert("Reply sent!");
            document.getElementById(`reply_${uid}`).value = '';
        });
    };

</script>
</body>
</html>
