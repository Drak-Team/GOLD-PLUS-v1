<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #d4af37; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #d4af37; color: white; }
        .proof-img { width: 100px; cursor: pointer; border-radius: 5px; }
        .btn-approve { background: green; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 5px; }
        .btn-reject { background: red; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pending Deposits</h2>
    <table id="depositTable">
        <thead>
            <tr>
                | Amount (PKR) | Screenshot | Action |
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ڈیٹا بیس سے ڈپازٹ کی درخواستیں نکالنا
    onSnapshot(collection(db, "deposits"), (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";
        
        snapshot.forEach((docData) => {
            const data = docData.data();
            if(data.status === "pending") {
                const row = `<tr>
                    <td>${data.amount}</td>
                    <td><a href="${data.url}" target="_blank"><img src="${data.url}" class="proof-img"></a></td>
                    <td>
                        <button class="btn-approve" onclick="approveDeposit('${docData.id}')">Approve</button>
                        <button class="btn-reject" onclick="rejectDeposit('${docData.id}')">Reject</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            }
        });
    });

    // اپروو کرنے کا فنکشن
    window.approveDeposit = async (id) => {
        if(confirm("Are you sure you want to approve this?")) {
            await updateDoc(doc(db, "deposits", id), { status: "approved" });
            alert("Payment Approved!");
        }
    };

    // ریجیکٹ کرنے کا فنکشن
    window.rejectDeposit = async (id) => {
        if(confirm("Reject this payment?")) {
            await deleteDoc(doc(db, "deposits", id));
            alert("Payment Rejected!");
        }
    };
</script>

</body>
</html>
