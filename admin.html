<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, runTransaction, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. Deposits Logic (فون نمبر کی بنیاد پر)
    onValue(ref(db, 'deposits'), (snapshot) => {
        const container = document.getElementById('depositContainer');
        if(!container) return;
        container.innerHTML = '';
        let count = 0;
        snapshot.forEach((childSnap) => {
            const data = childSnap.val();
            const rid = childSnap.key; 
            if(data.status === "Pending") {
                count++;
                container.innerHTML += `
                    <div class="admin-card" style="background:#1a0b2e; border:1px solid #f1c40f; padding:15px; margin-bottom:10px; border-radius:15px;">
                        <div class="req-info" style="display:flex; justify-content:space-between;">
                            <div>
                                <h4 style="margin:0; color:#f1c40f;">User: ${data.phone || data.username}</h4>
                                <p style="font-size:12px; color:#aaa;">TID: ${data.tid}</p>
                            </div>
                            <div class="amount" style="font-weight:bold; color:#00ff00;">$${data.amount}</div>
                        </div>
                        <div style="margin:10px 0;">
                            <p style="font-size:10px; color:#eee;">Payment Screenshot:</p>
                            <img src="${data.screenshot}" style="width:100px; border-radius:10px; cursor:pointer; border:1px solid #333;" onclick="window.open(this.src)">
                        </div>
                        <div class="btn-group" style="display:flex; gap:10px;">
                            <button style="background:#f1c40f; color:#000; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;" onclick="handleDeposit('${data.phone || data.username}', '${rid}', '${data.amount}')">Approve</button>
                            <button style="background:#ff3232; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;" onclick="updateStatus('deposits', '${rid}', 'Rejected')">Reject</button>
                        </div>
                    </div>`;
            }
        });
        document.getElementById('pendingDep').innerText = count;
    });

    // 2. Withdrawals Logic
    onValue(ref(db, 'withdrawals'), (snapshot) => {
        const container = document.getElementById('withdrawContainer');
        if(!container) return;
        container.innerHTML = '';
        let count = 0;
        snapshot.forEach((childSnap) => {
            const data = childSnap.val();
            const rid = childSnap.key;
            if(data.status === "Pending") {
                count++;
                container.innerHTML += `
                    <div class="admin-card" style="background:#1a0b2e; border:1px solid #f1c40f; padding:15px; margin-bottom:10px; border-radius:15px;">
                        <div class="req-info" style="display:flex; justify-content:space-between;">
                            <div>
                                <h4 style="margin:0; color:#f1c40f;">User: ${data.phone || data.username}</h4>
                                <p style="font-size:12px; color:#aaa;">${data.method}: ${data.accountNumber}</p>
                            </div>
                            <div class="amount" style="font-weight:bold; color:#ff3232;">$${data.amount}</div>
                        </div>
                        <div class="btn-group" style="display:flex; gap:10px; margin-top:10px;">
                            <button style="background:#f1c40f; color:#000; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;" onclick="updateStatus('withdrawals', '${rid}', 'Approved')">Approve</button>
                            <button style="background:#ff3232; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;" onclick="handleWithdrawReject('${data.phone || data.username}', '${rid}', '${data.amount}')">Reject & Refund</button>
                        </div>
                    </div>`;
            }
        });
        document.getElementById('pendingWith').innerText = count;
    });

    // --- فنکشنز ---

    window.handleDeposit = (userID, rid, amount) => {
        if(!userID) return alert("User ID missing!");
        const userBalanceRef = ref(db, `users/${userID}/balance`);
        runTransaction(userBalanceRef, (current) => {
            return (parseFloat(current) || 0) + parseFloat(amount);
        }).then(() => {
            update(ref(db, `deposits/${rid}`), { status: 'Approved' });
            alert("Success! $" + amount + " added to " + userID);
        }).catch(err => alert("Error: " + err.message));
    };

    window.handleWithdrawReject = (userID, rid, amount) => {
        const userBalanceRef = ref(db, `users/${userID}/balance`);
        runTransaction(userBalanceRef, (current) => {
            return (parseFloat(current) || 0) + parseFloat(amount);
        }).then(() => {
            update(ref(db, `withdrawals/${rid}`), { status: 'Rejected' });
            alert("Refunded! Amount added back to " + userID);
        });
    };

    window.updateStatus = (path, rid, status) => {
        update(ref(db, `${path}/${rid}`), { status: status }).then(() => alert("Status updated to " + status));
    };
</script>
