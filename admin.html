<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, push, runTransaction, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. Deposits Logic (Username Based)
    onValue(ref(db, 'deposits'), (snapshot) => {
        const container = document.getElementById('depositContainer');
        container.innerHTML = '';
        let count = 0;
        snapshot.forEach((childSnap) => {
            const data = childSnap.val();
            const rid = childSnap.key; // Request ID
            if(data.status === "Pending") {
                count++;
                container.innerHTML += `
                    <div class="admin-card">
                        <div class="req-info">
                            <div><h4>${data.username}</h4><p>TID: ${data.tid}</p></div>
                            <div class="amount">$${data.amount}</div>
                        </div>
                        <img src="${data.screenshot}" class="proof-img" onclick="window.open(this.src)">
                        <div class="btn-group">
                            <button class="approve-btn" onclick="handleDeposit('${data.username}', '${rid}', '${data.amount}')">Approve</button>
                            <button class="reject-btn" onclick="updateStatus('deposits', '${rid}', 'Rejected')">Reject</button>
                        </div>
                    </div>`;
            }
        });
        document.getElementById('pendingDep').innerText = count;
    });

    // 2. Withdrawals Logic (Username Based)
    onValue(ref(db, 'withdrawals'), (snapshot) => {
        const container = document.getElementById('withdrawContainer');
        container.innerHTML = '';
        let count = 0;
        snapshot.forEach((childSnap) => {
            const data = childSnap.val();
            const rid = childSnap.key;
            if(data.status === "Pending") {
                count++;
                container.innerHTML += `
                    <div class="admin-card">
                        <div class="req-info">
                            <div><h4>${data.username}</h4><p>${data.method}: ${data.accountNumber}</p></div>
                            <div class="amount">$${data.amount}</div>
                        </div>
                        <div class="btn-group">
                            <button class="approve-btn" onclick="updateStatus('withdrawals', '${rid}', 'Approved')">Approve</button>
                            <button class="reject-btn" onclick="handleWithdrawReject('${data.username}', '${rid}', '${data.amount}')">Reject & Refund</button>
                        </div>
                    </div>`;
            }
        });
        document.getElementById('pendingWith').innerText = count;
    });

    // --- اہم فنکشنز ---

    // ڈپازٹ اپروو کرنا اور یوزر کے بیلنس میں جمع کرنا
    window.handleDeposit = (userID, rid, amount) => {
        const userBalanceRef = ref(db, `users/${userID}/balance`);
        runTransaction(userBalanceRef, (current) => {
            return (current || 0) + parseFloat(amount);
        }).then(() => {
            update(ref(db, `deposits/${rid}`), { status: 'Approved' });
            alert("Deposit Approved! $"+amount+" added to " + userID);
        });
    };

    // ودڈرال ریجیکٹ کرنا (اور پیسے واپس یوزر کو دینا)
    window.handleWithdrawReject = (userID, rid, amount) => {
        const userBalanceRef = ref(db, `users/${userID}/balance`);
        runTransaction(userBalanceRef, (current) => {
            return (current || 0) + parseFloat(amount);
        }).then(() => {
            update(ref(db, `withdrawals/${rid}`), { status: 'Rejected' });
            alert("Withdraw Rejected! Amount refunded to " + userID);
        });
    };

    // اسٹیٹس اپڈیٹ کرنا
    window.updateStatus = (path, rid, status) => {
        update(ref(db, `${path}/${rid}`), { status: status }).then(() => alert("Request " + status));
    };
    
    // (Support Chat والا حصہ بھی اسی طرح یوزر نیم پر اپڈیٹ کر دیں)
</script>
