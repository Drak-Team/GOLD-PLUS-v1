<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #d4af37; color: white; }
        .proof-img { width: 80px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Pending Deposits</h2>
    <table>
        <thead>
            <tr><th>Amount</th><th>Screenshot</th><th>Action</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "deposits"), (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";
        snapshot.forEach((docData) => {
            const data = docData.data();
            if(data.status === "pending") {
                const row = `<tr>
                    <td>${data.amount}</td>
                    <td><a href="${data.screenshotUrl}" target="_blank"><img src="${data.screenshotUrl}" class="proof-img"></a></td>
                    <td>
                        <button onclick="approve('${docData.id}')" style="background:green; color:white;">Approve</button>
                        <button onclick="reject('${docData.id}')" style="background:red; color:white;">Reject</button>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            }
        });
    });

    window.approve = async (id) => { await updateDoc(doc(db, "deposits", id), { status: "approved" }); alert("Approved!"); };
    window.reject = async (id) => { await deleteDoc(doc(db, "deposits", id)); alert("Rejected!"); };
</script>
</body>
</html>
