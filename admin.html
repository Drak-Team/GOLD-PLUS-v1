<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gold Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: #0a0414; color: white; padding: 20px;
        }

        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .admin-header h2 { color: var(--primary-gold); margin: 0; font-size: 20px; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box { background: var(--card-bg); padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border); text-align: center; }
        .stat-box span { font-size: 11px; color: #aaa; display: block; }
        .stat-box b { font-size: 18px; color: var(--primary-gold); }

        .section-title { font-size: 14px; color: #aaa; margin: 20px 0 10px; text-transform: uppercase; }

        /* Request Cards */
        .req-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 15px; margin-bottom: 15px;
        }
        .req-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .req-info div h4 { margin: 0; font-size: 14px; }
        .req-info div p { margin: 2px 0; font-size: 11px; color: #888; }
        
        .amount { color: var(--primary-gold); font-weight: bold; font-size: 16px; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .approve-btn { flex: 1; padding: 10px; background: #00ff6422; border: 1px solid #00ff64; color: #00ff64; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .reject-btn { flex: 1; padding: 10px; background: #ff444422; border: 1px solid #ff4444; color: #ff4444; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-header">
    <h2><i class="fas fa-user-shield"></i> Admin Panel</h2>
    <span id="adminName">Ahmad Nafees</span>
</div>

<div class="stat-grid">
    <div class="stat-box">
        <span>Total Users</span>
        <b id="totalUsers">0</b>
    </div>
    <div class="stat-box">
        <span>Pending Req.</span>
        <b id="pendingReq">0</b>
    </div>
</div>

<div class="section-title">Pending Withdrawals</div>
<div id="withdrawContainer">
    <p style="text-align: center; color: #444;">No pending requests</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ریکویسٹ لوڈ کرنے کا فنکشن
    const fetchRequests = () => {
        const withdrawRef = ref(db, 'withdrawals');
        onValue(withdrawRef, (snapshot) => {
            const container = document.getElementById('withdrawContainer');
            container.innerHTML = '';
            let count = 0;

            snapshot.forEach((userSnapshot) => {
                const userId = userSnapshot.key;
                userSnapshot.forEach((requestSnapshot) => {
                    const reqId = requestSnapshot.key;
                    const reqData = requestSnapshot.val();

                    if(reqData.status === "Pending") {
                        count++;
                        const html = `
                            <div class="req-card">
                                <div class="req-info">
                                    <div>
                                        <h4>${reqData.accountName} (${reqData.method})</h4>
                                        <p>Acc: ${reqData.accountNumber}</p>
                                        <p>Date: ${reqData.date}</p>
                                    </div>
                                    <div class="amount">$${reqData.amount}</div>
                                </div>
                                <div class="btn-group">
                                    <button class="approve-btn" onclick="handleReq('${userId}', '${reqId}', 'Approved')">Approve</button>
                                    <button class="reject-btn" onclick="handleReq('${userId}', '${reqId}', 'Rejected')">Reject</button>
                                </div>
                            </div>
                        `;
                        container.innerHTML += html;
                    }
                });
            });
            document.getElementById('pendingReq').innerText = count;
        });
    };

    // اپروو یا ریجیکٹ کرنے کا فنکشن
    window.handleReq = (uid, rid, status) => {
        update(ref(db, `withdrawals/${uid}/${rid}`), { status: status })
        .then(() => alert("Request " + status));
    };

    fetchRequests();
</script>

</body>
</html>
