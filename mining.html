<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { /* آپ کی وہی کنفیگریشن */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const phone = localStorage.getItem('userPhone');

    // فرض کریں ہر یوزر کو روزانہ 10 ٹاسک کرنے ہیں
    const TOTAL_TASKS_REQUIRED = 10; 
    let currentTaskCount = 0;

    const products = ["iPhone 15 Pro", "MacBook Air M2", "Apple Watch Ultra", "Samsung S24"];

    function loadTask(){
        const random = products[Math.floor(Math.random()*products.length)];
        document.getElementById("productName").innerText = random;
        document.getElementById("price").value = "";
        document.getElementById("category").value = "";
        
        // ٹاسک کی تعداد دکھانا
        document.getElementById("msg").innerText = `Progress: ${currentTaskCount} / ${TOTAL_TASKS_REQUIRED}`;
        document.getElementById("msg").style.color = "#aaa";
    }

    window.submitTask = async function(){
        let price = document.getElementById("price").value;
        let cat = document.getElementById("category").value;
        let btn = document.getElementById("taskBtn");
        let msg = document.getElementById("msg");

        if(price == "" || cat == ""){
            alert("Please fill all fields!");
            return;
        }

        btn.disabled = true;
        currentTaskCount++;

        if(currentTaskCount < TOTAL_TASKS_REQUIRED){
            // ابھی ٹاسک باقی ہیں
            msg.innerText = `✅ Task ${currentTaskCount} Verified! Next...`;
            msg.style.color = "#00ff64";
            setTimeout(loadTask, 1500);
        } else {
            // سارے ٹاسک مکمل ہو گئے، اب بیلنس ایڈ ہوگا اور مائننگ شروع ہوگی
            msg.innerText = "🚀 All Tasks Done! Activating Mining...";
            
            try {
                const result = await runTransaction(ref(db, 'users/' + phone), (user) => {
                    if (user) {
                        // پیکج کے حساب سے ڈیلی ارننگ ایڈ کریں (مثلاً $1.50)
                        const dailyProfit = user.dailyEarning || 0.50; 
                        user.balance = (user.balance || 0) + dailyProfit;
                        user.lastClaim = Date.now(); // مائننگ لاک کر دیں 24 گھنٹے کے لیے
                        return user;
                    }
                });

                if(result.committed){
                    alert("Congratulations! Daily profit added and AI Mining activated.");
                    location.reload(); // پیج ریفریش تاکہ مائننگ اسٹارٹ نظر آئے
                }
            } catch (e) {
                console.error(e);
            }
        }
    }

    loadTask();
</script>
