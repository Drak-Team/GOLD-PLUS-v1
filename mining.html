<style>
    .expert-container { margin-top: 20px; text-align: left; }
    .expert-card { 
        background: rgba(255, 255, 255, 0.04); 
        border: 1px solid rgba(255,255,255,0.1); 
        border-radius: 15px; 
        padding: 12px; 
        margin-bottom: 10px; 
        display: flex; 
        align-items: center; 
        justify-content: space-between;
    }
    .expert-info { display: flex; align-items: center; gap: 10px; }
    .expert-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary-gold); }
    .expert-meta b { display: block; font-size: 13px; color: #fff; }
    .expert-meta span { font-size: 10px; color: #00ff64; }
    
    .copy-btn-sm { 
        background: var(--primary-gold); 
        color: #000; 
        border: none; 
        padding: 6px 12px; 
        border-radius: 8px; 
        font-size: 11px; 
        font-weight: bold; 
        cursor: pointer; 
    }
    
    .live-badge { 
        background: red; 
        color: white; 
        font-size: 8px; 
        padding: 2px 5px; 
        border-radius: 4px; 
        margin-left: 5px; 
        animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }
</style>

<div class="trade-card">
    <div class="trade-title">
        <i class="fas fa-users-gear"></i> TOP COPY TRADERS <span class="live-badge">LIVE</span>
    </div>
    
    <div id="expertList" class="expert-container">
        </div>

    <div style="margin-top: 20px;">
        <label style="font-size: 11px; color: #aaa; display: block; margin-bottom: 5px;">CUSTOM TRADE AMOUNT ($5 - $300)</label>
        <input type="number" id="customTrade" value="5" min="5" max="300" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid #333; color: gold; border-radius: 10px; text-align: center; font-weight: bold;">
        <button class="action-btn" onclick="startCustomTrade()" style="margin-top: 15px; background: var(--gold-grad);">START COPY TRADING</button>
    </div>
</div>

<script type="module">
    // Firebase Config (Puraana wala hi use karein)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Fake Profiles Data
    const experts = [
        { name: "Alex Crypto", img: "https://i.pravatar.cc/150?u=1", roi: "450%" },
        { name: "Zain Master", img: "https://i.pravatar.cc/150?u=2", roi: "312%" },
        { name: "Sarah Trade", img: "https://i.pravatar.cc/150?u=3", roi: "580%" },
        { name: "Pro Scalper", img: "https://i.pravatar.cc/150?u=4", roi: "290%" }
    ];

    function loadExperts() {
        const list = document.getElementById('expertList');
        list.innerHTML = '';
        experts.forEach(ex => {
            // Har 4 ghante baad ROI change karne ka logic (Random)
            const randomROI = (Math.random() * (600 - 200) + 200).toFixed(1);
            list.innerHTML += `
                <div class="expert-card">
                    <div class="expert-info">
                        <img src="${ex.img}">
                        <div class="expert-meta">
                            <b>${ex.name}</b>
                            <span>ROI: +${randomROI}%</span>
                        </div>
                    </div>
                    <button class="copy-btn-sm" onclick="setTradeAmount(25)">Copy</button>
                </div>
            `;
        });
    }

    window.setTradeAmount = (amt) => {
        document.getElementById('customTrade').value = amt;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    };

    window.startCustomTrade = async () => {
        const phone = localStorage.getItem('userPhone');
        const amt = parseFloat(document.getElementById('customTrade').value);

        if (amt < 5 || amt > 300) {
            alert("Min $5 and Max $300 allowed!");
            return;
        }

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const snap = await get(ref(db, 'users/' + phone));
        const balance = snap.val().balance || 0;

        if (balance < amt) {
            alert("Insufficient Balance!");
            return;
        }

        if(confirm(`Confirm copy trade of $${amt}?`)) {
            await runTransaction(ref(db, 'users/' + phone), (u) => {
                if (u) { u.balance -= amt; return u; }
            });
            alert("Expert started trading with your $" + amt + ". Results will be shown in 24 hours.");
            location.reload();
        }
    };

    window.onload = () => {
        loadExperts();
        // Har 4 ghante (14400000 ms) baad update karne ke liye
        setInterval(loadExperts, 14400000); 
    };
</script>
