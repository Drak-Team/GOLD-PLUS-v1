<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userPhone = localStorage.getItem('userPhone');

    // 1. ہولڈنگ پلان خریدنے کا فنکشن
    window.buyHold = async function(pkrAmount) {
        if (!userPhone) return alert("Please Login First");

        // ڈالر میں قیمت (تقریباً)
        let usdPrice = (pkrAmount === 3000) ? 10.80 : (pkrAmount === 7000) ? 25.20 : 39.60;
        let dailyProfit = usdPrice * 0.10; // 10% ڈیلی پرافٹ

        const userRef = ref(db, 'users/' + userPhone);
        const snap = await get(userRef);

        if (snap.exists()) {
            const currentBalance = snap.val().balance || 0;

            if (currentBalance < usdPrice) {
                alert("In-sufficient Balance! You need $" + usdPrice);
                return;
            }

            if (confirm(`Do you want to hold $${usdPrice} for 15 days?`)) {
                try {
                    // بیلنس کاٹنا
                    await runTransaction(ref(db, `users/${userPhone}/balance`), (curr) => curr - usdPrice);

                    // ہولڈ ڈیٹا سیو کرنا
                    const holdId = "hold_" + Date.now();
                    const expiryDate = new Date();
                    expiryDate.setDate(expiryDate.getDate() + 15);

                    await set(ref(db, `users/${userPhone}/activeHolds/${holdId}`), {
                        amount: usdPrice,
                        dailyProfit: dailyProfit,
                        startDate: new Date().toISOString(),
                        expiryDate: expiryDate.toISOString(),
                        lastClaim: new Date().toISOString(),
                        status: "active"
                    });

                    alert("Plan Activated! $"+usdPrice+" has been held for 15 days.");
                    location.reload();
                } catch (e) {
                    alert("Transaction Failed!");
                }
            }
        }
    };

    // 2. ڈیلی پرافٹ آٹو کیلکولیٹ کرنا (جب یوزر پیج کھولے گا)
    async function checkHoldProfits() {
        if (!userPhone) return;
        const holdRef = ref(db, `users/${userPhone}/activeHolds`);
        const snapshot = await get(holdRef);

        if (snapshot.exists()) {
            snapshot.forEach(async (child) => {
                const hold = child.val();
                const holdId = child.key;
                
                if (hold.status === "active") {
                    const now = new Date();
                    const lastClaim = new Date(hold.lastClaim);
                    const expiry = new Date(hold.expiryDate);

                    // چیک کریں کہ کیا 24 گھنٹے گزر گئے ہیں؟
                    const diffHours = (now - lastClaim) / (1000 * 60 * 60);

                    if (diffHours >= 24 && now <= expiry) {
                        const daysToPay = Math.floor(diffHours / 24);
                        const totalReward = daysToPay * hold.dailyProfit;

                        // بیلنس میں پرافٹ ڈالنا
                        await runTransaction(ref(db, `users/${userPhone}/balance`), (curr) => (curr || 0) + totalReward);
                        
                        // آخری کلیم ٹائم اپ ڈیٹ کرنا
                        await update(ref(db, `users/${userPhone}/activeHolds/${holdId}`), {
                            lastClaim: now.toISOString()
                        });
                        
                        console.log("Daily profit added: $" + totalReward);
                    }
                    
                    // اگر 15 دن پورے ہو گئے تو ہولڈ ختم
                    if (now > expiry) {
                        await update(ref(db, `users/${userPhone}/activeHolds/${holdId}`), { status: "completed" });
                        // اصل رقم واپس کرنا
                        await runTransaction(ref(db, `users/${userPhone}/balance`), (curr) => (curr || 0) + hold.amount);
                        alert("Your 15-day hold period is over! Capital amount returned.");
                    }
                }
            });
        }
    }

    window.onload = function() {
        updateLiveMining(); // آپ کا پرانا مائننگ والا فنکشن
        checkHoldProfits(); // ہولڈنگ چیک کرنے والا فنکشن
    };
</script>
