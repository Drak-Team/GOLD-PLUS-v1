<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Simple Tasks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-gold: #f1c40f; --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f051d; color: white; padding-bottom: 90px; }
        
        .header { padding: 25px 20px; background: rgba(0,0,0,0.3); text-align: center; border-radius: 0 0 30px 30px; border-bottom: 1px solid rgba(241, 196, 15, 0.2); }
        
        .card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(241, 196, 15, 0.1); margin: 20px; padding: 20px; border-radius: 25px; backdrop-filter: blur(10px); text-align: center; }
        
        .product-box { background: rgba(0, 0, 0, 0.4); padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--primary-gold); position: relative; }
        .product-icon { font-size: 40px; color: var(--primary-gold); margin-bottom: 10px; display: block; }

        .task-input { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; font-size: 16px; text-align: center; }

        .btn { background: var(--gold-grad); color: #000; border: none; width: 100%; padding: 16px; border-radius: 15px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top:10px; text-transform: uppercase; }
        .btn:active { transform: scale(0.95); }

        /* Battery Animation */
        .battery-container { width: 45px; height: 22px; border: 2px solid #fff; border-radius: 4px; position: relative; margin-bottom: 5px; }
        .battery-level { height: 100%; background: #00ff00; width: 0%; animation: charge 2s infinite; }
        .battery-container::after { content: ''; position: absolute; right: -6px; top: 4px; width: 4px; height: 10px; background: #fff; }
        @keyframes charge { 0% { width: 0%; } 100% { width: 100%; } }

        .bonus-tag { background: #00ff64; color: #000; font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: bold; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0a0414; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(241, 196, 15, 0.2); }
        .nav-btn { color: #666; text-decoration: none; text-align: center; font-size: 10px; flex: 1; }
        .nav-btn.active { color: #f1c40f; }
        .nav-btn i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="color:var(--primary-gold); margin:0;">WORK STATION</h2>
</div>

<div class="card" id="taskSection">
    <h3 style="margin-top:0;"><i class="fas fa-edit"></i> EASY DATA ENTRY</h3>
    <p style="font-size:12px; color:#aaa; margin-bottom:15px;">Type the price of the item to complete task</p>
    
    <div id="taskContent">
        <div class="product-box">
            <i class="fas fa-mobile-alt product-icon" id="pIcon"></i>
            <span id="productName" style="font-size:20px; font-weight:bold; letter-spacing:1px;">SMARTPHONE</span>
        </div>
        
        <input type="number" id="priceInput" class="task-input" placeholder="Enter Price (e.g. 500)">
        
        <button class="btn" onclick="submitTask()">SUBMIT & NEXT</button>
        <p id="progressMsg" style="font-size:14px; margin-top:15px; font-weight:bold; color:var(--primary-gold);">Progress: 0 / 5</p>
    </div>

    <div id="timerDisplay" style="display:none;">
        <i class="fas fa-check-circle" style="font-size:50px; color:#00ff64; margin-bottom:10px;"></i>
        <h4 style="color:#00ff64; margin:5px;">ALL TASKS DONE!</h4>
        <p style="font-size:12px; color:#aaa;">New tasks will be ready in:</p>
        <h2 id="countdown" style="color:var(--primary-gold); margin:10px 0;">00:00:00</h2>
    </div>
</div>

<div id="miningSection" style="display:none; padding: 0 20px;">
    <div class="card" style="border: 2px solid #00ff64; background: rgba(0,255,100,0.05);">
        <i class="fas fa-coins fa-bounce" style="font-size:40px; color:#00ff64; margin-bottom:10px;"></i>
        <h3 style="margin:5px;">EARNING READY!</h3>
        <button class="btn" style="background:#00ff64;" onclick="startMining()">ADD TO BALANCE</button>
    </div>
</div>

<div class="card">
    <h3 style="margin-top:0;"><i class="fas fa-gift"></i> EXTRA BONUSES</h3>
    <div style="display:grid; gap:10px;">
        <div class="product-box" style="text-align: left; padding:15px; display:flex; align-items:center; justify-content:space-between;">
            <div>
                <div class="battery-container"><div class="battery-level"></div></div>
                <small>Invite 5 Users</small>
            </div>
            <span class="bonus-tag">$1.00</span>
            <button onclick="claimBonus(5, 1)" style="border:none; background:var(--gold-grad); padding:5px 10px; border-radius:5px; font-size:10px; font-weight:bold;">CLAIM</button>
        </div>

        <div class="product-box" style="text-align: left; padding:15px; display:flex; align-items:center; justify-content:space-between;">
            <div>
                <div class="battery-container"><div class="battery-level"></div></div>
                <small>Invite 10 Users</small>
            </div>
            <span class="bonus-tag">$3.00</span>
            <button onclick="claimBonus(10, 3)" style="border:none; background:var(--gold-grad); padding:5px 10px; border-radius:5px; font-size:10px; font-weight:bold;">CLAIM</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <a href="dashboard.html" class="nav-btn"><i class="fas fa-house"></i>HOME</a>
    <a href="mining.html" class="nav-btn active"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-btn"><i class="fas fa-users"></i>REFER</a>
    <a href="profile.html" class="nav-btn"><i class="fas fa-user-gear"></i>PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { /* اپنی کنفیگ یہاں ڈالیں */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const username = localStorage.getItem('userPhone');

    let requiredTasks = 5;
    let doneTasks = 0;
    const items = [
        {name: "IPHONE 15", icon: "fa-mobile-alt"},
        {name: "SMART WATCH", icon: "fa-stopwatch"},
        {name: "LAPTOP PRO", icon: "fa-laptop"},
        {name: "HEADPHONES", icon: "fa-headphones"},
        {name: "TABLET Z", icon: "fa-tablet-alt"}
    ];

    async function checkStatus() {
        const snap = await get(ref(db, 'users/' + username));
        if (snap.exists()) {
            const user = snap.val();
            const lastClaim = user.lastClaim || 0;
            if (Date.now() - lastClaim < 24 * 60 * 60 * 1000) {
                showTimer(lastClaim);
            } else {
                loadNewTask();
            }
        }
    }

    function loadNewTask() {
        const item = items[Math.floor(Math.random()*items.length)];
        document.getElementById('productName').innerText = item.name;
        document.getElementById('pIcon').className = `fas ${item.icon} product-icon`;
        document.getElementById('progressMsg').innerText = `Progress: ${doneTasks} / ${requiredTasks}`;
    }

    window.submitTask = function() {
        const val = document.getElementById('priceInput').value;
        if(!val || val < 10) return alert("Please enter a valid price!");
        
        doneTasks++;
        if(doneTasks >= requiredTasks) {
            document.getElementById('taskSection').style.display = 'none';
            document.getElementById('miningSection').style.display = 'block';
        } else {
            document.getElementById('priceInput').value = "";
            loadNewTask();
        }
    };

    window.startMining = async function() {
        const snap = await get(ref(db, 'users/' + username));
        const user = snap.val();
        const earn = user.dailyEarning || 0.50;
        
        await update(ref(db, 'users/' + username), {
            balance: (user.balance || 0) + earn,
            lastClaim: Date.now()
        });
        alert(`$${earn} added to your balance!`);
        location.reload();
    };

    function showTimer(lastClaim) {
        document.getElementById('taskContent').style.display = 'none';
        document.getElementById('timerDisplay').style.display = 'block';
        setInterval(() => {
            const timeLeft = (lastClaim + 86400000) - Date.now();
            if(timeLeft <= 0) location.reload();
            const h = Math.floor(timeLeft / 3600000);
            const m = Math.floor((timeLeft % 3600000) / 60000);
            const s = Math.floor((timeLeft % 60000) / 1000);
            document.getElementById('countdown').innerText = `${h}h ${m}m ${s}s`;
        }, 1000);
    }

    window.onload = checkStatus;
</script>
</body>
</html>
