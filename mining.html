<style>
    /* Professional Copy Trading Theme */
    .trade-card { 
        background: rgba(255, 255, 255, 0.05); 
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 25px; 
        padding: 20px; 
        margin: 20px; 
        backdrop-filter: blur(15px);
    }

    .section-title {
        color: var(--primary-gold);
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .expert-list { display: flex; flex-direction: column; gap: 15px; }

    .expert-item {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(241, 196, 15, 0.1);
        border-radius: 18px;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: 0.3s;
    }

    .expert-item:hover { border-color: var(--primary-gold); transform: translateY(-2px); }

    .expert-profile { display: flex; align-items: center; gap: 12px; }

    .expert-img-wrapper { position: relative; }
    .expert-img-wrapper img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary-gold); }
    .status-dot { 
        position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; 
        background: #00ff64; border-radius: 50%; border: 2px solid #0f051d; 
    }

    .expert-details b { display: block; font-size: 14px; color: #fff; }
    .expert-details span { font-size: 11px; color: #00ff64; font-weight: bold; }

    .copy-action-btn {
        background: var(--gold-grad);
        color: #000;
        border: none;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
    }

    .trade-input-group {
        margin-top: 25px;
        background: rgba(0,0,0,0.4);
        padding: 15px;
        border-radius: 20px;
        border: 1px dashed rgba(241, 196, 15, 0.3);
    }

    .trade-input-group label { font-size: 11px; color: #aaa; margin-bottom: 10px; display: block; }
    
    .amount-selector {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--primary-gold);
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        outline: none;
        font-family: monospace;
    }

    .main-trade-btn {
        background: var(--gold-grad);
        color: #000;
        width: 100%;
        padding: 16px;
        border-radius: 15px;
        font-weight: 800;
        border: none;
        margin-top: 15px;
        box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
    }
</style>

<div class="trade-card">
    <div class="section-title">
        <i class="fas fa-crown"></i> Elite Copy Traders <span class="live-badge">LIVE</span>
    </div>

    <div class="expert-list" id="expertList">
        </div>

    <div class="trade-input-group">
        <label>ENTER TRADE AMOUNT ($5 - $300)</label>
        <div style="display: flex; align-items: center; justify-content: center;">
            <span style="font-size: 24px; color: var(--primary-gold);">$</span>
            <input type="number" id="customTrade" class="amount-selector" value="5" min="5" max="300">
        </div>
        <button class="main-trade-btn" onclick="startCustomTrade()">
            <i class="fas fa-bolt"></i> START COPY TRADING
        </button>
    </div>
</div>

<script>
    const fakeExperts = [
        { name: "Crypto King", roi: "+542.8%", img: "https://i.pravatar.cc/150?u=a1" },
        { name: "Elite Scalper", roi: "+310.4%", img: "https://i.pravatar.cc/150?u=a2" },
        { name: "Global Trade", roi: "+425.1%", img: "https://i.pravatar.cc/150?u=a3" }
    ];

    function renderExperts() {
        const container = document.getElementById('expertList');
        container.innerHTML = fakeExperts.map(ex => `
            <div class="expert-item">
                <div class="expert-profile">
                    <div class="expert-img-wrapper">
                        <img src="${ex.img}">
                        <div class="status-dot"></div>
                    </div>
                    <div class="expert-details">
                        <b>${ex.name}</b>
                        <span>ROI: ${ex.roi}</span>
                    </div>
                </div>
                <button class="copy-action-btn" onclick="document.getElementById('customTrade').value=50">Copy</button>
            </div>
        `).join('');
    }
    
    // پرافٹ اپڈیٹ کرنے کا فنکشن (ہر 4 گھنٹے بعد خودکار)
    function updateProfits() {
        fakeExperts.forEach(ex => {
            const newRoi = (Math.random() * (600 - 200) + 200).toFixed(1);
            ex.roi = "+" + newRoi + "%";
        });
        renderExperts();
    }

    renderExperts();
    setInterval(updateProfits, 14400000); // 4 گھنٹے
</script>
