<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentBalance = 0.000000;
    const userPhone = localStorage.getItem('userPhone');

    // 1. لائیو مائننگ چلانے کا فنکشن
    function updateLiveMining() {
        setInterval(() => {
            currentBalance += 0.000025; // اسپیڈ اپنی مرضی سے سیٹ کریں
            document.getElementById('liveBalance').textContent = "$" + currentBalance.toFixed(6);
        }, 1000);
    }

    // 2. رقم کلیم کرنے اور ٹیم کو کمیشن دینے کا فنکشن
    window.claimEarnings = async function() {
        if (!userPhone) {
            alert("Please login first!");
            return;
        }

        const amountToClaim = parseFloat(currentBalance.toFixed(4));
        if (amountToClaim <= 0) {
            alert("Nothing to claim yet!");
            return;
        }

        try {
            // یوزر کا ڈیٹا حاصل کریں
            const userRef = ref(db, 'users/' + userPhone);
            const snapshot = await get(userRef);
            
            if (snapshot.exists()) {
                const userData = snapshot.val();
                const parentPhone = userData.referBy;

                // اپنے والٹ میں رقم جمع کریں
                await runTransaction(ref(db, `users/${userPhone}/balance`), (current) => {
                    return (current || 0) + amountToClaim;
                });

                // --- ٹیم کمیشن لاجک (15%) ---
                if (parentPhone && parentPhone !== "none") {
                    const commission = amountToClaim * 0.15; // 15% کمیشن
                    await runTransaction(ref(db, `users/${parentPhone}/balance`), (current) => {
                        return (current || 0) + commission;
                    });
                }

                alert(`Successfully claimed $${amountToClaim}! Your team leader also received commission.`);
                currentBalance = 0;
                document.getElementById('liveBalance').textContent = "$0.000000";
            }
        } catch (error) {
            console.error(error);
            alert("Claim failed. Please try again.");
        }
    };

    window.onload = updateLiveMining;
</script>
