<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining - Gold Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 100px;
        }

        .header { padding: 20px; text-align: center; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border); }
        .header h2 { margin: 0; font-size: 18px; color: var(--primary-gold); letter-spacing: 1px; }

        .container { padding: 20px; text-align: center; }

        /* Mining Animation Sphere */
        .mining-circle {
            width: 200px; height: 200px;
            margin: 40px auto;
            border-radius: 50%;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            background: rgba(241, 196, 15, 0.05);
            border: 2px solid var(--glass-border);
            box-shadow: 0 0 50px rgba(241, 196, 15, 0.1);
        }

        .mining-circle i { font-size: 60px; color: var(--primary-gold); animation: pulse 2s infinite; }

        .orbit {
            position: absolute;
            width: 100%; height: 100%;
            border: 1px solid var(--primary-gold);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 3s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }

        /* Earnings Box */
        .earnings-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 20px;
            margin-top: 20px;
        }
        .earnings-card span { font-size: 12px; color: #aaa; }
        .earnings-card h3 { font-size: 28px; margin: 10px 0; color: #fff; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-top: 20px;
        }
        .stat-box {
            background: rgba(255,255,255,0.03);
            padding: 15px; border-radius: 15px; border: 1px solid var(--glass-border);
        }
        .stat-box b { display: block; color: var(--primary-gold); font-size: 16px; }
        .stat-box small { font-size: 10px; color: #666; }

        .start-btn {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000; border: none; width: 100%; padding: 18px;
            border-radius: 20px; font-weight: bold; font-size: 16px;
            margin-top: 30px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.2);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background: #110720; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid var(--glass-border);
        }
        .nav-item { text-align: center; color: #555; text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--primary-gold); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="header">
    <h2>GOLD MINING CENTER</h2>
</div>

<div class="container">
    <div class="mining-circle">
        <div class="orbit"></div>
        <i class="fas fa-coins"></i>
    </div>

    <div class="earnings-card">
        <span>Current Earnings</span>
        <h3 id="liveEarnings">$0.000000</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <small>Hash Rate</small>
                <b>12.5 GH/s</b>
            </div>
            <div class="stat-box">
                <small>Daily Profit</small>
                <b>$2.40</b>
            </div>
        </div>
    </div>

    <button class="start-btn" onclick="startMining()">START MINING</button>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i>HOME</a>
    <a href="plans.html" class="nav-item"><i class="fas fa-gem"></i>INVEST</a>
    <a href="mining.html" class="nav-item active"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-item"><i class="fas fa-paper-plane"></i>INVITE</a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i>PROFILE</a>
</nav>

<script>
    let earnings = 0;
    function startMining() {
        const btn = document.querySelector('.start-btn');
        btn.innerText = "MINING IN PROGRESS...";
        btn.style.opacity = "0.7";
        btn.disabled = true;

        setInterval(() => {
            earnings += 0.000015;
            document.getElementById('liveEarnings').innerText = "$" + earnings.toFixed(6);
        }, 1000);
    }
</script>

</body>
</html>
