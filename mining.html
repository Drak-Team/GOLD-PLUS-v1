<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Secure Mining</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-gold: #f1c40f; --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f051d; color: white; padding-bottom: 100px; }
        .header { padding: 25px 20px; background: rgba(0,0,0,0.5); text-align: center; border-bottom: 2px solid var(--primary-gold); }
        .card { background: rgba(255,255,255,0.07); border: 1px solid rgba(241, 196, 15, 0.2); margin: 12px; padding: 20px; border-radius: 20px; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 15px; border: 1.5px solid var(--primary-gold); overflow: hidden; margin-bottom: 15px; position: relative; }
        iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
        .btn { background: var(--gold-grad); color: #000; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .promo-section { background: linear-gradient(45deg, #1a0b2e, #0f051d); border: 2px dashed var(--primary-gold); padding: 20px; border-radius: 20px; margin: 12px; text-align: center; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--primary-gold); background: #000; color: white; box-sizing: border-box; }

        /* Updated Navigation Buttons Theme */
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: #0a0414; 
            display: flex; 
            justify-content: space-around; 
            padding: 12px 0; 
            border-top: 1px solid rgba(241, 196, 15, 0.3); 
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .nav-btn { 
            color: #777; 
            text-decoration: none; 
            text-align: center; 
            font-size: 10px; 
            flex: 1; 
            transition: 0.3s;
            font-weight: bold;
        }
        .nav-btn i { 
            font-size: 22px; 
            display: block; 
            margin-bottom: 4px; 
        }
        .nav-btn.active { 
            color: var(--primary-gold); 
            text-shadow: 0 0 8px rgba(241, 196, 15, 0.4);
        }
        .nav-btn:hover { color: var(--primary-gold); }

        #timerDisplay { font-size: 24px; color: var(--primary-gold); font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header"><h2 style="color:var(--primary-gold); margin:0;">EARN REWARDS</h2></div>

<div class="card">
    <div id="videoTaskSection">
        <div class="video-box" id="player"></div>
        <p id="adStatus" style="text-align:center; color:var(--primary-gold); font-weight:bold;">Video Task: 1 / 3</p>
        <button class="btn" id="nextAdBtn" onclick="nextVideo()" disabled>Starting Task...</button>
    </div>

    <div id="socialTaskSection" style="display:none;">
        <h3 style="text-align:center; color:var(--primary-gold);">Final Steps</h3>
        <button class="btn" style="margin-bottom:10px; background:#25D366; color:white;" onclick="doSocialTask('https://whatsapp.com/channel/0029VbCAU3sAYlUQQImhoL0l', 'wa')"><i class="fab fa-whatsapp"></i> Join WhatsApp Channel</button>
        <button class="btn" style="margin-bottom:10px; background:#FF0000; color:white;" onclick="doSocialTask('https://youtube.com/@GoldPlusOfficial', 'yt')"><i class="fab fa-youtube"></i> Subscribe YouTube</button>
        <button class="btn" id="claimBtn" onclick="claimEarnings()" style="margin-top:10px; background:#00ff64;" disabled>Claim Today's Profit</button>
    </div>

    <div id="timerScreen" style="display:none; text-align:center; padding:30px 0;">
        <i class="fas fa-clock" style="font-size:50px; color:var(--primary-gold);"></i>
        <h3>ٹاسک مکمل ہو چکے ہیں</h3>
        <p>اگلا ٹاسک دستیاب ہوگا:</p>
        <div id="timerDisplay">00:00:00</div>
    </div>
</div>

<div class="promo-section">
    <h3 style="color:var(--primary-gold); margin:0;">Channel Promotion</h3>
    <p style="font-size:11px;">Promotion Fee: <b style="color:var(--primary-gold);">Rs. 100</b> (No Refund)</p>
    <input type="text" id="promoLink" placeholder="Paste your link here...">
    <button class="btn" id="promoSubmitBtn" onclick="confirmPromo()">Submit Link</button>
</div>

<nav class="nav-bar">
    <a href="dashboard.html" class="nav-btn"><i class="fas fa-house"></i>HOME</a>
    <a href="plans.html" class="nav-btn"><i class="fas fa-gem"></i>PLANS</a>
    <a href="mining.html" class="nav-btn active"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-btn"><i class="fas fa-users"></i>REFER</a>
    <a href="profile.html" class="nav-btn"><i class="fas fa-user-gear"></i>PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const phone = localStorage.getItem('userPhone');

    let currentVid = 0;
    const videos = ["_8p6OsnrW4E", "h_7fG_VzI8w", "r9mYv4_5mSc"];
    let socialDone = { wa: false, yt: false };

    async function init() {
        if(!phone) return window.location.href='index.html';
        const snap = await get(ref(db, 'users/' + phone));
        const user = snap.val();
        
        if(!user.plan) {
            document.getElementById('videoTaskSection').innerHTML = "<h3>پہلے کوئی پلان خریدیں</h3>";
            return;
        }

        const last = user.lastClaim || 0;
        const diff = Date.now() - last;
        if(diff < 86400000) {
            showCountdown(last);
        } else {
            loadVideo();
        }
    }

    function loadVideo() {
        document.getElementById('player').innerHTML = `<iframe src="https://www.youtube.com/embed/${videos[currentVid]}?autoplay=1&controls=0"></iframe>`;
        let time = 30;
        const btn = document.getElementById('nextAdBtn');
        btn.disabled = true;
        
        const clock = setInterval(() => {
            time--;
            btn.innerText = `Wait ${time}s`;
            if(time <= 0) {
                clearInterval(clock);
                btn.disabled = false;
                btn.innerText = (currentVid < 2) ? "Next Video" : "Finish Videos";
            }
        }, 1000);
    }

    window.nextVideo = () => {
        currentVid++;
        if(currentVid < 3) {
            document.getElementById('adStatus').innerText = `Video Task: ${currentVid + 1} / 3`;
            loadVideo();
        } else {
            document.getElementById('videoTaskSection').style.display = 'none';
            document.getElementById('socialTaskSection').style.display = 'block';
        }
    };

    window.doSocialTask = (link, type) => {
        window.open(link, '_blank');
        socialDone[type] = true;
        if(socialDone.wa && socialDone.yt) document.getElementById('claimBtn').disabled = false;
    };

    window.claimEarnings = async () => {
        const btn = document.getElementById('claimBtn');
        btn.disabled = true; btn.innerText = "Processing...";
        
        const snap = await get(ref(db, 'users/' + phone));
        const user = snap.val();
        const profit = parseFloat(user.dailyProfit || 0);
        const newBal = (parseFloat(user.balance || 0) + profit);

        await update(ref(db, 'users/' + phone), { balance: newBal, lastClaim: Date.now() });
        alert("Rs. " + profit + " آپ کے والٹ میں ڈال دیے گئے ہیں۔");
        location.reload();
    };

    window.confirmPromo = async () => {
        const link = document.getElementById('promoLink').value;
        if(!link) return alert("لنک درج کریں!");

        if(confirm("کیا آپ Rs. 100 ادا کر کے پرموشن لگوانا چاہتے ہیں؟ یہ رقم واپس نہیں ہوگی۔")) {
            const btn = document.getElementById('promoSubmitBtn');
            btn.disabled = true;

            const balanceRef = ref(db, `users/${phone}/balance`);
            const result = await runTransaction(balanceRef, (current) => {
                if (current === null || current < 100) return undefined;
                return current - 100;
            });

            if (result.committed) {
                await push(ref(db, 'admin_promotions'), {
                    user: phone,
                    link: link,
                    status: "Pending",
                    timestamp: Date.now()
                });
                alert("پرموشن ریکویسٹ بھیج دی گئی ہے اور 100 روپے کٹ گئے ہیں۔");
                document.getElementById('promoLink').value = "";
            } else {
                alert("آپ کا بیلنس 100 روپے سے کم ہے!");
            }
            btn.disabled = false;
        }
    };

    function showCountdown(last) {
        document.getElementById('videoTaskSection').style.display = 'none';
        document.getElementById('timerScreen').style.display = 'block';
        const display = document.getElementById('timerDisplay');
        
        setInterval(() => {
            const remaining = (last + 86400000) - Date.now();
            if(remaining <= 0) return location.reload();
            const h = Math.floor(remaining / 3600000);
            const m = Math.floor((remaining % 3600000) / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            display.innerText = `${h}h ${m}m ${s}s`;
        }, 1000);
    }

    init();
</script>
</body>
</html>
