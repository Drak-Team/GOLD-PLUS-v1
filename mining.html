<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Mining Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 90px;
            text-align: center;
        }

        .mining-header { padding: 30px 20px; }
        .mining-header h2 { color: var(--primary-gold); margin: 0; font-size: 22px; text-transform: uppercase; }

        /* مائننگ اینیمیشن (سکے والا دائرہ) */
        .coin-circle {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 2px solid var(--primary-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.2);
            background: rgba(255,255,255,0.02);
        }
        .coin-circle img {
            width: 100px;
            animation: rotateCoin 4s linear infinite;
        }
        @keyframes rotateCoin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .earnings-box { margin-bottom: 30px; }
        .earnings-box span { color: #aaa; font-size: 14px; display: block; }
        .earnings-box b { font-size: 32px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* اسپیڈ اور پرافٹ کارڈز */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 20px;
        }
        .stat-card small { color: #888; display: block; margin-bottom: 5px; font-size: 11px; }
        .stat-card strong { color: var(--primary-gold); font-size: 16px; }

        /* مین بٹن */
        .action-btn {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000; border: none; width: 85%; padding: 15px;
            border-radius: 15px; font-weight: bold; font-size: 16px;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
            cursor: pointer; transition: 0.3s;
        }
        .action-btn:active { transform: scale(0.95); }

        .upgrade-link { color: var(--primary-gold); display: block; margin-top: 20px; text-decoration: none; font-size: 13px; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #110720; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--glass-border); }
        .nav-item { text-align: center; color: #555; text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--primary-gold); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="mining-header">
    <h2>Gold Mining Center</h2>
</div>

<div class="coin-circle">
    <img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">
</div>

<div class="earnings-box">
    <span>Current Mining Balance</span>
    <b id="liveBalance">$0.000000</b>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <small>Total Hash Rate</small>
        <strong id="totalHash">12.5 GH/s</strong>
    </div>
    <div class="stat-card">
        <small>Daily Est. Profit</small>
        <strong id="dailyProfit">$2.40</strong>
    </div>
</div>

<button class="action-btn" onclick="claimEarnings()">CLAIM EARNINGS NOW</button>

<a href="plans.html" class="upgrade-link"><i class="fas fa-arrow-up"></i> Upgrade Mining Speed</a>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i>HOME</a>
    <a href="plans.html" class="nav-item"><i class="fas fa-gem"></i>INVEST</a>
    <a href="mining.html" class="nav-item active"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-item"><i class="fas fa-paper-plane"></i>INVITE</a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i>PROFILE</a>
</nav>

<script>
    // یہ فنکشن بیلنس کو لائیو بڑھتا ہوا دکھائے گا
    let currentBalance = 0.000000;
    function updateLiveMining() {
        // فرض کریں 12.5 GH/s اسپیڈ ہے تو بیلنس ہر سیکنڈ بڑھے گا
        setInterval(() => {
            currentBalance += 0.000001; 
            document.getElementById('liveBalance').textContent = "$" + currentBalance.toFixed(6);
        }, 1000);
    }

    function claimEarnings() {
        alert("Success! $" + currentBalance.toFixed(2) + " has been added to your main wallet.");
        currentBalance = 0;
    }

    window.onload = updateLiveMining;
</script>

</body>
</html>
