<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Create Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-frame {
            background-color: white;
            width: 360px;
            height: 720px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #333;
        }

        .screen-content {
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            overflow-y: auto; /* Allow scrolling if content is long */
        }

        /* SVG Gold Plus Logo (Smaller for Signup) */
        .logo-container {
            margin-bottom: 15px;
            text-align: center;
        }

        .brand-name {
            color: #d4af37;
            font-size: 22px;
            font-weight: 700;
            margin-top: -5px;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            width: 100%;
            margin-bottom: 12px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            opacity: 0.5;
            z-index: 10;
        }

        /* Country Code Selector */
        .country-select {
            width: 100px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background-color: #f1f1f1;
            font-size: 14px;
            appearance: none; /* Hide default arrow */
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat;
            background-position: right 10px top 50%;
            background-size: 12px auto;
            cursor: pointer;
        }

        .phone-input {
            flex: 1;
        }

        .form-group input:not(.phone-input) {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background-color: #f9f9f9;
            font-size: 15px;
        }
        
        /* Specific styling for phone input since it doesn't have an icon left */
        .form-group input.phone-input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background-color: #f9f9f9;
            font-size: 15px;
        }

        .form-group input:focus, .country-select:focus {
            outline: none;
            border-color: #d4af37;
            background-color: #fff;
        }

        .btn-signup {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #d4af37, #f1c40f);
            border: none;
            color: #000;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .login-text {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .login-text a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="phone-frame">
        <div class="screen-content">
            
            <div class="logo-container">
                <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" stroke="#d4af37" stroke-width="4"/>
                    <path d="M35 30H55C63.2843 30 70 36.7157 70 45C70 53.2843 63.2843 60 55 60H35V30Z" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
                    <path d="M35 60V75" stroke="#d4af37" stroke-width="5" stroke-linecap="round"/>
                </svg>
                <div class="brand-name">Gold Plus</div>
            </div>

            <h2>Create Account</h2>

            <form action="#" method="post" style="width: 100%;">
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4 v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <input type="text" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <select class="country-select" required>
                            <option value="+92">PK +92</option>
                            <option value="+1">US +1</option>
                            <option value="+44">UK +44</option>
                            <option value="+91">IN +91</option>
                            <option value="+971">AE +971</option>
                            <option value="+sa">SA +966</option>
                            </select>
                        <input type="tel" class="phone-input" placeholder="Phone Number" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" placeholder="Create Password" required>
                    </div>
                </div>

                <button type="submit" class="btn-signup">Sign Up</button>
            </form>

            <div class="login-text">
                Already have an account? <a href="index.html">Login</a>
            </div>

        </div>
    </div>

</body>
</html>
