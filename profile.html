<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Profile VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22);
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        .profile-header {
            text-align: center;
            padding: 50px 20px;
            background: var(--gold-grad);
            border-bottom: 3px solid #b8860b;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 10px 40px rgba(241, 196, 15, 0.4);
            color: #000;
        }

        .avatar-box {
            width: 90px; height: 90px;
            background: #000;
            border: 4px solid #fff;
            border-radius: 50%; margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: var(--primary-gold); font-weight: 900;
        }

        .user-name { font-size: 22px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .user-id { font-size: 13px; color: #333; font-weight: bold; letter-spacing: 1px; }

        .container { padding: 20px; }

        .stats-row {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-top: -40px; margin-bottom: 30px;
        }

        .stat-card {
            background: #1a0b2e; border: 2px solid var(--primary-gold);
            border-radius: 25px; padding: 18px; text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* History Table Styles */
        .history-section {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 15px;
            margin-top: 25px;
            border: 1px solid var(--glass-border);
        }

        .history-title {
            color: var(--primary-gold);
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-item:last-child { border-bottom: none; }

        .history-info b { font-size: 14px; display: block; }
        .history-info small { color: #888; font-size: 10px; }
        
        .history-status { text-align: right; }
        .status-badge {
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 5px;
            font-weight: bold;
        }
        .status-pending { background: rgba(241, 196, 15, 0.2); color: var(--primary-gold); }
        .status-completed { background: rgba(0, 255, 100, 0.2); color: #00ff64; }

        .logout-btn {
            margin-top: 30px; width: 100%; padding: 18px;
            background: rgba(255, 50, 50, 0.1); border: 1px solid rgba(255, 50, 50, 0.3);
            color: #ff4444; border-radius: 20px; font-weight: 900;
            text-transform: uppercase;
        }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background: #0a0414; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid rgba(241, 196, 15, 0.2); z-index: 1000;
        }

        .nav-item { text-align: center; color: #555; text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--primary-gold); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="profile-header">
    <div class="avatar-box" id="avatarChar">G</div>
    <div class="user-name" id="profileName">GOLD USER</div>
    <div class="user-id" id="profileID">ID: GP-000000</div>
</div>

<div class="container">
    <div class="stats-row">
        <div class="stat-card">
            <i class="fas fa-wallet"></i>
            <span>Main Balance</span>
            <b id="totalBalance">$0.00</b>
        </div>
        <div class="stat-card">
            <i class="fas fa-users"></i>
            <span>Team size</span>
            <b id="myTeam">0 Members</b>
        </div>
    </div>

    <div class="history-section">
        <div class="history-title"><i class="fas fa-plus-circle"></i> Recent Deposits</div>
        <div id="depositList"><p style="font-size:12px; color:#666;">No deposit history found.</p></div>
    </div>

    <div class="history-section">
        <div class="history-title"><i class="fas fa-minus-circle"></i> Withdrawal Logs</div>
        <div id="withdrawList"><p style="font-size:12px; color:#666;">No withdrawal history found.</p></div>
    </div>

    <button class="logout-btn" onclick="logout()">Logout Account</button>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-house"></i>HOME</a>
    <a href="plans.html" class="nav-item"><i class="fas fa-gem"></i>INVEST</a>
    <a href="mining.html" class="nav-item"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-item"><i class="fas fa-users"></i>REFER</a>
    <a href="profile.html" class="nav-item active"><i class="fas fa-user-gear"></i>PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.onload = function() {
        const phone = localStorage.getItem('userPhone');
        if (!phone) { window.location.href = 'index.html'; return; }

        // Live User Stats
        onValue(ref(db, 'users/' + phone), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('totalBalance').innerText = "$" + parseFloat(data.balance || 0).toFixed(2);
                document.getElementById('profileName').innerText = data.name || "Gold User";
                document.getElementById('profileID').innerText = "ID: GP-" + phone.substring(phone.length - 6);
                document.getElementById('myTeam').innerText = (data.referCount || 0) + " Members";
                document.getElementById('avatarChar').innerText = (data.name || "G").charAt(0).toUpperCase();
            }
        });

        // Load Deposit History
        onValue(ref(db, 'deposits/' + phone), (snap) => {
            let html = "";
            if (snap.exists()) {
                snap.forEach(child => {
                    const d = child.val();
                    html += `<div class="history-item">
                        <div class="history-info"><b>$${d.amount}</b><small>${d.date || 'Today'}</small></div>
                        <div class="history-status"><span class="status-badge ${d.status === 'Completed' ? 'status-completed' : 'status-pending'}">${d.status || 'Pending'}</span></div>
                    </div>`;
                });
                document.getElementById('depositList').innerHTML = html;
            }
        });

        // Load Withdraw History
        onValue(ref(db, 'withdrawals/' + phone), (snap) => {
            let html = "";
            if (snap.exists()) {
                snap.forEach(child => {
                    const d = child.val();
                    html += `<div class="history-item">
                        <div class="history-info"><b>$${d.amount}</b><small>${d.date || 'Today'}</small></div>
                        <div class="history-status"><span class="status-badge ${d.status === 'Completed' ? 'status-completed' : 'status-pending'}">${d.status || 'Pending'}</span></div>
                    </div>`;
                });
                document.getElementById('withdrawList').innerHTML = html;
            }
        });
    };

    window.logout = () => { localStorage.removeItem('userPhone'); window.location.href = 'index.html'; };
</script>

</body>
</html>
