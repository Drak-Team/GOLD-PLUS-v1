<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - VIP Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22);
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background: #0a0414; color: white; padding-bottom: 100px;
        }

        /* VIP Header Design */
        .profile-header {
            background: linear-gradient(180deg, rgba(241, 196, 15, 0.2) 0%, #0a0414 100%);
            padding: 40px 20px; text-align: center; border-radius: 0 0 40px 40px;
            border-bottom: 1px solid rgba(241, 196, 15, 0.3);
            position: relative; overflow: hidden;
        }

        .profile-header::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(241, 196, 15, 0.05) 0%, transparent 70%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .avatar-wrapper {
            position: relative; width: 100px; height: 100px; margin: 0 auto 15px;
        }
        .avatar-box {
            width: 100%; height: 100%; background: var(--gold-grad);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 45px; color: #000; font-weight: bold; border: 4px solid #0a0414;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
        }
        .vip-badge {
            position: absolute; bottom: 0; right: 0; background: #000; color: var(--primary-gold);
            padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: bold;
            border: 1px solid var(--primary-gold);
        }

        .user-info h2 { margin: 5px 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .user-info p { margin: 0; color: #888; font-size: 12px; }

        .container { padding: 0 20px; margin-top: -30px; }

        /* Balance Card */
        .balance-card {
            background: var(--gold-grad); color: #000; padding: 20px; border-radius: 25px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px;
        }
        .balance-card h3 { margin: 0; font-size: 14px; opacity: 0.8; }
        .balance-card h1 { margin: 0; font-size: 28px; font-weight: 800; }

        /* Quick Action Grid */
        .action-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px;
        }
        .action-item {
            background: var(--glass); padding: 15px 5px; border-radius: 15px;
            text-align: center; text-decoration: none; color: white; border: 1px solid rgba(255,255,255,0.05);
        }
        .action-item i { font-size: 20px; color: var(--primary-gold); margin-bottom: 8px; display: block; }
        .action-item span { font-size: 10px; font-weight: 500; }

        /* Menu List */
        .menu-section { background: var(--glass); border-radius: 20px; padding: 10px; margin-bottom: 20px; }
        .menu-link {
            display: flex; align-items: center; padding: 15px; text-decoration: none;
            color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .menu-link:last-child { border-bottom: none; }
        .menu-link i { width: 30px; color: var(--primary-gold); font-size: 18px; }
        .menu-link span { flex: 1; font-size: 14px; }
        .menu-link i.fa-chevron-right { font-size: 12px; color: #555; }

        .logout-btn {
            background: rgba(255, 50, 50, 0.1); color: #ff5555; padding: 15px;
            border-radius: 15px; text-align: center; cursor: pointer; font-weight: bold;
            border: 1px solid rgba(255, 50, 50, 0.2); margin-top: 10px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: #0a0414;
            display: flex; justify-content: space-around; padding: 12px 0;
            border-top: 1px solid rgba(241, 196, 15, 0.2);
        }
        .nav-item { color: #555; text-decoration: none; text-align: center; font-size: 10px; }
        .nav-item.active { color: var(--primary-gold); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="profile-header">
    <div class="avatar-wrapper">
        <div class="avatar-box" id="avatarChar">G</div>
        <div class="vip-badge">VIP 1</div>
    </div>
    <div class="user-info">
        <h2 id="profileName">Loading...</h2>
        <p id="profileID">ID: GP-000000</p>
    </div>
</div>

<div class="container">
    <div class="balance-card">
        <div>
            <h3>Total Balance</h3>
            <h1 id="totalBalance">$0.00</h1>
        </div>
        <div style="text-align: right;">
            <p id="pkrBalance" style="margin:0; font-weight:bold; font-size:14px;">Rs. 0</p>
            <small style="font-size:9px;">1 USD = 300 PKR</small>
        </div>
    </div>

    <div class="action-grid">
        <a href="deposit.html" class="action-item"><i class="fas fa-arrow-down"></i><span>Deposit</span></a>
        <a href="withdraw.html" class="action-item"><i class="fas fa-paper-plane"></i><span>Withdraw</span></a>
        <a href="refer.html" class="action-item"><i class="fas fa-users"></i><span>My Team</span></a>
        <a href="withdraw.html" class="action-item"><i class="fas fa-history"></i><span>History</span></a>
    </div>

    <div class="menu-section">
        <a href="#" class="menu-link" onclick="alert('Feature coming soon!')">
            <i class="fas fa-user-edit"></i><span>Edit Profile Name</span><i class="fas fa-chevron-right"></i>
        </a>
        <a href="#" class="menu-link" onclick="alert('Contact admin to change password')">
            <i class="fas fa-lock"></i><span>Change Password</span><i class="fas fa-chevron-right"></i>
        </a>
        <a href="refer.html" class="menu-link">
            <i class="fas fa-gift"></i><span>Invite Rewards</span><i class="fas fa-chevron-right"></i>
        </a>
        <a href="#" class="menu-link">
            <i class="fas fa-headset"></i><span>Customer Support</span><i class="fas fa-chevron-right"></i>
        </a>
    </div>

    <div class="logout-btn" onclick="logout()">LOGOUT ACCOUNT</div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><i class="fas fa-house"></i><span>HOME</span></a>
    <a href="plans.html" class="nav-item"><i class="fas fa-gem"></i><span>PLANS</span></a>
    <a href="mining.html" class="nav-item"><i class="fas fa-coins"></i><span>EARN</span></a>
    <a href="refer.html" class="nav-item"><i class="fas fa-users"></i><span>REFER</span></a>
    <a href="profile.html" class="nav-item active"><i class="fas fa-user-gear"></i><span>PROFILE</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const PKR_RATE = 300;

    window.onload = function() {
        const phone = localStorage.getItem('userPhone');
        if (!phone) { window.location.href = 'index.html'; return; }

        onValue(ref(db, 'users/' + phone), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // بیلنس فکس لاجک: روپے کو ڈالر میں بدل کر دکھانا
                let balancePKR = parseFloat(data.balance || 0);
                let balanceUSD = balancePKR / PKR_RATE;

                document.getElementById('totalBalance').innerText = "$" + balanceUSD.toFixed(2);
                document.getElementById('pkrBalance').innerText = "Rs. " + balancePKR.toLocaleString();
                document.getElementById('profileName').innerText = data.name || "Gold User";
                document.getElementById('profileID').innerText = "ID: GP-" + phone.substring(phone.length - 6);
                document.getElementById('avatarChar').innerText = (data.name || "G").charAt(0).toUpperCase();
            }
        });
    };

    window.logout = () => { 
        if(confirm("Are you sure you want to logout?")) {
            localStorage.removeItem('userPhone'); 
            window.location.href = 'index.html'; 
        }
    };
</script>

</body>
</html>
