<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --purple-dark: #1a0b2e; --purple-light: #25163d; --text-muted: #aaa; }
        body { background: #0f051d; color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 100px; }

        /* Header */
        .header { background: var(--purple-dark); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand-name { color: var(--gold); font-weight: bold; font-size: 18px; }

        .container { padding: 15px; }

        /* 👑 یوزر پروفائل کارڈ */
        .profile-card { 
            background: var(--purple-light); border-radius: 30px; padding: 25px; 
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 20px;
        }
        .user-avatar { 
            width: 80px; height: 80px; background: var(--gold); 
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.2);
        }
        .user-avatar i { font-size: 40px; color: #000; }
        .user-meta h2 { margin: 0; font-size: 20px; color: #fff; }
        .user-meta p { margin: 5px 0; font-size: 12px; color: var(--text-muted); }
        .refer-code { background: rgba(0,0,0,0.3); padding: 5px 12px; border-radius: 10px; font-size: 11px; color: var(--gold); border: 1px dashed var(--gold); display: inline-block; }

        /* 📊 انویسٹمنٹ اسٹیٹس گریڈ */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.03); }
        .stat-box span { display: block; font-size: 9px; color: var(--text-muted); text-transform: uppercase; margin-top: 5px; }
        .stat-box b { font-size: 14px; color: var(--gold); }
        .stat-box i { font-size: 14px; margin-bottom: 5px; opacity: 0.7; }

        /* 🛠️ اکاؤنٹ مینیو لسٹ */
        .menu-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin: 20px 0 10px 10px; letter-spacing: 1px; }
        .menu-list { background: var(--purple-light); border-radius: 25px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .menu-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.05);
            text-decoration: none; color: #fff; transition: 0.3s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: rgba(255,255,255,0.05); }
        .menu-left { display: flex; align-items: center; gap: 15px; }
        .menu-left i { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .menu-item span { font-size: 14px; }
        .menu-item .fa-chevron-right { font-size: 12px; color: #444; }

        /* آئیکن کلرز */
        .bg-blue { background: rgba(0, 123, 255, 0.1); color: #007bff; }
        .bg-purple { background: rgba(111, 66, 193, 0.1); color: #6f42c1; }
        .bg-yellow { background: rgba(255, 193, 7, 0.1); color: #ffc107; }
        .bg-green { background: rgba(40, 167, 69, 0.1); color: #28a745; }
        .bg-red { background: rgba(220, 53, 69, 0.1); color: #dc3545; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--purple-dark); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-link { color: #666; text-decoration: none; font-size: 10px; text-align: center; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-name">Gold Plus</div>
        <div class="user-circle" style="background:var(--gold); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold;">U</div>
    </div>

    <div class="container">
        <div class="profile-card">
            <div class="user-avatar"><i class="fa-solid fa-crown"></i></div>
            <div class="user-meta">
                <h2 id="userName">Mranjum</h2>
                <p id="userEmail">algoalgo371@gmail.com</p>
                <div class="refer-code"># YX-CF84BF <i class="fa-regular fa-copy" style="margin-left:5px;"></i></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><i class="fa-solid fa-sack-dollar" style="color:var(--gold)"></i><br><b>Rs. 0.00</b><span>Invested</span></div>
            <div class="stat-box"><i class="fa-solid fa-chart-line" style="color:#00ff64"></i><br><b>Rs. 0.00</b><span>Earned</span></div>
            <div class="stat-box"><i class="fa-solid fa-users" style="color:#007bff"></i><br><b>0</b><span>Team</span></div>
        </div>

        <div class="menu-label">Account Settings</div>
        <div class="menu-list">
            <a href="team.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-users-viewfinder bg-blue"></i><span>My Team</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="rewards.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-medal bg-purple"></i><span>Ranks & Rewards</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="deposits.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-file-invoice-dollar bg-yellow"></i><span>Deposit History</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="transactions.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-arrow-right-arrow-left bg-green"></i><span>Transactions</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="edit-profile.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-user-pen bg-blue"></i><span>Edit Profile</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <a href="support.html" class="menu-item">
                <div class="menu-left"><i class="fa-solid fa-headset bg-red"></i><span>Support Help</span></div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-grip"></i><br>HOME</a>
        <a href="plans.html" class="nav-link"><i class="fa-solid fa-wand-magic-sparkles"></i><br>INVEST</a>
        <a href="refer.html" class="nav-link"><i class="fa-solid fa-paper-plane"></i><br>INVITE</a>
        <a href="profile.html" class="nav-link active"><i class="fa-solid fa-circle-user"></i><br>PROFILE</a>
    </nav>

</body>
</html>
