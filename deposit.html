<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Deposit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --bg: #0f051d; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding-bottom: 100px; }
        .header { padding: 25px; text-align: center; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(241,196,15,0.2); }
        .deposit-box { padding: 20px; }
        
        .method-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid transparent; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .tab img { width: 35px; height: 35px; object-fit: contain; border-radius: 8px; }
        .tab.active { border-color: var(--gold); background: rgba(241,196,15,0.1); color: var(--gold); }
        
        .pay-info { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 20px; border-left: 4px solid var(--gold); }
        .pay-info small { color: #aaa; text-transform: uppercase; font-size: 10px; }
        .pay-info b { color: var(--gold); display: block; margin-top: 5px; font-size: 18px; letter-spacing: 1px; }
        
        input { width: 100%; padding: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; outline: none; box-sizing: border-box; margin-bottom: 15px; }
        .file-input { border: 2px dashed rgba(241,196,15,0.3); padding: 20px; text-align: center; border-radius: 15px; cursor: pointer; background: rgba(255,255,255,0.02); }
        .submit-btn { background: linear-gradient(90deg, #f1c40f, #e67e22); color: #000; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        
        .history-section { padding: 0 20px; margin-top: 30px; }
        .history-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid #f1c40f; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0a0414; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(241, 196, 15, 0.2); }
        .nav-btn { color: #666; text-decoration: none; text-align: center; font-size: 10px; flex: 1; }
        .nav-btn.active { color: #f1c40f; }
    </style>
</head>
<body>

<div class="header"><h3>Deposit Funds</h3></div>

<div class="deposit-box">
    <div class="method-tabs">
        <div class="tab active" onclick="switchMethod('JazzCash', '03037264598', 'Ahmad Nafees Anjum', this)">
            <img src="https://img.icons8.com/color/96/wallet--v1.png" alt="Jazz">
            JazzCash
        </div>
        <div class="tab" onclick="switchMethod('Easypaisa', '03037264598', 'Ahmad Nafees Anjum', this)">
            <img src="https://img.icons8.com/color/96/money-transfer.png" alt="EP">
            Easypaisa
        </div>
        <div class="tab" onclick="switchMethod('BNB (BEP20)', '0x...', 'Ahmad Nafees Anjum', this)">
            <img src="https://img.icons8.com/color/96/binance.png" alt="BNB">
            BNB (BEP20)
        </div>
        <div class="tab" onclick="switchMethod('TRX (TRC20)', 'T...', 'Ahmad Nafees Anjum', this)">
            <img src="https://img.icons8.com/color/96/tron.png" alt="TRX">
            TRX (TRC20)
        </div>
    </div>

    <div class="pay-info">
        <small id="methodName">JazzCash Transfer</small>
        <b id="accNumber">03037264598</b>
        <span id="accHolder" style="font-size: 12px; opacity: 0.8;">Holder: Ahmad Nafees Anjum</span>
    </div>

    <input type="number" id="depositAmount" oninput="updatePKR()" placeholder="Amount in USD ($)">
    <small id="pkrNote" style="color: #00ff64; font-size: 11px; margin-bottom: 10px; display: block;"></small>
    
    <input type="text" id="tid" placeholder="Transaction ID (TID)">

    <div class="file-input" onclick="document.getElementById('proof').click()">
        <i class="fas fa-image" style="font-size: 20px; color: var(--gold);"></i>
        <p id="fileName" style="font-size: 11px; margin: 5px 0 0 0;">Upload Screenshot</p>
        <input type="file" id="proof" style="display:none" onchange="updateFileName()" accept="image/*">
    </div>

    <button class="submit-btn" id="submitBtn">Submit Request</button>
</div>

<div class="history-section">
    <div style="color: var(--gold); font-size: 14px; margin-bottom: 10px;">Deposit History</div>
    <div id="depositHistory"></div>
</div>

<nav class="nav-bar">
    <a href="dashboard.html" class="nav-btn"><i class="fas fa-house"></i>HOME</a>
    <a href="plans.html" class="nav-btn"><i class="fas fa-gem"></i>PLANS</a>
    <a href="mining.html" class="nav-btn"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-btn"><i class="fas fa-users"></i>REFER</a>
    <a href="profile.html" class="nav-btn active"><i class="fas fa-user-gear"></i>PROFILE</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');

    let currentMethod = "JazzCash";

    window.switchMethod = (name, num, holder, el) => {
        currentMethod = name;
        document.getElementById('methodName').innerText = name + " Transfer";
        document.getElementById('accNumber').innerText = num;
        document.getElementById('accHolder').innerText = "Holder: " + holder;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    };

    window.updatePKR = () => {
        const usd = document.getElementById('depositAmount').value;
        document.getElementById('pkrNote').innerText = usd > 0 ? "Total: Rs. " + (usd * 300) : "";
    };

    window.updateFileName = () => {
        const file = document.getElementById('proof').files[0];
        if (file) document.getElementById('fileName').innerText = file.name;
    };

    // Live History Listener
    if (phone) {
        db.ref('users/' + phone + '/deposits').on('value', (snap) => {
            const histDiv = document.getElementById('depositHistory');
            let html = "";
            if (snap.exists()) {
                const data = snap.val();
                Object.keys(data).reverse().forEach(key => {
                    const d = data[key];
                    let color = d.status === "Approved" ? "#00ff64" : (d.status === "Rejected" ? "#ff4b2b" : "#f1c40f");
                    html += `<div class="history-card" style="border-left-color: ${color}">
                        <div style="display:flex; justify-content:space-between; font-size:11px;">
                            <span>${d.date}</span><b style="color:${color}">${d.status}</b>
                        </div>
                        <div style="font-weight:bold; margin-top:5px;">$${d.amount} - ${d.method}</div>
                    </div>`;
                });
                histDiv.innerHTML = html;
            } else {
                histDiv.innerHTML = "<p style='font-size:12px; color:#555;'>No history.</p>";
            }
        });
    }

    document.getElementById('submitBtn').onclick = async () => {
        const amt = document.getElementById('depositAmount').value;
        const tid = document.getElementById('tid').value;
        const file = document.getElementById('proof').files[0];
        if (!amt || !tid || !file) { alert("Fill all fields!"); return; }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "UPLOADING..."; btn.disabled = true;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            const depID = Date.now();
            const depData = {
                phone, amount: amt, tid, method: currentMethod,
                screenshot: reader.result, status: "Pending", date: new Date().toLocaleString()
            };
            await db.ref('deposits/' + depID).set(depData);
            await db.ref('users/' + phone + '/deposits/' + depID).set(depData);
            alert("Submitted!");
            btn.innerText = "Submit Request"; btn.disabled = false;
        };
    };
</script>
</body>
</html>
