<div class="deposit-container" style="padding: 20px;">
    <h3 style="color: var(--primary-gold); text-align: center;">Deposit Funds</h3>
    
    <div class="payment-card" style="background: var(--card-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: 20px; margin-bottom: 20px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/JazzCash_logo.png" width="40" style="border-radius: 5px;">
            <h4 style="margin: 0;">JazzCash Transfer</h4>
        </div>
        
        <p style="font-size: 13px; color: #aaa;">Please send your deposit amount to this account:</p>
        
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px dashed var(--primary-gold); text-align: center;">
            <span style="font-size: 12px; color: var(--primary-gold); display: block;">Account Number:</span>
            <b style="font-size: 20px; letter-spacing: 1px; color: #fff;">03037264598</b>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
            <span style="font-size: 12px; color: var(--primary-gold); display: block;">Account Holder Name:</span>
            <b style="font-size: 16px; color: #fff;">Ahmad Nafees Anjum</b>
        </div>
    </div>

    <div class="upload-box" style="background: var(--card-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: 20px;">
        <h4 style="margin-top: 0; font-size: 14px;">Upload Payment Proof</h4>
        <p style="font-size: 11px; color: #888;">Enter Transaction ID and attach screenshot</p>
        
        <input type="text" placeholder="Enter Transaction ID (TID)" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; margin-bottom: 15px; box-sizing: border-box;">
        
        <input type="file" id="proof" accept="image/*" style="font-size: 12px; margin-bottom: 20px;">
        
        <button class="action-btn" style="width: 100%; background: linear-gradient(90deg, #f1c40f, #e67e22); color: #000; border: none; padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer;">SUBMIT DEPOSIT REQUEST</button>
    </div>
</div>
