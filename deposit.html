<script>
    // Firebase Config same rahegi
    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');

    // Status Live Update Fix
    if (phone) {
        // 'value' listener se pura data load hoga aur 'child_changed' se status update hoga
        db.ref('users/' + phone + '/deposits').on('value', (snapshot) => {
            const historyDiv = document.getElementById('depositHistory');
            let html = "";
            if (snapshot.exists()) {
                const data = snapshot.val();
                // Data ko reverse order mein dikhane ke liye
                const keys = Object.keys(data).sort().reverse();
                
                keys.forEach(key => {
                    const dep = data[key];
                    let color = "#f1c40f"; // Default Pending
                    if(dep.status === "Approved") color = "#00ff64";
                    if(dep.status === "Rejected") color = "#ff4b2b";

                    html += `
                        <div class="history-card" style="border-left-color: ${color}; background: rgba(255,255,255,0.05); padding:12px; border-radius:12px; margin-bottom:10px;">
                            <div style="display:flex; justify-content:space-between; font-size:11px;">
                                <span style="color:#888;">${dep.date}</span>
                                <b style="color:${color}; text-transform:uppercase;">${dep.status}</b>
                            </div>
                            <div style="margin-top:5px; font-weight:bold; font-size:14px;">$${dep.amount} - ${dep.method}</div>
                            <div style="font-size:10px; color:#555;">TID: ${dep.tid}</div>
                        </div>`;
                });
                historyDiv.innerHTML = html;
            } else {
                historyDiv.innerHTML = "<p style='text-align:center; color:#555; font-size:12px;'>No deposit history yet.</p>";
            }
        });
    }

    // ... baki functions (getBase64, switchMethod, submitBtn logic) same rahenge ...
</script>
