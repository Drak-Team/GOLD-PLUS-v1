<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    // Initialize Firebase safely
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');

    let currentMethod = "JazzCash";

    // Image to Base64 function
    const getBase64 = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    };

    // Switch Payment Method
    window.switchMethod = (name, num, holder, el) => {
        currentMethod = name;
        const mName = document.getElementById('methodName');
        const aNum = document.getElementById('accNumber');
        const aHolder = document.getElementById('accHolder');
        
        if(mName) mName.innerText = name + " Transfer";
        if(aNum) aNum.innerText = num;
        if(aHolder) aHolder.innerText = holder;
        
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(el) el.classList.add('active');
    };

    // Update PKR Note
    window.updatePKR = () => {
        const usdInput = document.getElementById('depositAmount');
        const pkrNote = document.getElementById('pkrNote');
        if(usdInput && pkrNote){
            const usd = usdInput.value;
            pkrNote.innerText = usd > 0 ? "Total to Pay: Rs. " + (usd * 300) : "";
        }
    };

    // Show Selected File Name
    window.updateFileName = () => {
        const fileInput = document.getElementById('proof');
        const fileNameDisp = document.getElementById('fileName');
        if (fileInput && fileInput.files[0] && fileNameDisp) {
            fileNameDisp.innerText = fileInput.files[0].name;
        }
    };

    // Main Submit Function
    const submitBtn = document.getElementById('submitBtn');
    if(submitBtn) {
        submitBtn.onclick = async () => {
            const amountField = document.getElementById('depositAmount');
            const tidField = document.getElementById('tid');
            const fileField = document.getElementById('proof');

            if (!phone) { alert("Session expired, please login again."); return; }
            if (!amountField || amountField.value < 1) { alert("Minimum deposit is $1"); return; }
            if (!tidField || !tidField.value) { alert("Please enter Transaction ID"); return; }
            if (!fileField || !fileField.files[0]) { alert("Please upload payment screenshot"); return; }

            // UI Update
            submitBtn.innerText = "Processing...";
            submitBtn.disabled = true;

            try {
                const base64Img = await getBase64(fileField.files[0]);
                const depositID = Date.now();

                const depData = {
                    phone: phone,
                    amount: amountField.value,
                    tid: tidField.value,
                    method: currentMethod,
                    screenshot: base64Img,
                    status: "Pending",
                    date: new Date().toLocaleString()
                };

                // Save to Admin and User nodes
                await db.ref('deposits/' + depositID).set(depData);
                await db.ref('users/' + phone + '/deposits/' + depositID).set(depData);

                alert("Request submitted! Your deposit is under review.");
                window.location.replace("dashboard.html");

            } catch (e) {
                alert("Error: " + e.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "SUBMIT REQUEST";
            }
        };
    }
</script>
