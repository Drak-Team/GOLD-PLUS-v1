<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Deposit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 20px;
        }

        .header { padding: 20px; text-align: center; position: relative; }
        .header h2 { color: var(--primary-gold); margin: 0; font-size: 22px; }

        .container { padding: 15px; }

        /* JazzCash Card */
        .payment-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .method-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .method-title img { width: 50px; height: auto; border-radius: 8px; }

        .account-details {
            background: rgba(0,0,0,0.3);
            border: 1px dashed var(--primary-gold);
            padding: 15px;
            border-radius: 15px;
            position: relative;
        }

        .account-details span { font-size: 11px; color: var(--primary-gold); text-transform: uppercase; letter-spacing: 1px; }
        .account-details b { display: block; font-size: 24px; color: #fff; margin: 8px 0; letter-spacing: 2px; }
        
        .copy-btn {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .copy-btn:active { transform: scale(0.9); }

        /* Upload Section */
        .upload-section {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 20px;
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; }
        
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 14px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
        }

        .file-input-wrapper {
            margin-top: 10px;
            border: 2px dashed #444;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-input-wrapper:hover { border-color: var(--primary-gold); background: rgba(241, 196, 15, 0.05); }

        .submit-btn {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
        }

        .submit-btn:disabled { opacity: 0.5; }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Deposit Funds</h2>
</div>

<div class="container">
    <div class="payment-card">
        <div class="method-title">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/JazzCash_logo.png" alt="JazzCash">
            <h4>JazzCash Transfer</h4>
        </div>
        
        <div class="account-details">
            <span>Account Number</span>
            <b id="accNumber">03037264598</b>
            <p style="margin: 0; color: #ddd; font-size: 15px; font-weight: 500;">Ahmad Nafees Anjum</p>
            <button class="copy-btn" onclick="copyNumber()"> <i class="fas fa-copy"></i> Copy Number</button>
        </div>
    </div>

    <div class="upload-section">
        <div class="input-group">
            <label>Amount to Deposit ($)</label>
            <input type="number" id="depositAmount" placeholder="Example: 50">
        </div>

        <div class="input-group">
            <label>Transaction ID (TID)</label>
            <input type="text" id="tid" placeholder="Enter 12-digit TID">
        </div>
        
        <div class="input-group">
            <label>Payment Screenshot</label>
            <div class="file-input-wrapper" onclick="document.getElementById('proof').click()">
                <i class="fas fa-cloud-upload-alt" style="font-size: 30px; color: var(--primary-gold); margin-bottom: 10px; display: block;"></i>
                <p id="fileName" style="font-size: 13px; margin: 0; color: #888;">Tap to upload proof</p>
                <input type="file" id="proof" accept="image/*" style="display: none;" onchange="updateFileName()">
            </div>
        </div>

        <button class="submit-btn" onclick="handleSubmit()" id="submitBtn">SUBMIT DEPOSIT REQUEST</button>
    </div>

    <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
</div>

<script>
    // نمبر کاپی کرنے کا فنکشن
    function copyNumber() {
        const num = document.getElementById('accNumber').innerText;
        const tempInput = document.createElement("input");
        tempInput.value = num;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        alert("Number Copied: " + num);
    }

    // فائل کا نام دکھانے کے لیے
    function updateFileName() {
        const fileInput = document.getElementById('proof');
        const fileNameDisplay = document.getElementById('fileName');
        if (fileInput.files.length > 0) {
            fileNameDisplay.innerText = "Selected: " + fileInput.files[0].name;
            fileNameDisplay.style.color = "#2ecc71";
        }
    }

    // آٹو ٹیسٹ اور سبمٹ لاجک
    function handleSubmit() {
        const tid = document.getElementById('tid').value;
        const amount = document.getElementById('depositAmount').value;
        const file = document.getElementById('proof').files[0];
        const btn = document.getElementById('submitBtn');

        if (!amount || amount <= 0) { alert("Please enter amount."); return; }
        if (!tid || tid.length < 5) { alert("Please enter valid TID."); return; }
        if (!file) { alert("Please upload screenshot."); return; }

        btn.disabled = true;
        btn.innerText = "Processing...";

        // لوکل اسٹوریج میں ہسٹری سیو کرنا (آٹو ٹیسٹ کے لیے)
        const depositRecord = {
            tid: tid,
            amount: amount,
            date: new Date().toLocaleDateString(),
            status: "Pending"
        };

        let history = JSON.parse(localStorage.getItem('depositHistory')) || [];
        history.unshift(depositRecord);
        localStorage.setItem('depositHistory', JSON.stringify(history));

        setTimeout(() => {
            alert("Deposit request submitted successfully!");
            window.location.href = "deposit-history.html";
        }, 1500);
    }
</script>

</body>
</html>
