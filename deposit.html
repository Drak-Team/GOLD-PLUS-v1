<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Deposit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 20px;
        }

        .header { padding: 20px; text-align: center; position: relative; }
        .header h2 { color: var(--primary-gold); margin: 0; font-size: 22px; }

        .container { padding: 15px; }

        /* JazzCash Card */
        .payment-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .method-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .method-title img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }

        .account-details {
            background: rgba(0,0,0,0.3);
            border: 1px dashed var(--primary-gold);
            padding: 15px;
            border-radius: 15px;
            position: relative;
        }

        .account-details span { font-size: 11px; color: var(--primary-gold); text-transform: uppercase; }
        .account-details b { display: block; font-size: 22px; color: #fff; margin: 8px 0; letter-spacing: 1px; }
        
        .copy-btn {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        /* Upload Section */
        .upload-section {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 20px;
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }

        .file-input-wrapper {
            margin-top: 10px;
            border: 1px dashed #444;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        .submit-btn {
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            color: #000;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Deposit Funds</h2>
</div>

<div class="container">
    <div class="payment-card">
        <div class="method-title">
            <img src="https://play-lh.googleusercontent.com/9v1K-u4u-y0pLh_J6a1-J9Y_vV_P5zK_BfR_V_WfVzYJ_V_V_V_V_V_V_V_V_V" alt="JazzCash">
            <h4>JazzCash Transfer</h4>
        </div>
        
        <div class="account-details">
            <span>Account Number</span>
            <b id="accNumber">03037264598</b>
            <p style="margin: 0; color: #ddd; font-size: 14px;">Ahmad Nafees Anjum</p>
            <button class="copy-btn" onclick="copyNumber()">COPY NUMBER</button>
        </div>
    </div>

    <div class="upload-section">
        <div class="input-group">
            <label>Transaction ID (TID)</label>
            <input type="text" id="tid" placeholder="Enter 12-digit TID">
        </div>
        
        <div class="input-group">
            <label>Payment Screenshot</label>
            <div class="file-input-wrapper" onclick="document.getElementById('proof').click()">
                <i class="fas fa-cloud-upload-alt" style="font-size: 24px; color: var(--primary-gold);"></i>
                <p id="fileName" style="font-size: 12px; margin: 5px 0;">Click to upload screenshot</p>
                <input type="file" id="proof" accept="image/*" style="display: none;" onchange="updateFileName()">
            </div>
        </div>

        <button class="submit-btn" onclick="handleSubmit()" id="submitBtn">SUBMIT REQUEST</button>
    </div>

    <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
</div>

<script>
    // نمبر کاپی کرنے کا فنکشن
    function copyNumber() {
        const num = document.getElementById('accNumber').innerText;
        navigator.clipboard.writeText(num).then(() => {
            alert("Account number copied: " + num);
        });
    }

    // فائل کا نام دکھانے کے لیے
    function updateFileName() {
        const fileInput = document.getElementById('proof');
        const fileNameDisplay = document.getElementById('fileName');
        if (fileInput.files.length > 0) {
            fileNameDisplay.innerText = fileInput.files[0].name;
            fileNameDisplay.style.color = "#00ff64";
        }
    }

    // فارم جمع کرنے کا فنکشن
    function handleSubmit() {
        const tid = document.getElementById('tid').value;
        const file = document.getElementById('proof').files[0];
        const btn = document.getElementById('submitBtn');

        if (!tid || tid.length < 5) {
            alert("Please enter a valid Transaction ID.");
            return;
        }
        if (!file) {
            alert("Please upload the payment screenshot.");
            return;
        }

        // ایکشن شروع
        btn.disabled = true;
        btn.innerText = "Processing...";

        // یہاں فائر بیس کا کوڈ آئے گا، فی الحال ہم صرف میسج دکھا رہے ہیں
        setTimeout(() => {
            alert("Success! Your deposit request has been submitted. Admin will approve it soon.");
            window.location.href = "dashboard.html";
        }, 2000);
    }
</script>

</body>
</html>
