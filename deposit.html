<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const phone = localStorage.getItem('userPhone');

    let currentMethod = "JazzCash";

    // تصویر کو ڈیٹا بیس میں محفوظ کرنے کے قابل بنانا
    const getBase64 = (file) => {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    };

    window.switchMethod = (name, num, holder, el) => {
        currentMethod = name;
        document.getElementById('methodName').innerText = name + " Transfer";
        document.getElementById('accNumber').innerText = num;
        document.getElementById('accHolder').innerText = holder;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
    };

    window.updatePKR = () => {
        const usd = document.getElementById('depositAmount').value;
        if(usd > 0) document.getElementById('pkrNote').innerText = "Total to Pay: Rs. " + (usd * 300);
    };

    window.updateFileName = () => {
        const file = document.getElementById('proof').files[0];
        if (file) document.getElementById('fileName').innerText = file.name;
    };

    document.getElementById('submitBtn').onclick = async () => {
        const amount = document.getElementById('depositAmount').value;
        const tid = document.getElementById('tid').value;
        const file = document.getElementById('proof').files[0];

        if (!phone) { alert("Session expired, please login again."); return; }
        if (amount < 1) { alert("Minimum deposit is $1"); return; }
        if (!tid) { alert("Please enter Transaction ID"); return; }
        if (!file) { alert("Please upload payment screenshot"); return; }

        document.getElementById('submitBtn').innerText = "Uploading & Submitting...";
        document.getElementById('submitBtn').disabled = true;

        try {
            // تصویر کو ٹیکسٹ میں بدلنا تاکہ ڈیٹا بیس میں جائے
            const base64Img = await getBase64(file);

            // اہم: ڈپازٹ کو الگ 'deposits' والے حصے میں بھی بھیجیں تاکہ ایڈمن پینل دیکھ سکے
            const globalDepRef = push(ref(db, 'deposits'));
            
            const depData = {
                phone: phone, // یوزر کا فون نمبر
                amount: amount,
                tid: tid,
                method: currentMethod,
                screenshot: base64Img, // اب تصویر شو ہوگی
                status: "Pending",
                date: new Date().toLocaleString()
            };

            await set(globalDepRef, depData);
            alert("Request submitted! Please wait for approval.");
            window.location.href = "dashboard.html";
        } catch (e) {
            alert("Error: " + e.message);
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerText = "SUBMIT REQUEST";
        }
    };
</script>
