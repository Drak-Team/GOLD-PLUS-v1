<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Premium Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 90px;
        }

        /* Top Header */
        .header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand i { color: var(--primary-gold); font-size: 24px; filter: drop-shadow(0 0 5px var(--primary-gold)); }
        .brand span { font-size: 20px; font-weight: bold; }
        
        .whatsapp-btn {
            background: #25d366; color: white; padding: 5px 12px;
            border-radius: 10px; text-decoration: none; font-size: 11px;
            display: flex; align-items: center; gap: 5px; font-weight: bold;
        }

        .welcome-msg { padding: 0 20px; font-size: 13px; color: var(--primary-gold); margin-bottom: 15px; }

        .top-stats { display: grid; grid-template-columns: 1.5fr 1fr; padding: 0 20px; margin-bottom: 20px; }
        .stat-item span { display: block; font-size: 11px; color: #aaa; margin-bottom: 5px; }
        .stat-item b { font-size: 18px; }

        /* Mining Section */
        .mining-container {
            background: var(--card-bg); margin: 0 15px; border-radius: 25px;
            padding: 20px; border: 1px solid var(--glass-border);
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }
        .mining-title { font-size: 14px; margin-bottom: 20px; color: #ddd; }
        .machines-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .machine { text-align: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 15px; border: 1px solid var(--glass-border); position: relative; }
        .package-name { font-size: 9px; color: #000; background: var(--primary-gold); padding: 2px 5px; border-radius: 5px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        
        /* Active Badge for Paid Miners */
        .active-badge {
            position: absolute; top: -8px; right: -5px;
            background: var(--primary-gold); color: #000;
            font-size: 8px; font-weight: bold; padding: 2px 6px;
            border-radius: 5px; border: 2px solid #1a0b2e;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }

        .machine img { width: 45px; filter: drop-shadow(0 0 8px gold); }
        .m-timer { font-size: 11px; color: var(--primary-gold); margin: 5px 0; font-family: monospace; }
        .claim-btn { background: linear-gradient(180deg, #f39c12, #d35400); border: none; color: #fff; font-size: 10px; padding: 6px 0; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .get-all-btn { background: linear-gradient(90deg, #f1c40f, #e67e22); color: #000; border: none; width: 100%; padding: 12px; border-radius: 15px; font-weight: bold; font-size: 15px; margin-top: 10px; cursor: pointer; }

        /* Feature Cards Grid */
        .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px 15px; }
        .feature-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 15px; display: flex; flex-direction: column;
            justify-content: space-between; position: relative; overflow: hidden; height: 110px;
        }
        .feature-card img { position: absolute; right: -8px; bottom: -8px; width: 55px; opacity: 0.3; }
        .feature-card h4 { margin: 0; font-size: 13px; color: #ddd; }
        .feature-card p { margin: 5px 0; font-size: 15px; font-weight: bold; color: #fff; }
        .sub-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 10px; padding: 5px 12px; border-radius: 8px; width: fit-content; z-index: 1; cursor: pointer; }
        .gold-btn { background: var(--primary-gold) !important; color: #000 !important; font-weight: bold; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #110720; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--glass-border); z-index: 100; }
        .nav-item { text-align: center; color: #555; text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--primary-gold); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div class="brand"><i class="fas fa-cloud"></i><span>Gold Plus</span></div>
    <a href="https://whatsapp.com/channel/0029VbCAU3sAYlUQQImhoL0l" class="whatsapp-btn"><i class="fab fa-whatsapp"></i> JOIN GROUP</a>
</div>

<div class="welcome-msg">Welcome, Ahmad Nafees!</div>

<div class="top-stats">
    <div class="stat-item"><span>Total assets</span><b>$0.00</b></div>
    <div class="stat-item"><span>Total Miners</span><b><span id="activeMinersCount">0</span> Active</b></div>
</div>

<div class="mining-container">
    <div class="mining-title">Your <b>Mining Center</b></div>
    <div class="machines-grid">
        <div class="machine">
            <span class="package-name" style="background: #7f8c8d; color: white;">FREE PLAN</span>
            <img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">
            <div class="m-timer" id="freeTimer">23:59:59</div>
            <button class="claim-btn" style="background: #34495e;">Claim Free</button>
        </div>
        <div class="machine">
            <div class="active-badge" id="minerBadge">0 ACTIVE</div>
            <span class="package-name">PAID MINERS</span>
            <img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png" style="filter: drop-shadow(0 0 10px gold);">
            <div class="m-timer" id="paidTimer">00:00:00</div>
            <button class="claim-btn">Claim Paid</button>
        </div>
    </div>
    <button class="get-all-btn">Claim All Earnings</button>
</div>

<div class="features-grid">
    <div class="feature-card">
        <h4>My Team</h4>
        <p style="color: #00ff64;">+0 Members</p>
        <button class="sub-btn" onclick="location.href='refer.html'">Invite</button>
        <img src="https://cdn-icons-png.flaticon.com/512/1256/1256650.png">
    </div>
    <div class="feature-card">
        <h4>Daily Earning</h4>
        <p style="color: #00ff64;">+ $0.00</p>
        <button class="sub-btn">History</button>
        <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">
    </div>
    <div class="feature-card">
        <h4>Withdraw</h4>
        <p>$0.00</p>
        <button class="sub-btn gold-btn" onclick="location.href='withdraw.html'">Withdraw</button>
        <img src="https://cdn-icons-png.flaticon.com/512/10142/10142318.png">
    </div>
    <div class="feature-card">
        <h4>Deposit</h4>
        <p style="color: var(--primary-gold); font-size: 11px;">Fast Payment</p>
        <button class="sub-btn gold-btn" onclick="location.href='deposit.html'">Deposit</button>
        <img src="https://cdn-icons-png.flaticon.com/512/3037/3037150.png">
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active"><i class="fas fa-th-large"></i>HOME</a>
    <a href="plans.html" class="nav-item"><i class="fas fa-gem"></i>INVEST</a>
    <a href="mining.html" class="nav-item"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-item"><i class="fas fa-paper-plane"></i>INVITE</a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i>PROFILE</a>
</nav>

<script>
    // ٹائمر فنکشن
    function startTimer(duration, displayId) {
        let timer = duration, hours, minutes, seconds;
        setInterval(function () {
            hours = parseInt(timer / 3600, 10);
            minutes = parseInt((timer % 3600) / 60, 10);
            seconds = parseInt(timer % 60, 10);
            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;
            document.getElementById(displayId).textContent = hours + ":" + minutes + ":" + seconds;
            if (--timer < 0) timer = duration;
        }, 1000);
    }

    window.onload = function () {
        startTimer(24 * 60 * 60, "freeTimer");
        // مثال کے طور پر اگر 2 پلان ایکٹیو ہوں تو بیج اپ ڈیٹ کریں
        let activePaidPlans = 2; // یہ ڈیٹا فائر بیس سے آئے گا
        document.getElementById('minerBadge').textContent = activePaidPlans + " ACTIVE";
        document.getElementById('activeMinersCount').textContent = activePaidPlans + 1; // +1 فری والا
        if(activePaidPlans > 0) startTimer(24 * 60 * 60, "paidTimer");
    };
</script>

</body>
</html>
