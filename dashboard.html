<script type="module">
    // ... (باقی فائر بیس کنفیگریشن وہی رہے گی)

    function handleTimer(lastClaim, userPlan) {
        const btn = document.getElementById('claimBtn');
        const machines = [
            { id: 'm1', plan: 'Free', icon: 'fa-microchip' },
            { id: 'm2', plan: 'Starter', icon: 'fa-bolt' },
            { id: 'm3', plan: 'Premium', icon: 'fa-server' },
            { id: 'm4', plan: 'Ultimate', icon: 'fa-link' }
        ];

        const runTimer = () => {
            const now = new Date().getTime();
            const timeLeft = (lastClaim + (24 * 60 * 60 * 1000)) - now;

            machines.forEach((m, index) => {
                const card = document.querySelectorAll('.machine-card')[index];
                const timerEl = card.querySelector('.t-sync');
                const ball = card.querySelector('.coin-ball');

                // اگر یہ مشین یوزر کے ایکٹیو پلان کی ہے
                if (m.plan === userPlan) {
                    if (timeLeft <= 0) {
                        timerEl.innerText = "Ready";
                        ball.style.animation = "none"; // کام ختم تو گھومنا بند
                        if (m.plan === userPlan) { btn.disabled = false; btn.innerText = "CLAIM PROFIT"; }
                    } else {
                        const h = Math.floor((timeLeft / (1000 * 60 * 60)) % 24);
                        const mStr = Math.floor((timeLeft / (1000 * 60)) % 60);
                        const s = Math.floor((timeLeft / 1000) % 60);
                        const timeStr = `${h}h ${mStr}m ${s}s`;
                        
                        timerEl.innerText = timeStr;
                        ball.style.animation = "spin 4s linear infinite"; // صرف ایکٹیو مشین گھومے گی
                        btn.disabled = true;
                        btn.innerText = "MINING: " + timeStr;
                    }
                } else {
                    // جو پلان ایکٹیو نہیں ہے وہ خاموش کھڑی رہے گی
                    timerEl.innerText = "Locked";
                    timerEl.style.color = "#555";
                    ball.style.animation = "none";
                    ball.style.opacity = "0.3";
                }
            });
        };

        setInterval(runTimer, 1000);
        runTimer();
    }
</script>
