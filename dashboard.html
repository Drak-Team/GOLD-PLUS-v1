<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - AI Mining Robot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22); --card-bg: rgba(255, 255, 255, 0.08); --primary-gold: #f1c40f; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0b0214; color: white; padding-bottom: 90px; overflow-x: hidden; }
        
        .top-header { padding: 25px 20px; background: rgba(241, 196, 15, 0.05); border-bottom: 1px solid rgba(241, 196, 15, 0.2); border-radius: 0 0 30px 30px; text-align: center; }
        .user-welcome { color: #f1c40f; font-size: 14px; letter-spacing: 1px; }
        .main-balance { font-size: 32px; font-weight: 800; margin: 10px 0; text-shadow: 0 0 15px rgba(241,196,15,0.3); }

        /* Robot Mining Section */
        .mining-area { margin: 20px; padding: 25px; background: var(--card-bg); border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); position: relative; text-align: center; }
        .robot-box { width: 120px; height: 120px; margin: 0 auto 15px; position: relative; }
        .robot-icon { font-size: 60px; color: var(--primary-gold); animation: float 3s ease-in-out infinite; }
        .mining-pulse { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; background: rgba(241,196,15,0.1); border-radius: 50%; animation: pulse 2s infinite; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }

        /* Battery Style Progress */
        .battery-container { width: 80%; background: #000; height: 25px; border-radius: 12px; margin: 15px auto; border: 2px solid #333; position: relative; overflow: hidden; }
        .battery-fill { height: 100%; width: 0%; background: var(--gold-grad); box-shadow: 0 0 15px #f1c40f; transition: 1s; }
        .percent-text { position: absolute; width: 100%; top: 0; left: 0; font-size: 12px; font-weight: bold; line-height: 22px; color: #fff; }

        .active-label { display: inline-block; padding: 5px 15px; background: rgba(0, 255, 100, 0.1); color: #00ff64; border-radius: 20px; font-size: 12px; border: 1px solid #00ff64; margin-bottom: 10px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; }
        .stat-item { background: var(--card-bg); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-item small { display: block; color: #888; font-size: 10px; }
        .stat-item b { font-size: 16px; color: var(--primary-gold); }

        .claim-btn { width: calc(100% - 40px); margin: 20px; padding: 18px; border-radius: 20px; border: none; font-weight: 800; font-size: 18px; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .btn-ready { background: var(--gold-grad); color: #000; box-shadow: 0 8px 20px rgba(241,196,15,0.4); }
        .btn-waiting { background: #222; color: #666; cursor: not-allowed; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0a0414; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(241, 196, 15, 0.2); z-index: 1000; }
        .nav-btn { color: #666; text-decoration: none; text-align: center; font-size: 10px; flex: 1; }
        .nav-btn.active { color: #f1c40f; }
        .nav-btn i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="top-header">
    <div class="user-welcome">GOLD PLUS AI TERMINAL</div>
    <div class="main-balance" id="mainBalance">$0.00</div>
    <div id="userNameLabel" style="font-size: 12px; opacity: 0.7;">Welcome...</div>
</div>

<div class="mining-area">
    <div class="active-label">SERVER STATUS: <span id="activePlan">Checking...</span></div>
    
    <div class="robot-box">
        <div class="mining-pulse"></div>
        <i class="fas fa-robot robot-icon"></i>
    </div>
    
    <h4 style="margin:0; color:var(--primary-gold)">AI MINING IN PROGRESS</h4>
    
    <div class="battery-container">
        <div class="battery-fill" id="progressFill"></div>
        <div class="percent-text" id="percentTxt">0%</div>
    </div>
    
    <div style="font-size: 13px; color: #00ff64; font-weight: bold;" id="timerDisplay">Syncing...</div>
</div>

<div class="stats-grid">
    <div class="stat-item"><small>TOTAL DEPOSIT</small><b id="sumDeposit">$0.00</b></div>
    <div class="stat-item"><small>TOTAL EARNED</small><b id="sumEarned">$0.00</b></div>
</div>

<button id="claimBtn" class="claim-btn btn-waiting" disabled>PLEASE WAIT</button>

<div class="stats-grid" style="margin-top: 10px;">
    <div class="stat-item" onclick="location.href='deposit.html'"><i class="fas fa-wallet" style="margin-right:8px;"></i>Deposit</div>
    <div class="stat-item" onclick="location.href='withdraw.html'"><i class="fas fa-university" style="margin-right:8px;"></i>Withdraw</div>
</div>

<nav class="nav-bar">
    <a href="dashboard.html" class="nav-btn active"><i class="fas fa-house"></i>HOME</a>
    <a href="plans.html" class="nav-btn"><i class="fas fa-gem"></i>PLANS</a>
    <a href="mining.html" class="nav-btn"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-btn"><i class="fas fa-users"></i>REFER</a>
    <a href="profile.html" class="nav-btn"><i class="fas fa-user-gear"></i>PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const username = localStorage.getItem('userPhone');

    let userData = null;

    window.onload = () => {
        if (!username) window.location.href = 'index.html';
        else syncData();
    };

    function syncData() {
        onValue(ref(db, 'users/' + username), (snap) => {
            userData = snap.val();
            if (userData) {
                document.getElementById('mainBalance').innerText = "$" + (userData.balance || 0).toFixed(2);
                document.getElementById('sumEarned').innerText = "$" + (userData.totalEarned || 0).toFixed(2);
                document.getElementById('sumDeposit').innerText = "$" + (userData.totalDeposit || 0).toFixed(2);
                document.getElementById('userNameLabel').innerText = "ID: " + username;
                document.getElementById('activePlan').innerText = (userData.plan || "Free").toUpperCase();
                startMiningLogic();
            }
        });
    }

    function startMiningLogic() {
        const lastClaim = userData.lastClaim || 0;
        const cooldown = 24 * 60 * 60 * 1000;
        
        const update = () => {
            const now = Date.now();
            const elapsed = now - lastClaim;
            const remaining = cooldown - elapsed;
            
            if (remaining <= 0) {
                // Ready to Claim
                document.getElementById('timerDisplay').innerText = "MINING COMPLETE! READY";
                document.getElementById('progressFill').style.width = "100%";
                document.getElementById('percentTxt').innerText = "100%";
                document.getElementById('claimBtn').innerText = "CLAIM PROFIT NOW";
                document.getElementById('claimBtn').className = "claim-btn btn-ready";
                document.getElementById('claimBtn').disabled = false;
            } else {
                // Mining in Progress
                const h = Math.floor(remaining / 3600000);
                const m = Math.floor((remaining % 3600000) / 60000);
                const s = Math.floor((remaining % 60000) / 1000);
                
                document.getElementById('timerDisplay').innerText = `NEXT PAYOUT IN: ${h}h ${m}m ${s}s`;
                
                const progress = (elapsed / cooldown) * 100;
                document.getElementById('progressFill').style.width = progress + "%";
                document.getElementById('percentTxt').innerText = Math.floor(progress) + "%";
                
                document.getElementById('claimBtn').innerText = "MINING IN PROGRESS...";
                document.getElementById('claimBtn').className = "claim-btn btn-waiting";
                document.getElementById('claimBtn').disabled = true;
            }
        };
        
        setInterval(update, 1000);
        update();
    }

    window.processClaim = () => {
        const earn = userData.plan === "Free" ? 0.50 : (userData.dailyEarning || 5.00);
        
        runTransaction(ref(db, 'users/' + username), (curr) => {
            if (curr) {
                const now = Date.now();
                if (now - (curr.lastClaim || 0) >= 24 * 60 * 60 * 1000) {
                    curr.balance = (curr.balance || 0) + earn;
                    curr.totalEarned = (curr.totalEarned || 0) + earn;
                    curr.lastClaim = now;
                    return curr;
                }
            }
        }).then(res => {
            if (res.committed) alert("Success! $" + earn + " added to your assets.");
        });
    };

    document.getElementById('claimBtn').onclick = window.processClaim;

</script>
</body>
</html>
