<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card: #121212; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 100px; }
        .header { padding: 20px; background: #111; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--gold); }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #222; text-align: center; }
        .stat-card i { color: var(--gold); font-size: 20px; }
        .stat-card h2 { font-size: 18px; margin: 10px 0 0 0; }
        .mining-box { text-align: center; margin: 20px 15px; padding: 30px; background: #111; border-radius: 20px; border: 1px solid #d4af3744; }
        .mine-img { width: 100px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-link { color: #888; text-decoration: none; font-size: 10px; text-align: center; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body>
    <div class="header">
        <div><p style="margin:0; font-size:12px;">Balance</p><h3 id="bal" style="margin:0; color:var(--gold);">Rs. 0</h3></div>
        <i class="fa-solid fa-user-circle fa-2x"></i>
    </div>
    <div class="stats-grid">
        <div class="stat-card"><i class="fa-solid fa-coins"></i><p style="font-size:10px; margin:5px 0;">Today Profit</p><h2 id="today">Rs. 0</h2></div>
        <div class="stat-card"><i class="fa-solid fa-download"></i><p style="font-size:10px; margin:5px 0;">Total Deposit</p><h2 id="dep">Rs. 0</h2></div>
    </div>
    <div class="mining-box">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" class="mine-img">
        <h3 style="color:var(--gold)">Mining Engine Active</h3>
        <button onclick="alert('Mining in progress...')" style="background:var(--gold); border:none; padding:12px 30px; border-radius:20px; font-weight:bold; margin-top:15px;">COLLECT GOLD</button>
    </div>
    <div class="nav-bar">
        <a href="dashboard.html" class="nav-link active"><i class="fa-solid fa-house d-block"></i>Home</a>
        <a href="plans.html" class="nav-link"><i class="fa-solid fa-gem d-block"></i>Plans</a>
        <a href="refer.html" class="nav-link"><i class="fa-solid fa-users d-block"></i>Team</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user d-block"></i>Profile</a>
    </div>
</body>
</html>
