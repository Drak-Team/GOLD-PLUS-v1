<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Plus Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f051d, #1a0b2e);
    color: white;
    padding-bottom: 80px;
  }

  /* HEADER */
  .header { padding: 20px; }
  .header h1 { color: #f1c40f; margin: 0; font-size: 24px; }
  .top-info { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; opacity: 0.8; }

  /* CARD */
  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px;
    margin: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  /* MINERS */
  .miners { display: flex; gap: 10px; padding: 5px; }
  .miner { flex: 1; text-align: center; }
  .miner img { width: 70px; margin-bottom: 10px; filter: drop-shadow(0 0 10px gold); }
  .miner h3 { margin: 5px 0; font-size: 16px; }
  .miner p { font-size: 12px; color: #aaa; margin: 5px 0; }
  .timer { margin: 10px 0; font-size: 16px; font-weight: bold; color: #ff4e00; font-family: monospace; }
  .btn {
    background: linear-gradient(135deg, #f1c40f, #d4ac0d);
    color: black;
    padding: 12px;
    border-radius: 12px;
    border: none;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  .btn:active { transform: scale(0.95); }

  /* BALANCE */
  .balance { text-align: center; }
  .balance h2 { font-size: 40px; margin: 10px 0; letter-spacing: 1px; }
  .bal-sub { display: flex; justify-content: space-around; font-size: 12px; }

  /* ACTION BUTTONS */
  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; }
  .action { 
    background: rgba(255,255,255,0.05); 
    padding: 15px 5px; 
    border-radius: 15px; 
    text-align: center; 
    font-size: 11px;
    color: #fff;
    text-decoration: none;
  }
  .action i { display: block; font-size: 24px; margin-bottom: 8px; }
  .icon-dep { color: #f1c40f; }
  .icon-wit { color: #2ecc71; }
  .icon-pro { color: #9b59b6; }
  .icon-sup { color: #25d366; }

  /* NAVBAR */
  .navbar {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #1a0b2e;
    display: flex;
    justify-content: space-around;
    padding: 15px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .nav-item { text-align: center; font-size: 10px; color: #666; text-decoration: none; }
  .nav-item.active { color: #f1c40f; }
  .nav-item i { display: block; font-size: 20px; margin-bottom: 3px; }
</style>
</head>

<body>

<div class="header">
  <h1>Gold Plus <span style="font-weight: 300; font-size: 16px; color: white;">Dashboard</span></h1>
  <div class="top-info">
    <div>Welcome, User</div>
    <div style="text-align: right;">Active Miners: <b style="color: #f1c40f;">2</b></div>
  </div>
</div>

<div class="miners">
  <div class="card miner">
    <img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">
    <h3>Gold 1</h3>
    <p>Earning: $2/day</p>
    <div class="timer" id="time1">02:15:30</div>
    <button class="btn" onclick="collect('time1')">Collect</button>
  </div>

  <div class="card miner">
    <img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">
    <h3>Gold 2</h3>
    <p>Earning: $1/day</p>
    <div class="timer" id="time2">01:30:45</div>
    <button class="btn" onclick="collect('time2')">Collect</button>
  </div>
</div>

<div class="card balance">
  <p style="font-size: 12px; opacity: 0.6; margin: 0;">Total Balance</p>
  <h2>$0.00</h2>
  <div class="bal-sub">
    <span style="color: #2ecc71;">Daily: +$0.00</span>
    <span>Total Earned: $0.00</span>
  </div>
</div>

<div class="actions">
  <a href="deposit.html" class="action"><i class="fas fa-wallet icon-dep"></i>Deposit</a>
  <a href="withdraw.html" class="action"><i class="fas fa-money-bill-transfer icon-wit"></i>Withdraw</a>
  <a href="promo.html" class="action"><i class="fas fa-gift icon-pro"></i>Promo</a>
  <a href="https://wa.me/923000000000" class="action"><i class="fab fa-whatsapp icon-sup"></i>Support</a>
</div>

<div class="navbar">
  <a href="#" class="nav-item active"><i class="fas fa-th-large"></i>Home</a>
  <a href="#" class="nav-item"><i class="fas fa-chart-line"></i>Invest</a>
  <a href="#" class="nav-item"><i class="fas fa-coins"></i>Earn</a>
  <a href="#" class="nav-item"><i class="fas fa-paper-plane"></i>Invite</a>
  <a href="#" class="nav-item"><i class="fas fa-user-circle"></i>Profile</a>
</div>

<script>
  // لائیو ٹائمر فنکشن
  function startCountDown(id, seconds) {
    let timer = seconds;
    const element = document.getElementById(id);
    setInterval(function () {
      let h = Math.floor(timer / 3600);
      let m = Math.floor((timer % 3600) / 60);
      let s = Math.floor(timer % 60);
      element.innerText = 
        (h < 10 ? "0" + h : h) + ":" + 
        (m < 10 ? "0" + m : m) + ":" + 
        (s < 10 ? "0" + s : s);
      if (--timer < 0) timer = 0;
    }, 1000);
  }

  window.onload = function () {
    startCountDown('time1', 8130); // 2:15:30
    startCountDown('time2', 5445); // 1:30:45
  };

  function collect(id) {
    alert("Profit collected from " + id + "!");
  }
</script>

</body>
</html>
