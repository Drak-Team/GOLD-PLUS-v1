<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --bg: #0f051d; --card: #1a0b2e; --grad: linear-gradient(135deg, #f39c12, #e67e22); }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 90px; }

        /* 🏆 اوپر والا لوگو سیکشن */
        .top-nav { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo-text { font-size: 24px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }

        .container { padding: 20px; }

        /* 💰 بڑا بیلنس ڈیش بورڈ */
        .main-balance-card { 
            background: var(--grad); border-radius: 30px; padding: 30px 20px; 
            text-align: center; box-shadow: 0 15px 35px rgba(230, 126, 34, 0.4); margin-bottom: 25px;
        }
        .bal-label { font-size: 14px; opacity: 0.9; text-transform: uppercase; }
        .total-amount { font-size: 38px; font-weight: 800; margin: 10px 0; }
        
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .act-btn { 
            background: rgba(255,255,255,0.25); border: none; padding: 15px; 
            border-radius: 15px; color: #fff; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(10px); text-decoration: none; font-size: 14px;
        }

        /* 📦 چھوٹے ڈبے (سیکشنز) */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-box { 
            background: var(--card); border-radius: 20px; padding: 20px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-box i { font-size: 25px; color: var(--gold); margin-bottom: 10px; display: block; }
        .stat-box span { font-size: 12px; color: #888; display: block; margin-bottom: 5px; }
        .stat-box b { font-size: 16px; color: #fff; }

        /* 📋 ریفرل لنک */
        .invite-section { background: rgba(241, 196, 15, 0.05); margin-top: 25px; padding: 20px; border-radius: 20px; border: 1px dashed var(--gold); }
        .invite-section h4 { margin: 0 0 10px 0; font-size: 14px; color: var(--gold); }
        .ref-box { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px; border-radius: 10px; font-size: 12px; }

        /* 底部 پٹی (Bottom Navigation) */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: #1a0b2e; 
            display: flex; justify-content: space-around; padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000;
        }
        .nav-link { text-decoration: none; color: #666; text-align: center; font-size: 10px; transition: 0.3s; }
        .nav-link.active { color: var(--gold); }
        .nav-link i { font-size: 22px; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo-text">GOLD PLUS</div>
    </div>

    <div class="container">
        <div class="main-balance-card">
            <div class="bal-label">Available Balance</div>
            <div class="total-amount">Rs. 5603.00</div>
            <div class="action-row">
                <a href="deposit.html" class="act-btn"><i class="fa-solid fa-wallet"></i> Deposit</a>
                <a href="withdraw.html" class="act-btn"><i class="fa-solid fa-money-bill-transfer"></i> Withdraw</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <i class="fa-solid fa-users"></i>
                <span>My Team</span>
                <b>12 Members</b>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-chart-line"></i>
                <span>Daily Profit</span>
                <b>Rs. 140.00</b>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-layer-group"></i>
                <span>Active Plans</span>
                <b>02 Active</b>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Total Earned</span>
                <b>Rs. 12500.00</b>
            </div>
        </div>

        <div class="invite-section">
            <h4>Invite Your Friends</h4>
            <div class="ref-box">
                <span>goldplus.com/reg?ref=8847</span>
                <i class="fa-solid fa-copy" style="color:var(--gold)" onclick="alert('Copied!')"></i>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-link active">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </a>
        <a href="plans.html" class="nav-link">
            <i class="fa-solid fa-gem"></i>
            <span>PLANS</span>
        </a>
        <a href="mining.html" class="nav-link">
            <i class="fa-solid fa-microchip"></i>
            <span>MINING</span>
        </a>
        <a href="profile.html" class="nav-link">
            <i class="fa-solid fa-user-circle"></i>
            <span>PROFILE</span>
        </a>
    </div>

</body>
</html>
