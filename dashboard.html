<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Plus</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#12002b,#1e003d);
color:#fff;
}

/* HEADER */
.header{
padding:15px;
}
.logo{
display:flex;
justify-content:space-between;
align-items:center;
}
.logo h2{color:#fff;}
.play{
font-size:12px;
text-align:right;
}
.play small{display:block;color:#aaa;}

.stats{
display:flex;
justify-content:space-between;
margin-top:10px;
font-size:14px;
}

/* MINING BOX */
.mining-box{
background:rgba(255,255,255,0.05);
margin:15px;
padding:15px;
border-radius:20px;
}

.machines{
display:flex;
gap:10px;
overflow:auto;
}

.machine{
min-width:120px;
text-align:center;
}

.machine img{
width:70px;
animation:float 3s infinite;
}
@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

.timer{
margin:5px 0;
font-weight:bold;
}

.claim{
background:gold;
border:none;
padding:6px 10px;
border-radius:10px;
cursor:pointer;
}

/* GET ALL */
.getall{
margin:15px;
text-align:center;
}
.getall button{
background:linear-gradient(45deg,gold,orange);
border:none;
padding:12px;
width:90%;
border-radius:20px;
font-size:16px;
}

/* CARDS */
.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:10px;
}
.card{
background:rgba(255,255,255,0.05);
padding:15px;
border-radius:15px;
}

/* NAV */
.nav{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
background:#140033;
padding:10px;
}
</style>
</head>

<body>

<div class="header">
<div class="logo">
<h2>Gold Plus</h2>
<div class="play">
<i class="fab fa-google-play"></i>
<small>Coming Soon</small>
</div>
</div>

<div class="stats">
<div>Total Balance: $<span id="bal">0</span></div>
<div>Miners: <span id="miners">3</span></div>
</div>
</div>

<!-- MINING -->
<div class="mining-box">
<h3>Your Mining Machines</h3>

<div class="machines" id="machines"></div>
</div>

<!-- GET ALL -->
<div class="getall">
<button onclick="getAll()">GET ALL</button>
<p style="font-size:12px;color:#aaa;">Claim before 24h</p>
</div>

<!-- CARDS -->
<div class="cards">
<div class="card">My Team</div>
<div class="card">Daily Earning</div>
<div class="card">Withdraw</div>
<div class="card">Deposit</div>
</div>

<!-- NAV -->
<div class="nav">
<div>Home</div>
<div>Invest</div>
<div>Earn</div>
<div>Invite</div>
<div>Profile</div>
</div>

<script>
let balance=0;

let machines=[
{time:60,reward:2},
{time:40,reward:1},
{time:20,reward:3}
];

function render(){
let html="";
machines.forEach((m,i)=>{
html+=`
<div class="machine">
<img src="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">
<div class="timer" id="t${i}"></div>
<button class="claim" onclick="claim(${i})">Claim</button>
</div>`;
});
document.getElementById("machines").innerHTML=html;
}

render();

// TIMER
machines.forEach((m,i)=>{
let t=m.time;
setInterval(()=>{
let m1=Math.floor(t/60);
let s=t%60;
document.getElementById("t"+i).innerText=m1+":"+s;
if(t>0)t--;
},1000);
});

// CLAIM
function claim(i){
if(machines[i].time>0){
alert("Time not finished!");
return;
}
balance+=machines[i].reward;
document.getElementById("bal").innerText=balance;
machines[i].time=60;
}

// GET ALL
function getAll(){
let total=0;
machines.forEach(m=>{
if(m.time<=0){
total+=m.reward;
m.time=60;
}
});
if(total==0) return alert("Nothing to collect");
balance+=total;
document.getElementById("bal").innerText=balance;
}
</script>

</body>
</html>
