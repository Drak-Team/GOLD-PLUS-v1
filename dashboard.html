<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mine Vault - Premium Mining</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --gold-main: #f1c40f; 
            --gold-dark: #e67e22;
            --bg-deep: #050505; 
            --card-glass: rgba(255, 255, 255, 0.05);
            --border-gold: rgba(241, 196, 15, 0.3);
        }
        
        body { 
            margin: 0; 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-deep); 
            color: white; 
            padding-bottom: 100px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 100%);
        }

        /* --- Premium Header --- */
        .top-header { 
            padding: 40px 20px; 
            background: linear-gradient(180deg, rgba(241, 196, 15, 0.15) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-gold);
            text-align: center;
        }

        .balance-card {
            background: var(--card-glass);
            padding: 25px;
            border-radius: 30px;
            border: 1px solid var(--border-gold);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-top: -20px;
            backdrop-filter: blur(10px);
        }

        .vault-id { font-size: 11px; color: var(--gold-main); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .main-amount { font-size: 38px; font-weight: 800; margin: 5px 0; background: linear-gradient(to right, #fff, #f1c40f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pkr-sub { font-size: 14px; opacity: 0.6; }

        /* --- Stats Row --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .s-box { 
            background: var(--card-glass); 
            padding: 15px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }
        .s-icon { font-size: 20px; color: var(--gold-main); }
        .s-info small { font-size: 10px; color: #888; display: block; }
        .s-info b { font-size: 15px; }

        /* --- Machine Grid (Image Style) --- */
        .machines-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px 20px; }
        .m-card { 
            background: var(--card-glass); 
            padding: 15px 5px; 
            border-radius: 18px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.05); 
        }
        .m-card i { font-size: 18px; color: var(--gold-main); margin-bottom: 8px; display: block; }
        .m-card span { font-size: 9px; text-transform: uppercase; color: #666; font-weight: bold; }

        /* --- Claim Button (Premium Glow) --- */
        .claim-area { padding: 20px; }
        .claim-btn { 
            background: linear-gradient(90deg, #f1c40f, #e67e22); 
            width: 100%; 
            padding: 20px; 
            border: none; 
            border-radius: 20px; 
            font-weight: 900; 
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Menu Grid --- */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .menu-item { 
            background: var(--card-glass); 
            padding: 20px; 
            border-radius: 25px; 
            text-decoration: none; 
            color: white; 
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
        }
        .menu-item:active { transform: scale(0.95); background: rgba(241, 196, 15, 0.1); }
        .menu-item i { color: var(--gold-main); font-size: 20px; margin-bottom: 10px; display: block; }
        .menu-item h5 { margin: 0; font-size: 14px; }
        .menu-item p { margin: 5px 0 0; font-size: 11px; opacity: 0.5; }

        /* --- Navbar --- */
        .navbar { 
            position: fixed; bottom: 0; width: 100%; 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; 
            padding: 15px 0; border-top: 1px solid var(--border-gold); 
        }
        .nav-link { text-decoration: none; color: #555; text-align: center; font-size: 10px; }
        .nav-link.active { color: var(--gold-main); }
        .nav-link i { font-size: 20px; display: block; margin-bottom: 5px; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .active-dot { width: 8px; height: 8px; background: #00ff64; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 10px #00ff64; animation: pulse 2s infinite; }
    </style>
</head>
<body>

<div class="top-header">
    <div class="vault-id" id="userNameLabel">VAULT ID: ---</div>
    <div class="balance-card">
        <small style="opacity: 0.6;">Available Vault Assets</small>
        <div class="main-amount" id="mainBalance">$0.00</div>
        <div class="pkr-sub" id="pkrBalance">Rs. 0.00</div>
        <div style="margin-top: 15px; font-size: 11px;">
            <span class="active-dot"></span> <span id="activePlan">Checking Status...</span>
        </div>
    </div>
</div>

<div class="stats-grid">
    <div class="s-box">
        <div class="s-icon"><i class="fas fa-arrow-down"></i></div>
        <div class="s-info"><small>Deposit</small><b id="totalDeposit">$0.00</b></div>
    </div>
    <div class="s-box">
        <div class="s-icon"><i class="fas fa-chart-line"></i></div>
        <div class="s-info"><small>Earnings</small><b id="totalEarned">$0.00</b></div>
    </div>
</div>

<div class="machines-row">
    <div class="m-card"><i class="fas fa-microchip"></i><span>CPU</span></div>
    <div class="m-card"><i class="fas fa-bolt"></i><span>POWER</span></div>
    <div class="m-card"><i class="fas fa-server"></i><span>NODE</span></div>
    <div class="m-card"><i class="fas fa-link"></i><span>HASH</span></div>
</div>

<div class="claim-area">
    <button class="claim-btn" id="claimBtn">
        <span>COLLECT VAULT MINING</span>
        <i class="fas fa-chevron-right"></i>
    </button>
</div>

<div class="menu-grid">
    <a href="refer.html" class="menu-item"><i class="fas fa-users"></i><h5>My Team</h5><p id="teamCount">0 Members</p></a>
    <a href="mining.html" class="menu-item"><i class="fas fa-hammer"></i><h5>Daily Task</h5><p>Extract Profit</p></a>
    <a href="withdraw.html" class="menu-item"><i class="fas fa-wallet"></i><h5>Withdraw</h5><p id="withdrawStat">$0.00</p></a>
    <a href="deposit.html" class="menu-item"><i class="fas fa-coins"></i><h5>Deposit</h5><p>Add Assets</p></a>
</div>

<nav class="navbar">
    <a href="dashboard.html" class="nav-link active"><i class="fas fa-home"></i>HOME</a>
    <a href="plans.html" class="nav-link"><i class="fas fa-gem"></i>PLANS</a>
    <a href="mining.html" class="nav-link"><i class="fas fa-plus-circle"></i>EARN</a>
    <a href="refer.html" class="nav-link"><i class="fas fa-share-nodes"></i>REFER</a>
    <a href="profile.html" class="nav-link"><i class="fas fa-user"></i>PROFILE</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');
    const PKR_RATE = 300; 

    if (!phone) window.location.href = "login.html";

    db.ref('users/' + phone).on('value', (snapshot) => {
        if (snapshot.exists()) {
            const data = snapshot.val();
            const rawBalance = parseFloat(data.balance || 0);
            const usdBalance = rawBalance / PKR_RATE;
            
            document.getElementById('mainBalance').innerText = "$" + usdBalance.toFixed(2);
            document.getElementById('pkrBalance').innerText = "Rs. " + rawBalance.toLocaleString();
            document.getElementById('withdrawStat').innerText = "$" + usdBalance.toFixed(2);
            
            document.getElementById('totalDeposit').innerText = "$" + (parseFloat(data.totalDeposit || 0) / PKR_RATE).toFixed(2);
            document.getElementById('totalEarned').innerText = "$" + (parseFloat(data.totalEarned || 0) / PKR_RATE).toFixed(2);
            
            document.getElementById('activePlan').innerText = data.plan || "No Active Plan";
            document.getElementById('userNameLabel').innerText = "VAULT ID: " + phone;
            document.getElementById('teamCount').innerText = (data.referCount || 0) + " Members";
        }
    });

    document.getElementById('claimBtn').onclick = () => window.location.href = "mining.html";
</script>

</body>
</html>
