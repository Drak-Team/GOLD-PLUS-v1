<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase Config (Same as before)
    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const phone = localStorage.getItem('userPhone');

    function syncData() {
        onValue(ref(db, 'users/' + phone), (snap) => {
            const userData = snap.val();
            if (userData) {
                // Balance & Stats Update
                document.getElementById('mainBalance').innerText = "$" + (userData.balance || 0).toFixed(2);
                
                // یہاں پلس (+) کا نشان لگا دیا ہے تاکہ نل (null) ویلیو نہ آئے
                const totalEarned = userData.totalEarned || 0;
                document.getElementById('sumEarned').innerText = "$" + parseFloat(totalEarned).toFixed(2);
                
                document.getElementById('sumDeposit').innerText = "$" + (userData.totalDeposit || 0).toFixed(2);
                document.getElementById('userNameLabel').innerText = "Hello, " + (userData.username || "Member");
                document.getElementById('activePlan').innerText = userData.plan || "Free";
                
                // TEAM COUNT FIX:
                // اگر referrals کا فولڈر ہے تو اسے گنیں، ورنہ 0
                let count = 0;
                if (userData.referrals) {
                    count = Object.keys(userData.referrals).length;
                }
                document.getElementById('teamCount').innerText = count + " Members";
                
                updateMachineUI(userData.plan || "Free");
                startTimer(userData.lastClaim);
            }
        });
    }

    // Claim Profit Function (یہ اہم ہے)
    document.getElementById('claimBtn').onclick = () => {
        runTransaction(ref(db, 'users/' + phone), (curr) => {
            if (curr) {
                // پیکج کے حساب سے ارننگ (Adjust manually)
                let earn = 0.50; 
                if(curr.plan === "Starter") earn = 1.50;
                if(curr.plan === "VIP1") earn = 5.00;
                if(curr.plan === "VIP2") earn = 12.00;

                const now = Date.now();
                const last = curr.lastClaim || 0;

                // 24 گھنٹے کا چیک
                if (now - last >= 24 * 60 * 60 * 1000) {
                    curr.balance = (parseFloat(curr.balance) || 0) + earn;
                    // ٹوٹل ارنڈ کو اپڈیٹ کرنا ضروری ہے
                    curr.totalEarned = (parseFloat(curr.totalEarned) || 0) + earn; 
                    curr.lastClaim = now;
                    return curr;
                }
            }
        }).then((result) => {
            if(result.committed) {
                alert("Profit Claimed Successfully!");
            } else {
                alert("Please wait for your next claim time!");
            }
        });
    };

    window.onload = () => { 
        if (!phone) window.location.href = 'index.html'; 
        else { syncData(); generateTicker(); }
    };
</script>
