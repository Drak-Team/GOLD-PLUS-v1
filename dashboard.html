<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // 1. Gmail Auth اور لاگ ان چیک
    onAuthStateChanged(auth, (user) => {
        const userPhone = localStorage.getItem('userPhone');
        if (user && userPhone) {
            listenToUserData(userPhone);
        } else {
            // اگر فائر بیس ابھی لوڈ ہو رہا ہو تو فوراً ری ڈائریکٹ نہ کریں
            setTimeout(() => {
                if (!auth.currentUser && !localStorage.getItem('userPhone')) {
                    window.location.href = 'index.html';
                }
            }, 3000);
        }
    });

    // 2. ڈیٹا بیس سے لائیو معلومات اٹھانا
    function listenToUserData(phone) {
        const userRef = ref(database, 'users/' + phone);
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // پریمیم ڈیش بورڈ کی ویلیوز اپ ڈیٹ کریں (محفوظ طریقے سے)
                const bal = document.getElementById('mainBalance');
                if(bal) bal.innerText = "$" + (data.balance || 0).toFixed(2);

                const nameL = document.getElementById('userNameLabel');
                if(nameL) nameL.innerText = "Welcome, " + (data.name || "User") + "!";

                const teamC = document.getElementById('teamCount');
                if(teamC) teamC.innerText = "+" + (data.referCount || 0) + " Members";
                
                const withS = document.getElementById('withdrawStat');
                if(withS && data.withdrawTotal) withS.innerText = "$" + data.withdrawTotal;
                
                checkPendingStatus(phone);
            }
        });
    }

    function checkPendingStatus(phone) {
        const depRef = ref(database, 'deposits/' + phone);
        onValue(depRef, (snapshot) => {
            let hasPending = false;
            snapshot.forEach((child) => {
                if (child.val().status === "Pending") hasPending = true;
            });
            const pAlert = document.getElementById('pendingAlert');
            if(pAlert) pAlert.style.display = hasPending ? 'flex' : 'none';
        });
    }

    window.claimDailyEarning = async function(type) {
        const phone = localStorage.getItem('userPhone');
        if(!phone) return;

        const userRef = ref(database, 'users/' + phone);
        const snapshot = await get(userRef);
        const data = snapshot.val();

        if (data && data.status !== "blocked") {
            let earning = type === 'free' ? 0.50 : 5.00;
            const newBalance = (data.balance || 0) + earning;
            await update(userRef, { balance: newBalance });
            alert("Success! $" + earning + " added.");
        } else {
            alert("Action failed!");
        }
    };

    function startTimer(duration, displayId) {
        let timer = duration, hours, minutes, seconds;
        const display = document.getElementById(displayId);
        if(!display) return; 

        setInterval(() => {
            hours = Math.floor(timer / 3600);
            minutes = Math.floor((timer % 3600) / 60);
            seconds = timer % 60;
            display.textContent = `${hours < 10 ? "0"+hours : hours}:${minutes < 10 ? "0"+minutes : minutes}:${seconds < 10 ? "0"+seconds : seconds}`;
            if (--timer < 0) timer = duration;
        }, 1000);
    }

    window.onload = function () {
        if(document.getElementById('freeTimer')) {
            startTimer(24 * 60 * 60, "freeTimer");
        }
    };
</script>
