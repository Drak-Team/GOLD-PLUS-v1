<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Real AI Miner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22); --card-bg: rgba(255, 255, 255, 0.08); --primary-gold: #f1c40f; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #080110; color: white; padding-bottom: 90px; overflow-x: hidden; }
        
        .top-header { padding: 25px 20px; background: rgba(241, 196, 15, 0.05); text-align: center; }
        .user-id { font-size: 11px; color: var(--primary-gold); letter-spacing: 1px; }
        .main-balance { font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(241,196,15,0.3); margin: 5px 0; }

        /* REAL MINER SECTION */
        .mining-area { margin: 15px; padding: 25px; background: rgba(255,255,255,0.03); border-radius: 35px; border: 1px solid rgba(241,196,15,0.2); position: relative; text-align: center; }
        
        /* High-Quality Real Robot Image */
        .robot-visual { width: 100%; height: 280px; margin: 0 auto; position: relative; border-radius: 25px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .robot-visual img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); }
        
        /* Pulsing 3D Gold Glow */
        .mining-pulse { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(241,196,15,0.2) 0%, transparent 70%); animation: pulseGlow 2s infinite; pointer-events: none; }
        @keyframes pulseGlow { 0% { opacity: 0.3; } 50% { opacity: 0.9; } 100% { opacity: 0.3; } }

        /* Status & Timer */
        .server-status { display: inline-block; padding: 4px 12px; background: rgba(0, 255, 100, 0.1); color: #00ff64; border-radius: 10px; font-size: 11px; border: 1px solid #00ff64; margin-bottom: 15px; }
        .status-txt { color: var(--primary-gold); font-weight: bold; letter-spacing: 1px; font-size: 14px; margin-bottom: 5px; }
        .timer-val { font-family: monospace; font-size: 18px; color: #00ff64; }

        /* Battery Progress */
        .battery-container { width: 85%; background: #000; height: 25px; border-radius: 12px; margin: 15px auto; border: 2px solid #333; position: relative; overflow: hidden; }
        .battery-fill { height: 100%; width: 0%; background: var(--gold-grad); box-shadow: 0 0 15px #f1c40f; transition: 1s linear; }
        .percent-text { position: absolute; width: 100%; top: 0; left: 0; font-size: 12px; font-weight: 900; line-height: 22px; color: #fff; z-index: 2; }

        .stat-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px; }
        .s-card { background: var(--card-bg); padding: 12px; border-radius: 18px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .s-card small { font-size: 9px; color: #888; display: block; }
        .s-card b { font-size: 15px; color: #fff; }

        /* BUTTON */
        .claim-btn { width: calc(100% - 40px); margin: 20px; padding: 18px; border-radius: 18px; border: none; font-weight: 800; font-size: 17px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-claim { background: var(--gold-grad); color: #000; box-shadow: 0 5px 15px rgba(241,196,15,0.4); }
        .btn-locked { background: #1a1a1a; color: #444; cursor: not-allowed; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0a0414; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(241, 196, 15, 0.2); z-index: 1000; }
        .nav-btn { color: #555; text-decoration: none; text-align: center; font-size: 10px; flex: 1; }
        .nav-btn.active { color: #f1c40f; }
        .nav-btn i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

<div class="top-header">
    <div class="user-id" id="userNameLabel">NODE ID: Syncing...</div>
    <div class="main-balance" id="mainBalance">$0.00</div>
    <div style="font-size: 12px; color: #aaa;">TOTAL ASSETS BALANCE</div>
</div>

<div class="mining-area">
    <div class="server-status">AI ACTIVE: <span id="activePlan">Checking...</span></div>
    
    <div class="robot-visual">
        <img src="https://img.freepik.com/free-photo/view-futuristic-robot-working-as-construction-worker_23-2150811559.jpg">
        <div class="mining-pulse"></div>
    </div>
    
    <div class="status-txt" style="margin-top: 15px;">GOLD MINING IN PROGRESS</div>
    
    <div class="battery-container">
        <div class="battery-fill" id="progressFill"></div>
        <div class="percent-text" id="percentTxt">0%</div>
    </div>
    
    <div class="timer-val" id="timerDisplay">00:00:00</div>
</div>

<div class="stat-bar">
    <div class="s-card"><small>TOTAL DEPOSIT</small><b id="sumDeposit">$0.00</b></div>
    <div class="s-card"><small>EARNED PROFITS</small><b id="sumEarned">$0.00</b></div>
</div>

<button id="claimBtn" class="claim-btn btn-locked" disabled>INITIALIZING SYSTEM</button>

<nav class="nav-bar">
    <a href="dashboard.html" class="nav-btn active"><i class="fas fa-microchip"></i>CORE</a>
    <a href="plans.html" class="nav-btn"><i class="fas fa-gem"></i>PLANS</a>
    <a href="mining.html" class="nav-btn"><i class="fas fa-coins"></i>EARN</a>
    <a href="refer.html" class="nav-btn"><i class="fas fa-users"></i>TEAM</a>
    <a href="profile.html" class="nav-btn"><i class="fas fa-user-cog"></i>MENU</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const username = localStorage.getItem('userPhone');

    let userData = null;

    window.onload = () => {
        if (!username) window.location.href = 'index.html';
        else syncData();
    };

    function syncData() {
        onValue(ref(db, 'users/' + username), (snap) => {
            userData = snap.val();
            if (userData) {
                document.getElementById('mainBalance').innerText = "$" + (userData.balance || 0).toFixed(2);
                document.getElementById('sumEarned').innerText = "$" + (userData.totalEarned || 0).toFixed(2);
                document.getElementById('sumDeposit').innerText = "$" + (userData.totalDeposit || 0).toFixed(2);
                document.getElementById('userNameLabel').innerText = "NODE ID: " + username;
                document.getElementById('activePlan').innerText = (userData.plan || "Free").toUpperCase();
                startMiningTimer();
            }
        });
    }

    function startMiningTimer() {
        const cooldown = 24 * 60 * 60 * 1000;
        
        const tick = () => {
            const last = userData.lastClaim || 0;
            const now = Date.now();
            const elapsed = now - last;
            const remain = cooldown - elapsed;

            if (remain <= 0) {
                // Done
                document.getElementById('progressFill').style.width = "100%";
                document.getElementById('percentTxt').innerText = "HARVEST READY";
                document.getElementById('timerDisplay').innerText = "00:00:00";
                document.getElementById('claimBtn').innerText = "CLAIM GOLD PROFITS";
                document.getElementById('claimBtn').className = "claim-btn btn-claim";
                document.getElementById('claimBtn').disabled = false;
            } else {
                // Pending
                const h = Math.floor(remain / 3600000);
                const m = Math.floor((remain % 3600000) / 60000);
                const s = Math.floor((remain % 60000) / 1000);
                
                document.getElementById('timerDisplay').innerText = 
                    `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                
                const prg = (elapsed / cooldown) * 100;
                document.getElementById('progressFill').style.width = prg + "%";
                document.getElementById('percentTxt').innerText = Math.floor(prg) + "%";
                
                document.getElementById('claimBtn').innerText = "MINING IN PROGRESS";
                document.getElementById('claimBtn').className = "claim-btn btn-locked";
                document.getElementById('claimBtn').disabled = true;
            }
        };

        setInterval(tick, 1000);
        tick();
    }

    document.getElementById('claimBtn').onclick = () => {
        const amount = userData.plan === "Free" ? 0.50 : (userData.dailyEarning || 5.00);
        
        runTransaction(ref(db, 'users/' + username), (curr) => {
            if (curr) {
                const now = Date.now();
                if (now - (curr.lastClaim || 0) >= 24 * 60 * 60 * 1000) {
                    curr.balance = (curr.balance || 0) + amount;
                    curr.totalEarned = (curr.totalEarned || 0) + amount;
                    curr.lastClaim = now;
                    return curr;
                }
            }
        }).then(result => {
            if (result.committed) alert("Success! $" + amount + " Claimed.");
        });
    };

</script>
</body>
</html>
