<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Live Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --gold-glow: rgba(241, 196, 15, 0.3); --bg: #0f051d; --card: #25163d; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 100px; }

        /* Top Bar */
        .top-bar { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #1a0b2e; }
        .logo { color: var(--gold); font-weight: bold; font-size: 20px; letter-spacing: 1px; }

        .container { padding: 15px; }

        /* 🚀 لائیو ارننگ کارڈ (Yellow Gold Theme) */
        .live-card { 
            background: linear-gradient(145deg, #2a1b3d, #1a0b2e); 
            border-radius: 30px; padding: 25px; text-align: center;
            border: 1px solid var(--gold-glow); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px; position: relative;
        }
        .live-label { color: var(--gold); font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .live-label i { animation: pulse 1.5s infinite; }
        
        .balance-main { font-size: 32px; font-weight: bold; color: var(--gold); margin: 15px 0; text-shadow: 0 0 15px var(--gold-glow); }
        .next-cycle { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 15px; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: #ccc; }
        .timer-val { color: var(--gold); font-family: monospace; font-weight: bold; font-size: 16px; }

        /* چمکتا ہوا گولڈ بٹن */
        .start-btn { 
            width: 100%; padding: 18px; margin-top: 20px;
            background: linear-gradient(90deg, #d4af37, #f1c40f, #d4af37);
            border: none; border-radius: 20px; font-weight: bold; color: #000;
            font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 5px 20px var(--gold-glow);
        }

        /* 🔗 ریفرل لنک سیکشن */
        .refer-box { 
            background: var(--card); padding: 15px; border-radius: 20px; 
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .refer-text { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 70%; }
        .refer-btns i { color: var(--gold); margin-left: 10px; cursor: pointer; font-size: 18px; }

        /* 🔳 کوئیک ایکشن بکس */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .action-item { 
            background: var(--card); padding: 20px 10px; border-radius: 25px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .action-item:active { transform: scale(0.95); }
        .action-item i { font-size: 24px; margin-bottom: 10px; display: block; }
        .action-item span { font-size: 12px; font-weight: bold; }
        .action-item p { font-size: 10px; color: #666; margin: 5px 0 0 0; }

        /* کلرز برائے ایکشنز */
        .col-gold { color: var(--gold); }
        .col-green { color: #00ff64; }
        .col-blue { color: #007bff; }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #1a0b2e; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-link { color: #555; text-decoration: none; font-size: 10px; text-align: center; }
        .nav-link.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">GOLD PLUS</div>
        <div style="background:var(--gold); color:#000; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">U</div>
    </div>

    <div class="container">
        
        <div class="live-card">
            <div class="live-label"><i class="fa-solid fa-microchip"></i> Live Earnings</div>
            <div class="balance-main">Rs. 0.00000000</div>
            
            <div class="next-cycle">
                <i class="fa-solid fa-bolt-lightning col-gold"></i>
                Next cycle: <span class="timer-val">23 : 59 : 59</span>
            </div>

            <button class="start-btn">
                <i class="fa-solid fa-play"></i> Start Mining Now <i class="fa-solid fa-sparkles"></i>
            </button>
        </div>

        <div class="refer-box">
            <div class="refer-text">https://goldplus.com/reg?ref=GP-8847</div>
            <div class="refer-btns">
                <i class="fa-solid fa-copy"></i>
                <i class="fa-solid fa-share-nodes"></i>
            </div>
        </div>

        <div class="action-grid">
            <div class="action-item">
                <i class="fa-solid fa-wallet col-blue"></i>
                <span>Deposit</span>
                <p>Add Funds</p>
            </div>
            <div class="action-item">
                <i class="fa-solid fa-layer-group col-gold"></i>
                <span>Invest</span>
                <p>Gold Plans</p>
            </div>
            <div class="action-item">
                <i class="fa-solid fa-money-bill-transfer col-green"></i>
                <span>Withdraw</span>
                <p>Cash Out</p>
            </div>
        </div>

    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-link active"><i class="fa-solid fa-house fa-xl"></i><br>HOME</a>
        <a href="plans.html" class="nav-link"><i class="fa-solid fa-wand-magic-sparkles fa-xl"></i><br>INVEST</a>
        <a href="refer.html" class="nav-link"><i class="fa-solid fa-paper-plane fa-xl"></i><br>INVITE</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-circle-user fa-xl"></i><br>PROFILE</a>
    </nav>

</body>
</html>
