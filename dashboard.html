<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Ultra Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #d4af37; --bg: #050505; --card: rgba(255, 255, 255, 0.05); --glow: 0 0 15px rgba(212, 175, 55, 0.3); }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 110px; overflow-x: hidden; }
        
        /* Premium Header */
        .header { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, #1a1a1a 0%, var(--bg) 100%); }
        .logo-text { font-size: 22px; font-weight: 800; color: var(--gold); letter-spacing: 2px; text-shadow: var(--glow); }
        .user-profile { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; background: #111; }

        /* Luxury Balance Card */
        .main-card { background: linear-gradient(135deg, #111 0%, #222 100%); margin: 15px; padding: 30px; border-radius: 30px; border: 1px solid rgba(212, 175, 55, 0.2); position: relative; overflow: hidden; box-shadow: var(--glow); }
        .main-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%); }
        .main-card p { font-size: 12px; color: #888; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        .main-card h1 { font-size: 36px; margin: 10px 0; font-weight: 800; color: #fff; }
        .main-card h1 span { font-size: 16px; color: var(--gold); }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; }
        .stat-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .stat-box i { font-size: 20px; color: var(--gold); margin-bottom: 10px; }
        .stat-box h3 { margin: 0; font-size: 18px; }
        .stat-box p { margin: 5px 0 0 0; font-size: 10px; color: #777; text-transform: uppercase; }

        /* Quick Action Icons */
        .action-row { display: flex; justify-content: space-around; padding: 25px 15px; }
        .action-btn { text-align: center; text-decoration: none; color: #fff; transition: 0.3s; }
        .action-btn i { width: 55px; height: 55px; background: var(--card); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .action-btn:active { transform: scale(0.9); }

        /* Live Mining Status */
        .mining-status { background: rgba(0, 255, 100, 0.05); margin: 15px; padding: 20px; border-radius: 20px; border-left: 4px solid #00ff64; display: flex; align-items: center; justify-content: space-between; }
        .pulse-dot { width: 10px; height: 10px; background: #00ff64; border-radius: 50%; box-shadow: 0 0 10px #00ff64; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(10, 10, 10, 0.95); display: flex; justify-content: space-around; padding: 15px 0; backdrop-filter: blur(15px); border-top: 1px solid #222; z-index: 1000; }
        .nav-item { color: #555; text-decoration: none; text-align: center; font-size: 10px; font-weight: bold; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; display: block; }
        .nav-item.active { color: var(--gold); text-shadow: var(--glow); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-text">GOLD PLUS</div>
        <div class="user-profile"><i class="fa-solid fa-user" style="color:var(--gold)"></i></div>
    </div>

    <div class="main-card">
        <p>Current Assets</p>
        <h1 id="totalBalance">Rs. 0.00</h1>
        <div style="display: flex; gap: 20px; margin-top: 15px;">
            <div><p>Daily ROI</p><span style="color:#00ff64; font-weight:bold;">+12.5%</span></div>
            <div><p>Active Plans</p><span style="color:var(--gold); font-weight:bold;">V1 Machine</span></div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <i class="fa-solid fa-chart-line"></i>
            <h3 id="todayEarn">Rs. 0</h3>
            <p>Today Earning</p>
        </div>
        <div class="stat-box">
            <i class="fa-solid fa-hand-holding-dollar"></i>
            <h3 id="totalWith">Rs. 0</h3>
            <p>Total Withdraw</p>
        </div>
        <div class="stat-box">
            <i class="fa-solid fa-piggy-bank"></i>
            <h3 id="totalDep">Rs. 0</h3>
            <p>Total Deposit</p>
        </div>
        <div class="stat-box">
            <i class="fa-solid fa-users"></i>
            <h3 id="teamSize">0</h3>
            <p>My Team</p>
        </div>
    </div>

    <div class="action-row">
        <a href="recharge.html" class="action-btn">
            <i class="fa-solid fa-plus-circle" style="color: #00d2ff;"></i>
            <span>Deposit</span>
        </a>
        <a href="withdraw.html" class="action-btn">
            <i class="fa-solid fa-money-bill-transfer" style="color: #ffc107;"></i>
            <span>Withdraw</span>
        </a>
        <a href="plans.html" class="action-btn">
            <i class="fa-solid fa-gem" style="color: #e91e63;"></i>
            <span>Plans</span>
        </a>
        <a href="https://wa.me/YOUR_NUMBER" class="action-btn">
            <i class="fa-brands fa-whatsapp" style="color: #25d366;"></i>
            <span>Support</span>
        </a>
    </div>

    <div class="mining-status">
        <div>
            <h4 style="margin:0; font-size:14px;">Cloud Mining Engine</h4>
            <p style="margin:5px 0 0 0; font-size:11px; color:#888;">System status: Operational</p>
        </div>
        <div class="pulse-dot"></div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active"><i class="fa-solid fa-house-chimney"></i>HOME</a>
        <a href="plans.html" class="nav-item"><i class="fa-solid fa-microchip"></i>MINING</a>
        <a href="refer.html" class="nav-item"><i class="fa-solid fa-share-nodes"></i>INVITE</a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-circle-user"></i>ME</a>
    </nav>

</body>
</html>
