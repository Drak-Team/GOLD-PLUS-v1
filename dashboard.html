<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mining Dashboard</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#0b0618;
    color:#fff;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#f7a21b,#ff7b00);
    padding:20px;
    border-bottom-left-radius:25px;
    border-bottom-right-radius:25px;
}
.header h2{
    margin:0;
}
.flex{
    display:flex;
    justify-content:space-between;
}

/* CARDS */
.card{
    background:#1a1230;
    margin:10px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(255,165,0,0.2);
}

/* BOT SECTION */
.bot{
    text-align:center;
    position:relative;
}
.bot img{
    width:140px;
    animation: float 3s ease-in-out infinite;
}
@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

/* GLOW COINS */
.coin{
    position:absolute;
    width:10px;
    height:10px;
    background:gold;
    border-radius:50%;
    animation: fall 2s linear infinite;
}
@keyframes fall{
    0%{top:0;opacity:1;}
    100%{top:100px;opacity:0;}
}

/* STATS */
.stats{
    display:flex;
    justify-content:space-between;
}
.stat{
    flex:1;
    text-align:center;
}

/* BUTTON */
.btn{
    background:linear-gradient(135deg,#f7a21b,#ff7b00);
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    margin:15px;
}

/* SUMMARY */
.summary{
    display:flex;
}
.summary .card{
    flex:1;
}

.small{
    font-size:12px;
    color:#aaa;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="flex">
        <h3>👑 VIP: 03037264598</h3>
        <h3>Status: Volt Robot</h3>
    </div>
    <h2>$0.10</h2>
    <p>Available Assets</p>
</div>

<!-- BOT SECTION -->
<div class="card bot">
    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

    <!-- animated coins -->
    <div class="coin" style="left:30%"></div>
    <div class="coin" style="left:50%"></div>
    <div class="coin" style="left:70%"></div>

    <h2>2 Active Packages</h2>
    <p class="small">Total Hash Power: 200 GH/s</p>
</div>

<!-- EARNING SUMMARY -->
<div class="summary">
    <div class="card">
        <h3>$0.50</h3>
        <p class="small">Today's Earning</p>
    </div>
    <div class="card">
        <h3>$2.30</h3>
        <p class="small">Total Earning</p>
    </div>
</div>

<!-- ACTION BUTTON -->
<div class="btn">
    CLAIM DAILY MINING
</div>

<!-- FEATURES -->
<div class="stats">
    <div class="card stat">
        ⚙️
        <p>Active</p>
    </div>
    <div class="card stat">
        ⚡
        <p>Mining</p>
    </div>
    <div class="card stat">
        🌐
        <p>Online</p>
    </div>
    <div class="card stat">
        🔗
        <p>Linked</p>
    </div>
</div>

<!-- TEAM + TASK -->
<div class="summary">
    <div class="card">
        <h3>0</h3>
        <p class="small">Team Members</p>
    </div>
    <div class="card">
        <h3>Earn</h3>
        <p class="small">Daily Task</p>
    </div>
</div>

<!-- WITHDRAW + DEPOSIT -->
<div class="summary">
    <div class="card">
        <h3>$0.10</h3>
        <p class="small">Withdraw</p>
    </div>
    <div class="card">
        <h3>Add</h3>
        <p class="small">Deposit</p>
    </div>
</div>

</body>
</html>
