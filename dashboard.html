<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // 1. Gmail Auth اور لاگ ان چیک
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // یوزر لاگ ان ہے، اب لوکل اسٹوریج سے فون نمبر اٹھائیں
            const userPhone = localStorage.getItem('userPhone');
            if (userPhone) {
                listenToUserData(userPhone);
            } else {
                // اگر فون نمبر نہیں ہے تو واپس لاگ ان پر بھیجیں
                window.location.href = 'index.html';
            }
        } else {
            // اگر فائر بیس سیشن آؤٹ ہے تو بھی واپس بھیجیں
            window.location.href = 'index.html';
        }
    });

    // 2. ڈیٹا بیس سے لائیو معلومات اٹھانا
    function listenToUserData(phone) {
        const userRef = ref(database, 'users/' + phone);
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // پریمیم ڈیش بورڈ کی ویلیوز اپ ڈیٹ کریں
                document.getElementById('mainBalance').innerText = "$" + (data.balance || 0).toFixed(2);
                document.getElementById('userNameLabel').innerText = "Welcome, " + (data.name || "User") + "!";
                document.getElementById('teamCount').innerText = "+" + (data.referCount || 0) + " Members";
                
                // مائننگ اور ودڈرا اسٹیٹس (اگر ڈیٹا بیس میں موجود ہوں)
                if(data.withdrawTotal) document.getElementById('withdrawStat').innerText = "$" + data.withdrawTotal;
                
                // پینڈنگ ڈپازٹ الرٹ لائیو چیک کریں
                checkPendingStatus(phone);
            }
        });
    }

    // پینڈنگ الرٹ کو لائیو کنٹرول کرنا
    function checkPendingStatus(phone) {
        const depRef = ref(database, 'deposits/' + phone);
        onValue(depRef, (snapshot) => {
            let hasPending = false;
            snapshot.forEach((child) => {
                if (child.val().status === "Pending") hasPending = true;
            });
            document.getElementById('pendingAlert').style.display = hasPending ? 'flex' : 'none';
        });
    }

    // ارننگ کلیم کرنے کا فنکشن
    window.claimDailyEarning = async function(type) {
        const phone = localStorage.getItem('userPhone');
        if(!phone) return;

        const userRef = ref(database, 'users/' + phone);
        const snapshot = await get(userRef);
        const data = snapshot.val();

        if (data && data.status !== "blocked") {
            // یہاں آپ اپنی مرضی کی ارننگ سیٹ کر سکتے ہیں
            let earning = type === 'free' ? 0.50 : 5.00;
            const newBalance = (data.balance || 0) + earning;
            
            await update(userRef, { balance: newBalance });
            alert("Success! $" + earning + " added to your assets.");
        } else {
            alert("Action failed. Account status: " + (data ? data.status : "Unknown"));
        }
    };

    // ٹائمر چلانے کا سسٹم
    function startTimer(duration, displayId) {
        let timer = duration, hours, minutes, seconds;
        setInterval(() => {
            hours = Math.floor(timer / 3600);
            minutes = Math.floor((timer % 3600) / 60);
            seconds = timer % 60;
            document.getElementById(displayId).textContent = 
                `${hours < 10 ? "0"+hours : hours}:${minutes < 10 ? "0"+minutes : minutes}:${seconds < 10 ? "0"+seconds : seconds}`;
            if (--timer < 0) timer = duration;
        }, 1000);
    }

    window.onload = function () {
        startTimer(24 * 60 * 60, "freeTimer");
    };
</script>
