<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --orange-grad: linear-gradient(90deg, #ff8c00, #ff4e00); --dark-bg: #0f051d; --card-bg: #1a0b2e; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 100px; }

        /* 📸 ٹاپ بینر (آف لائن تصویر) */
        .banner { width: 100%; height: 200px; position: relative; }
        .banner img { width: 100%; height: 100%; object-fit: cover; border-radius: 0 0 30px 30px; }
        
        .container { padding: 0 15px; margin-top: -40px; position: relative; z-index: 5; }

        /* 💰 مین بیلنس کارڈ */
        .balance-card { 
            background: var(--orange-grad); border-radius: 25px; padding: 25px; 
            box-shadow: 0 15px 30px rgba(255, 78, 0, 0.3); margin-bottom: 20px;
        }
        .bal-header { font-size: 13px; opacity: 0.9; margin-bottom: 5px; }
        .bal-val { font-size: 32px; font-weight: 800; }
        .bal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .b-btn { background: rgba(255,255,255,0.2); border: none; padding: 12px; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        /* ⛏️ مائننگ سیکشن (الگ کارڈ) */
        .section-card { background: var(--card-bg); border-radius: 25px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 20px; }
        .section-title { font-size: 15px; font-weight: bold; color: var(--gold); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        .mining-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .m-box { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }
        .m-box span { font-size: 10px; color: #888; display: block; }
        .m-box b { color: var(--gold); font-size: 14px; }

        .claim-area { text-align: center; }
        #timer { color: #00ff64; font-family: monospace; font-size: 18px; font-weight: bold; }
        #claimBtn { display: none; width: 100%; padding: 15px; background: #00ff64; border: none; border-radius: 15px; color: #000; font-weight: bold; cursor: pointer; }

        /* 🔳 کوئیک مینیو گرڈ (ٹیم، ہسٹری، لاگ آؤٹ وغیرہ) */
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .menu-item { text-align: center; text-decoration: none; color: #fff; }
        .menu-item i { 
            width: 50px; height: 50px; background: var(--card-bg); border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; font-size: 20px; 
            margin: 0 auto 8px; border: 1px solid rgba(255,255,255,0.05);
        }
        .menu-item span { font-size: 10px; color: #aaa; font-weight: 500; }

        /* 🔗 ریفرل کارڈ */
        .refer-card { background: linear-gradient(135deg, #1a0b2e, #25163d); padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px dashed var(--gold); }
    </style>
</head>
<body>

    <div class="banner">
        <img src="event.jpg" onerror="this.src='https://via.placeholder.com/800x400?text=Place+Your+Event+Photo+Here'" alt="Event Photo">
    </div>

    <div class="container">
        
        <div class="balance-card">
            <div class="bal-header">Current Balance</div>
            <div class="bal-val">Rs. 5,603.00</div>
            <div class="bal-btns">
                <button class="b-btn" onclick="location.href='deposit.html'"><i class="fa-solid fa-plus-circle"></i> Deposit</button>
                <button class="b-btn" onclick="location.href='withdraw.html'"><i class="fa-solid fa-money-bill-transfer"></i> Withdraw</button>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title"><i class="fa-solid fa-microchip"></i> Mining Machine <span style="font-size:10px; color:#00ff64; margin-left:auto;">● Active</span></div>
            <div class="mining-grid">
                <div class="m-box"><span>Active Plans</span><b>02</b></div>
                <div class="m-box"><span>Daily Earnings</span><b>Rs. 140.00</b></div>
            </div>
            <div class="claim-area">
                <div id="timer">Next Claim: 00:00:10</div>
                <button id="claimBtn" onclick="doClaim()">CLAIM NOW <i class="fa-solid fa-gift"></i></button>
            </div>
        </div>

        <div class="menu-grid">
            <a href="team.html" class="menu-item"><i class="fa-solid fa-users" style="color: #3498db;"></i><span>My Team</span></a>
            <a href="deposits.html" class="menu-item"><i class="fa-solid fa-file-invoice-dollar" style="color: #f1c40f;"></i><span>History</span></a>
            <a href="rewards.html" class="menu-item"><i class="fa-solid fa-medal" style="color: #e67e22;"></i><span>Rewards</span></a>
            <a href="support.html" class="menu-item"><i class="fa-solid fa-headset" style="color: #2ecc71;"></i><span>Support</span></a>
            <a href="transactions.html" class="menu-item"><i class="fa-solid fa-list-check" style="color: #9b59b6;"></i><span>Logs</span></a>
            <a href="profile.html" class="menu-item"><i class="fa-solid fa-user-gear" style="color: #ecf0f1;"></i><span>Profile</span></a>
            <a href="share.html" class="menu-item"><i class="fa-solid fa-bullhorn" style="color: #e74c3c;"></i><span>Invite</span></a>
            <a href="logout.php" class="menu-item"><i class="fa-solid fa-power-off" style="color: #ff4e00;"></i><span>Logout</span></a>
        </div>

        <div class="refer-card">
            <div style="font-size: 11px; color: #888;">GP-Ref: 8847...</div>
            <button onclick="copyRef()" style="background:var(--gold); border:none; padding:5px 15px; border-radius:8px; font-weight:bold; font-size:12px;">COPY LINK</button>
        </div>

    </div>

    <script>
        // 🕒 مائننگ ٹائمر اور کلیم لاجک
        let time = 10;
        const timerText = document.getElementById('timer');
        const claimBtn = document.getElementById('claimBtn');

        const x = setInterval(() => {
            time--;
            timerText.innerText = "Next Claim: 00:00:" + (time < 10 ? "0" + time : time);
            if(time <= 0) {
                clearInterval(x);
                timerText.style.display = 'none';
                claimBtn.style.display = 'block';
            }
        }, 1000);

        function doClaim() {
            alert("Rs. 140.00 Added!");
            location.reload();
        }

        function copyRef() {
            alert("Referral link copied!");
        }
    </script>

</body>
</html>
