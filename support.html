<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Gold Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-gold: #f1c40f; --bg-dark: #0f051d; --glass-border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1a0b2e, #0f051d); color: white; height: 100vh; display: flex; flex-direction: column; }
        
        .header { padding: 20px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--glass-border); }
        .header i { color: var(--primary-gold); font-size: 20px; cursor: pointer; }
        .header h2 { margin: 0; font-size: 18px; color: var(--primary-gold); }

        .container { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        
        .chat-box { flex: 1; background: rgba(255,255,255,0.03); border-radius: 20px; padding: 15px; overflow-y: auto; border: 1px solid var(--glass-border); margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Message Bubbles */
        .msg { padding: 12px 16px; border-radius: 15px; max-width: 85%; font-size: 14px; line-height: 1.4; position: relative; }
        .msg.user { background: var(--primary-gold); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 500; }
        .msg.admin { background: rgba(255,255,255,0.1); color: #fff; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--glass-border); }
        
        .msg-time { font-size: 9px; opacity: 0.6; display: block; margin-top: 5px; text-align: right; }

        .input-area { display: flex; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 20px; border: 1px solid var(--glass-border); }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; padding: 5px 10px; font-size: 14px; }
        
        .send-btn { width: 45px; height: 45px; background: var(--primary-gold); border: none; border-radius: 15px; cursor: pointer; color: #000; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; }
        .send-btn:active { transform: scale(0.9); }

        .limit-info { text-align: center; font-size: 11px; color: #888; margin-top: 10px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="header">
    <i class="fas fa-arrow-left" onclick="location.href='dashboard.html'"></i>
    <h2>Live Support</h2>
</div>

<div class="container">
    <div class="chat-box" id="chatBox">
        <div class="msg admin">Hello! How can we help you today?<span class="msg-time">System</span></div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Describe your issue...">
        <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
    <p class="limit-info" id="limitText">Daily messages remaining: 3</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const limitText = document.getElementById('limitText');

    auth.onAuthStateChanged(user => {
        if (user) {
            const chatRef = ref(db, 'support/' + user.uid + '/messages');
            onValue(chatRef, (snapshot) => {
                chatBox.innerHTML = '<div class="msg admin">Hello! How can we help you today?<span class="msg-time">System</span></div>';
                let msgCount = 0;
                const today = new Date().toLocaleDateString();

                snapshot.forEach(child => {
                    const data = child.val();
                    const div = document.createElement('div');
                    div.className = 'msg ' + (data.sender === 'user' ? 'user' : 'admin');
                    div.innerHTML = `${data.text}<span class="msg-time">${data.sender === 'user' ? 'You' : 'Admin'}</span>`;
                    chatBox.appendChild(div);
                    
                    if(data.sender === 'user' && data.date === today) msgCount++;
                });
                
                limitText.innerText = "Daily messages remaining: " + (3 - msgCount);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        } else {
            location.href = 'login.html';
        }
    });

    sendBtn.onclick = async () => {
        const user = auth.currentUser;
        const text = msgInput.value.trim();
        const today = new Date().toLocaleDateString();

        if (!text) return;

        const chatRef = ref(db, 'support/' + user.uid + '/messages');
        const snapshot = await get(chatRef);
        let msgCount = 0;
        
        snapshot.forEach(child => { 
            if(child.val().sender === 'user' && child.val().date === today) msgCount++; 
        });

        if (msgCount >= 3) {
            alert("Daily support limit reached! Please wait until tomorrow.");
            return;
        }

        const newMsgRef = push(chatRef);
        await set(newMsgRef, { 
            sender: 'user', 
            text: text, 
            date: today,
            timestamp: Date.now()
        });
        
        msgInput.value = '';
    };

    // Allow "Enter" key to send
    msgInput.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            sendBtn.click();
        }
    });
</script>

</body>
</html>
