<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Gold Plus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-gold: #f1c40f; --bg-dark: #0f051d; --glass-border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at top, #1a0b2e, #0f051d); color: white; }
        .header { padding: 20px; display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.2); }
        .header i { color: var(--primary-gold); font-size: 22px; cursor: pointer; }
        .container { padding: 20px; }
        .chat-box { height: 350px; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; overflow-y: auto; border: 1px solid var(--glass-border); margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .msg.user { background: var(--primary-gold); color: #000; align-self: flex-end; }
        .msg.admin { background: rgba(255,255,255,0.1); color: #fff; align-self: flex-start; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 15px; color: white; outline: none; }
        .send-btn { padding: 15px; background: var(--primary-gold); border: none; border-radius: 15px; cursor: pointer; color: #000; }
        .limit-info { text-align: center; font-size: 11px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
<div class="header"><i class="fas fa-arrow-left" onclick="history.back()"></i><h2>Support Center</h2></div>
<div class="container">
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Type your message...">
        <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
    <p class="limit-info" id="limitText">Messages remaining today: 3</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { /* Your Config Here */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    auth.onAuthStateChanged(user => {
        if (user) {
            const chatRef = ref(db, 'support/' + user.uid + '/messages');
            onValue(chatRef, (snapshot) => {
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = '';
                let msgCount = 0;
                const today = new Date().toDateString();

                snapshot.forEach(child => {
                    const data = child.val();
                    const div = document.createElement('div');
                    div.className = 'msg ' + (data.sender === 'user' ? 'user' : 'admin');
                    div.innerText = data.text;
                    chatBox.appendChild(div);
                    if(data.sender === 'user' && data.date === today) msgCount++;
                });
                document.getElementById('limitText').innerText = "Messages remaining today: " + (3 - msgCount);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    });

    document.getElementById('sendBtn').onclick = async () => {
        const user = auth.currentUser;
        const text = document.getElementById('msgInput').value;
        const today = new Date().toDateString();

        if (!text) return;

        const chatRef = ref(db, 'support/' + user.uid + '/messages');
        const snapshot = await get(chatRef);
        let msgCount = 0;
        snapshot.forEach(child => { if(child.val().sender === 'user' && child.val().date === today) msgCount++; });

        if (msgCount >= 3) {
            alert("Daily limit reached! Please wait 24 hours.");
            return;
        }

        const userRef = ref(db, 'users/' + user.uid);
        const userSnap = await get(userRef);
        const userData = userSnap.val();

        const newMsgRef = push(chatRef);
        await set(newMsgRef, { sender: 'user', text: text, date: today, userName: userData.name, userID: user.uid });
        document.getElementById('msgInput').value = '';
    };
</script>
</body>
</html>
