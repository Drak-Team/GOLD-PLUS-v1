<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Ultra Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --bg: #0f051d; --card: #1a0b2e; --glass: rgba(255,255,255,0.05); }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; padding-bottom: 50px; }
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:10000; display:flex; align-items:center; justify-content:center; flex-direction:column; }
        .login-box { background:var(--card); padding:35px; border-radius:25px; border:2px solid var(--gold); text-align:center; }
        input { padding:12px; border-radius:10px; border:1px solid #444; background:#000; color:#fff; width: 100%; box-sizing: border-box; }
        header { border-bottom: 2px solid var(--gold); padding-bottom: 20px; text-align: center; margin-bottom: 20px; }
        .search-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--gold); margin-bottom: 25px; }
        .user-detail-card { background: var(--glass); padding: 15px; border-radius: 12px; margin-top: 15px; display: none; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
        .admin-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 18px; margin-bottom: 15px; }
        .copy-btn { background: var(--gold); color: #000; padding: 5px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; border: none; font-weight: bold; }
        button { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .approve-btn { background: var(--gold); color: #000; width: 100%; }
        .reject-btn { background: #ff3232; color: #fff; width: 100%; }
        .save-btn { background: #2ecc71; color: #fff; padding: 5px 15px; font-size: 11px; border-radius: 5px; }
        h3 { color: var(--gold); font-size: 14px; text-transform: uppercase; margin-top: 30px; border-left: 4px solid var(--gold); padding-left: 10px; }
        .proof-img { width: 100%; max-width: 250px; border-radius: 10px; margin: 10px 0; border: 1px solid var(--gold); cursor: pointer; display: block; }
        .edit-input { background: #000; border: 1px solid var(--gold); color: #fff; padding: 5px; border-radius: 5px; width: 130px; font-size: 13px; }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="login-box">
        <h2 style="color:var(--gold)">ADMIN ACCESS</h2>
        <input type="password" id="adminPass" placeholder="Enter PIN"><br><br>
        <button class="approve-btn" onclick="checkPass()">LOGIN</button>
    </div>
</div>

<header><h1>GOLD PLUS <span style="color:var(--gold)">PRO</span></h1></header>

<div class="search-box">
    <h3><i class="fas fa-search"></i> Search by Member Gmail</h3>
    <div style="display:flex; gap:10px;">
        <input type="text" id="userSearchEmail" placeholder="Enter Gmail Address">
        <button class="approve-btn" style="width: auto;" onclick="searchUser()">Search</button>
    </div>
    <div id="userDetail" class="user-detail-card">
        <div class="detail-row"><span>User ID:</span> <b id="foundUID" style="color:var(--gold)">-</b></div>
        <div class="detail-row"><span>Name:</span> <b id="resName">-</b></div>
        <div class="detail-row">
            <span>Password:</span> 
            <div style="display:flex; gap:5px;">
                <input type="text" id="resPass" class="edit-input">
                <button class="save-btn" onclick="updatePassword()">SAVE</button>
            </div>
        </div>
        <div class="detail-row">
            <span>Balance (PKR):</span> 
            <div style="display:flex; gap:5px;">
                <input type="number" id="resBalInput" class="edit-input">
                <button class="save-btn" onclick="directUpdate('balance', 'resBalInput')">SAVE</button>
            </div>
        </div>
        <div class="detail-row">
            <span>Total Deposit:</span> 
            <div style="display:flex; gap:5px;">
                <input type="number" id="resTotalDep" class="edit-input">
                <button class="save-btn" onclick="directUpdate('totalDeposit', 'resTotalDep')">SAVE</button>
            </div>
        </div>
        <div class="detail-row">
            <span>Total Earning:</span> 
            <div style="display:flex; gap:5px;">
                <input type="number" id="resTotalEarn" class="edit-input">
                <button class="save-btn" onclick="directUpdate('totalEarning', 'resTotalEarn')">SAVE</button>
            </div>
        </div>
        <div class="detail-row"><span>Plan:</span> <b id="resPlan">None</b></div>
    </div>
</div>

<h3><i class="fas fa-wallet"></i> Pending Deposits</h3>
<div id="depositContainer"></div>

<h3><i class="fas fa-money-bill-wave"></i> Pending Withdrawals</h3>
<div id="withdrawContainer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.checkPass = () => {
        if(document.getElementById('adminPass').value === "231426") document.getElementById('authOverlay').style.display = 'none';
        else alert("Wrong PIN!");
    };

    window.searchUser = async () => {
        const email = document.getElementById('userSearchEmail').value.trim().toLowerCase();
        const snap = await get(ref(db, 'users'));
        if(snap.exists()){
            const users = snap.val();
            let found = false;
            for(let uid in users){
                if(users[uid].email && users[uid].email.toLowerCase() === email){
                    document.getElementById('userDetail').style.display = 'block';
                    document.getElementById('foundUID').innerText = uid;
                    document.getElementById('resName').innerText = users[uid].name || "N/A";
                    document.getElementById('resPass').value = users[uid].password || "";
                    document.getElementById('resBalInput').value = users[uid].balance || 0;
                    document.getElementById('resTotalDep').value = users[uid].totalDeposit || 0;
                    document.getElementById('resTotalEarn').value = users[uid].totalEarning || 0;
                    document.getElementById('resPlan').innerText = users[uid].plan || "No Plan";
                    found = true; break;
                }
            }
            if(!found) alert("No user found with this Gmail!");
        }
    };

    window.directUpdate = (field, inputId) => {
        const uid = document.getElementById('foundUID').innerText;
        const newVal = parseFloat(document.getElementById(inputId).value);
        if(uid !== "-" && !isNaN(newVal)) {
            let obj = {}; obj[field] = newVal;
            update(ref(db, 'users/' + uid), obj).then(() => alert(field + " Updated!"));
        }
    };

    window.updatePassword = () => {
        const uid = document.getElementById('foundUID').innerText;
        const newPass = document.getElementById('resPass').value;
        if(uid !== "-" && newPass) {
            update(ref(db, 'users/' + uid), { password: newPass }).then(() => alert("Password Updated!"));
        }
    };

    // --- Deposits with Reject Option ---
    onValue(ref(db, 'deposits'), (snapshot) => {
        const container = document.getElementById('depositContainer');
        container.innerHTML = '';
        snapshot.forEach((childSnap) => {
            const data = childSnap.val();
            if(data.status === "Pending") {
                container.innerHTML += `<div class="admin-card">
                    <b>Amount: $${data.amount}</b><br><small>User: ${data.phone}</small>
                    <img src="${data.screenshot}" class="proof-img" onclick="window.open(this.src)">
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="approve-btn" style="flex:2;" onclick="handleDeposit('${data.phone}', '${childSnap.key}', '${data.amount}')">Approve</button>
                        <button class="reject-btn" style="flex:1;" onclick="updateStatus('deposits', '${childSnap.key}', 'Rejected')">Reject</button>
                    </div>
                </div>`;
            }
        });
    });

    window.handleDeposit = (userID, rid, amount) => {
        const pkrAmount = parseFloat(amount) * 300; 
        // Update Balance
        runTransaction(ref(db, `users/${userID}/balance`), (current) => {
            return (parseFloat(current) || 0) + pkrAmount;
        }).then(() => {
            // Also Update Total Deposit automatically
            runTransaction(ref(db, `users/${userID}/totalDeposit`), (currentDep) => {
                return (parseFloat(currentDep) || 0) + pkrAmount;
            });
            update(ref(db, `deposits/${rid}`), { status: 'Approved' });
            alert("Added Rs. " + pkrAmount);
        });
    };

    onValue(ref(db, 'withdrawals'), (snapshot) => {
        const container = document.getElementById('withdrawContainer');
        container.innerHTML = '';
        snapshot.forEach((childSnap) => {
            const data = childSnap.val();
            if(data.status === "Pending") {
                container.innerHTML += `
                    <div class="admin-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <b style="color:var(--gold); font-size:16px;">Rs. ${data.amountPKR}</b>
                            <span style="background:rgba(255,255,255,0.1); padding:4px 8px; border-radius:5px; font-size:11px;">${data.method}</span>
                        </div>
                        <div style="margin:12px 0; background:#000; padding:12px; border-radius:12px; border:1px solid rgba(241,196,15,0.2);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                                <span style="font-size:12px; color:#aaa;">Account No:</span>
                                <button class="copy-btn" onclick="copyNumber('${data.accountNumber}')">COPY</button>
                            </div>
                            <b style="font-size:15px; letter-spacing:1px;">${data.accountNumber}</b>
                            <div style="margin-top:8px; font-size:13px; color:var(--gold);">
                                <i class="fas fa-user"></i> Holder: ${data.accountName || 'No Name'}
                            </div>
                        </div>
                        <small>Requested by: ${data.phone}</small>
                        <div class="btn-group" style="margin-top:10px; display:flex; gap:10px;">
                            <button class="approve-btn" onclick="updateStatus('withdrawals', '${childSnap.key}', 'Approved')">Mark as Paid</button>
                            <button class="reject-btn" style="width:40%; padding:10px;" onclick="updateStatus('withdrawals', '${childSnap.key}', 'Rejected')">Reject</button>
                        </div>
                    </div>`;
            }
        });
    });

    window.copyNumber = (num) => {
        navigator.clipboard.writeText(num);
        alert("Number Copied: " + num);
    };

    window.updateStatus = (path, rid, status) => {
        update(ref(db, `${path}/${rid}`), { status: status }).then(() => alert("Status updated"));
    };
</script>
</body>
</html>
