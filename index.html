<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --dark: #050505; }
        body { margin: 0; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle at top, #1a0b2e, #050505); overflow: hidden; }
        .login-box { background: rgba(255, 255, 255, 0.04); padding: 45px 35px; border-radius: 35px; width: 320px; text-align: center; border: 1px solid rgba(241, 196, 15, 0.2); backdrop-filter: blur(20px); box-shadow: 0 25px 60px rgba(0,0,0,0.8); }
        .logo-container { width: 80px; height: 80px; border: 2px solid var(--gold); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(241, 196, 15, 0.4); }
        .input-group { margin-bottom: 15px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--gold); }
        input { width: 100%; padding: 14px 14px 14px 45px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 15px; background: linear-gradient(90deg, #f1c40f, #e67e22); border: none; color: #000; font-weight: bold; border-radius: 12px; cursor: pointer; text-transform: uppercase; }
        .footer-text { margin-top: 25px; font-size: 13px; color: #aaa; }
        .footer-text a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-container"><i class="fas fa-gem" style="font-size: 40px; color: var(--gold);"></i></div>
        <h2 style="color: white; font-weight: 300;">Welcome to <b>GOLD PLUS</b></h2>
        
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="emailInput" placeholder="Enter Registered Gmail">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="passInput" placeholder="Password">
        </div>
        
        <button id="loginBtn">ACCESS ACCOUNT</button>
        
        <div class="footer-text">
            Don't have an account? <a href="signup.html">CREATE ONE</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
            authDomain: "gold-plus-v1.firebaseapp.com",
            databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
            projectId: "gold-plus-v1",
            storageBucket: "gold-plus-v1.firebasestorage.app",
            appId: "1:474592887487:web:e9261d51df5af58a367c0a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        document.getElementById('loginBtn').onclick = async () => {
            const inputEmail = document.getElementById('emailInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value.trim();
            const btn = document.getElementById('loginBtn');

            if(!inputEmail || !pass) return alert("Please fill all fields!");
            
            btn.innerText = "Verifying...";
            btn.disabled = true;

            try {
                // ڈیٹا بیس میں یوزرز کی لسٹ چیک کرنا
                const usersRef = ref(db, 'users');
                const snapshot = await get(usersRef);

                if (snapshot.exists()) {
                    const allUsers = snapshot.val();
                    let foundUser = null;
                    let foundId = "";

                    // ای میل کے ذریعے یوزر کو ڈھونڈنا
                    for (let id in allUsers) {
                        if (allUsers[id].email && allUsers[id].email.toLowerCase() === inputEmail) {
                            foundUser = allUsers[id];
                            foundId = id;
                            break;
                        }
                    }

                    if (foundUser) {
                        if (foundUser.password && foundUser.password.toString() === pass.toString()) {
                            localStorage.setItem('userPhone', foundId); // ڈیٹا بیس والی اصل ID سیو کرنا
                            localStorage.setItem('isLoggedIn', 'true');
                            window.location.href = "dashboard.html";
                        } else {
                            alert("Invalid Password!");
                        }
                    } else {
                        alert("Account not found with this Gmail!");
                    }
                } else {
                    alert("System Error: No users in Database.");
                }
            } catch (e) { 
                alert("Error: " + e.message); 
            } finally {
                btn.innerText = "ACCESS ACCOUNT";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
