// ... (باقی اسٹائل وہی رہے گا)

<div class="input-group">
    <input type="text" id="username" placeholder="Enter Username (Unique ID)">
</div>
<div class="input-group">
    <input type="password" id="pass" placeholder="Enter Password">
</div>

<button id="loginBtn">ACCESS ACCOUNT</button>

// ... (فائر بیس کنفگریشن وہی رہے گی)

<script type="module">
    // ... (امپورٹ والے حصے وہی رہیں گے)

    document.getElementById('loginBtn').onclick = async () => {
        const username = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('pass').value;
        const btn = document.getElementById('loginBtn');

        if(!username || !pass) return alert("Please enter both Username and Password!");
        
        btn.innerText = "Verifying Account...";
        btn.disabled = true;

        try {
            // اب ہم فون کے بجائے 'username' کے فولڈر میں چیک کریں گے
            const userRef = ref(db, 'users/' + username);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                const userData = snapshot.val();
                if (userData.password === pass) {
                    // کامیابی! اب ہم لوکل اسٹوریج میں 'userPhone' کی جگہ یوزر نیم ہی رکھیں گے
                    localStorage.clear();
                    localStorage.setItem('userPhone', username); // یہ کی (Key) ہم نے ہر جگہ استعمال کی ہے
                    localStorage.setItem('isLoggedIn', 'true');
                    window.location.href = "dashboard.html";
                } else {
                    alert("Wrong Password! Please try again.");
                    btn.innerText = "ACCESS ACCOUNT";
                    btn.disabled = false;
                }
            } else {
                alert("Account not found! Make sure you entered the correct Username.");
                btn.innerText = "ACCESS ACCOUNT";
                btn.disabled = false;
            }
        } catch (e) { 
            alert("Connection error: " + e.message); 
            btn.innerText = "ACCESS ACCOUNT";
            btn.disabled = false;
        }
    };
</script>
