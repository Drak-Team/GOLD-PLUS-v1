<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Login</title>
    <style>
        :root { --gold: #d4af37; --dark: #050505; }
        body { background: var(--dark); color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-image: radial-gradient(circle, #1a1a1a 0%, #050505 100%); }
        .box { background: rgba(255,255,255,0.05); padding: 40px 30px; border-radius: 25px; width: 340px; text-align: center; border: 1px solid var(--gold); backdrop-filter: blur(10px); }
        input { width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #333; border-radius: 12px; background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; background: linear-gradient(45deg, #d4af37, #f9e29c); border: none; color: #000; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 20px; font-size: 16px; }
        a { color: var(--gold); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1 style="color:var(--gold); margin-bottom:30px;">GOLD PLUS</h1>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="pass" placeholder="Password">
        <button id="loginBtn">LOGIN NOW</button>
        <p style="font-size:14px; color:#888;">New here? <a href="singup.html">CREATE ACCOUNT</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
            authDomain: "gold-plus-v1.firebaseapp.com",
            projectId: "gold-plus-v1",
            storageBucket: "gold-plus-v1.firebasestorage.app",
            messagingSenderId: "474592887487",
            appId: "1:474592887487:web:e9261d51df5af58a367c0a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = "dashboard.html"; 
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>
</body>
</html>
