<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Daily Tasks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22); --card-bg: rgba(255, 255, 255, 0.08); --primary-gold: #f1c40f; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f051d; color: white; padding-bottom: 80px; }
        
        .header { padding: 25px 20px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(241, 196, 15, 0.2); display: flex; align-items: center; gap: 15px; }
        .header a { color: white; text-decoration: none; font-size: 20px; }
        .header h2 { margin: 0; font-size: 18px; color: var(--primary-gold); }

        .task-container { padding: 20px; }
        .task-card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .task-info h4 { margin: 0; font-size: 15px; color: #fff; }
        .task-info p { margin: 5px 0 0; font-size: 12px; color: #aaa; }
        .task-reward { color: #00ff64; font-weight: bold; font-size: 16px; margin-top: 5px; }

        .claim-btn { background: var(--gold-grad); border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; color: #000; cursor: pointer; font-size: 12px; }
        .claim-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        .stats-box { background: rgba(241, 196, 15, 0.1); padding: 15px; border-radius: 15px; margin: 0 20px 20px; text-align: center; border: 1px dashed var(--primary-gold); }
        .stats-box span { color: var(--primary-gold); font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="header">
    <a href="dashboard.html"><i class="fas fa-arrow-left"></i></a>
    <h2>Team Reward Tasks</h2>
</div>

<div style="padding-top: 20px;">
    <div class="stats-box">
        Your Active Team Members: <span id="activeCount">0</span>
    </div>
</div>

<div class="task-container">
    <div class="task-card">
        <div class="task-info">
            <h4>Task 1: Starter Team</h4>
            <p>Invite 5 Active Members</p>
            <div class="task-reward">Reward: $1.00</div>
        </div>
        <button class="claim-btn" id="btn1" onclick="claimReward(5, 1, 'btn1')" disabled>CLAIM</button>
    </div>

    <div class="task-card">
        <div class="task-info">
            <h4>Task 2: Pro Team</h4>
            <p>Invite 10 Active Members</p>
            <div class="task-reward">Reward: $5.00</div>
        </div>
        <button class="claim-btn" id="btn2" onclick="claimReward(10, 5, 'btn2')" disabled>CLAIM</button>
    </div>

    <div class="task-card">
        <div class="task-info">
            <h4>Task 3: Gold Leader</h4>
            <p>Invite 50 Active Members</p>
            <div class="task-reward">Reward: $25.00</div>
        </div>
        <button class="claim-btn" id="btn3" onclick="claimReward(50, 25, 'btn3')" disabled>CLAIM</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
      authDomain: "gold-plus-v1.firebaseapp.com",
      databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
      projectId: "gold-plus-v1",
      storageBucket: "gold-plus-v1.firebasestorage.app",
      messagingSenderId: "474592887487",
      appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const phone = localStorage.getItem('userPhone');

    window.onload = () => {
        if (!phone) window.location.href = 'index.html';
        else checkTasks();
    };

    function checkTasks() {
        onValue(ref(db, 'users/' + phone), (snap) => {
            const user = snap.val();
            if (user) {
                // Counting referrals
                const count = user.referrals ? Object.keys(user.referrals).length : 0;
                document.getElementById('activeCount').innerText = count;

                // Enable/Disable buttons based on count and if already claimed
                updateButton(count, 5, 'btn1', user.task1_claimed);
                updateButton(count, 10, 'btn2', user.task2_claimed);
                updateButton(count, 50, 'btn3', user.task3_claimed);
            }
        });
    }

    function updateButton(current, target, btnId, isClaimed) {
        const btn = document.getElementById(btnId);
        if (isClaimed) {
            btn.innerText = "CLAIMED";
            btn.disabled = true;
            btn.style.background = "#00ff64";
            btn.style.color = "#000";
        } else if (current >= target) {
            btn.disabled = false;
            btn.innerText = "CLAIM NOW";
        } else {
            btn.disabled = true;
            btn.innerText = "LOCKED";
        }
    }

    window.claimReward = (target, amount, btnId) => {
        const taskKey = btnId === 'btn1' ? 'task1_claimed' : (btnId === 'btn2' ? 'task2_claimed' : 'task3_claimed');
        
        runTransaction(ref(db, 'users/' + phone), (curr) => {
            if (curr) {
                if (!curr[taskKey]) {
                    curr.balance = (curr.balance || 0) + amount;
                    curr[taskKey] = true; // Mark as claimed
                    return curr;
                }
            }
        }).then(() => {
            alert(`Success! $${amount} Reward added to your balance.`);
        }).catch((e) => alert("Error: " + e.message));
    };
</script>
</body>
</html>
