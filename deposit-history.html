<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - Deposit History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #f1c40f;
            --bg-dark: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1a0b2e, #0f051d);
            color: white;
            padding-bottom: 20px;
        }

        .header { padding: 20px; display: flex; align-items: center; gap: 15px; }
        .header h2 { color: var(--primary-gold); font-size: 20px; margin: 0; }
        .header a { color: white; text-decoration: none; font-size: 20px; }

        .container { padding: 15px; }

        /* History Card */
        .history-item {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info h4 { margin: 0; font-size: 14px; color: #fff; }
        .info span { font-size: 11px; color: #888; display: block; margin-top: 4px; }
        
        .status-box { text-align: right; }
        .amount { display: block; font-weight: bold; color: var(--primary-gold); font-size: 16px; }
        
        /* Status Badges */
        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .pending { background: #f39c12; color: #000; }
        .approved { background: #2ecc71; color: #000; }
        .rejected { background: #e74c3c; color: #fff; }

        .no-data { text-align: center; margin-top: 50px; color: #666; }
        .no-data i { font-size: 50px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header">
    <a href="dashboard.html"><i class="fas fa-arrow-left"></i></a>
    <h2>Deposit History</h2>
</div>

<div class="container" id="historyContainer">
    <div class="history-item">
        <div class="info">
            <h4>JazzCash Deposit</h4>
            <span>TID: 982736451234</span>
            <span>Date: 18 April, 2026</span>
        </div>
        <div class="status-box">
            <span class="amount">+$50.00</span>
            <span class="badge pending">Pending</span>
        </div>
    </div>

    <div class="history-item">
        <div class="info">
            <h4>JazzCash Deposit</h4>
            <span>TID: 881234567890</span>
            <span>Date: 15 April, 2026</span>
        </div>
        <div class="status-box">
            <span class="amount">+$20.00</span>
            <span class="badge approved">Approved</span>
        </div>
    </div>
</div>

<script>
    // یہاں ہم فائر بیس سے ڈیٹا لوڈ کرنے کا فنکشن ڈالیں گے
    // فی الحال یہ ڈیزائن دکھانے کے لیے اسٹیٹک ہے
</script>

</body>
</html>
