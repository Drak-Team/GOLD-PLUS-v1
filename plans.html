<script>
    // ... فائر بیس کنفگریشن وہی رہے گی ...
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');
    const PKR_RATE = 300; 

    // پلانز کی لسٹ
    const plans = [
        {id: 2, name: "Nano AI Bot", rs: "600", daily: "60", bonus: "5%"},
        {id: 5, name: "Micro Miner", rs: "1,500", daily: "150", bonus: "5%"},
        {id: 10, name: "Volt Robot", rs: "3,000", daily: "300", bonus: "7%"},
        {id: 20, name: "Cyber Hunter", rs: "6,000", daily: "600", bonus: "7%"},
        {id: 30, name: "Alpha AI", rs: "9,000", daily: "900", bonus: "10%"},
        {id: 50, name: "Delta Power", rs: "15,000", daily: "1,500", bonus: "10%"},
        {id: 100, name: "Titan X", rs: "30,000", daily: "3,500", bonus: "12%"},
        {id: 200, name: "Omega Machine", rs: "60,000", daily: "7,500", bonus: "12%"},
        {id: 300, name: "Galactic Miner", rs: "90,000", daily: "12,000", bonus: "15%"},
        {id: 400, name: "Supreme AI", rs: "120,000", daily: "16,000", bonus: "15%"},
        {id: 500, name: "Emperor Robot", rs: "150,000", daily: "20,000", bonus: "15%"}
    ];

    function renderInitialPlans() {
        let html = "";
        plans.forEach(plan => {
            const dailyUSD = (parseFloat(plan.daily.replace(/,/g, '')) / PKR_RATE).toFixed(2);
            html += `
                <div class="plan-card">
                    <i class="fas fa-robot robot-bg"></i>
                    <div class="usdt-bonus-tag">USDT BONUS: ${plan.bonus}</div>
                    <div class="plan-name">${plan.name}</div>
                    <span class="price-tag">$${plan.id}.00 <small style="font-size:12px; color:#888;">/ Rs. ${plan.rs}</small></span>
                    <div class="stats-grid">
                        <div class="stat-box"><label>Daily Earning</label><span>Rs. ${plan.daily}</span></div>
                        <div class="stat-box"><label>Life</label><span style="color:#fff;">30 Days</span></div>
                    </div>
                    <button id="btn-${plan.id}" class="buy-btn deposit">Loading...</button>
                </div>`;
        });
        document.getElementById('plansList').innerHTML = html;
    }

    renderInitialPlans();

    // ڈیٹا بیس سے بیلنس اور پلان چیک کرنا
    db.ref('users/' + phone).on('value', (snap) => {
        if (!snap.exists()) return;
        const data = snap.val();
        const currentBalance = parseFloat(data.balance || 0); // یوزر کا روپے میں بیلنس
        const activePlanName = data.plan || "";

        plans.forEach(plan => {
            const btn = document.getElementById(`btn-${plan.id}`);
            if (!btn) return;

            const planPricePKR = parseFloat(plan.rs.replace(/,/g, '')); // پلان کی قیمت روپے میں

            if (activePlanName !== "") {
                if (activePlanName === plan.name) {
                    btn.innerText = "Activated";
                    btn.className = "buy-btn active-plan";
                    btn.disabled = true;
                } else {
                    btn.innerText = "Plan Locked";
                    btn.className = "buy-btn deposit";
                    btn.style.opacity = "0.5";
                    btn.disabled = true;
                }
            } 
            // یہاں اصلی چیکنگ ہو رہی ہے: کیا بیلنس پلان کی روپے والی قیمت سے زیادہ ہے؟
            else if (currentBalance >= planPricePKR) {
                btn.innerText = "Invest Now";
                btn.className = "buy-btn";
                btn.disabled = false;
                btn.onclick = () => investNow(planPricePKR, plan.name, plan.daily);
            } else {
                btn.innerText = "Insufficient Balance";
                btn.className = "buy-btn deposit";
                btn.onclick = () => window.location.href = `deposit.html?amount=${plan.id}`;
            }
        });
    });

    async function investNow(pPrice, pName, dailyIncome) {
        if (!confirm(`Confirm investment in ${pName} for Rs. ${pPrice}?`)) return;
        
        try {
            // ٹرانزیکشن کا استعمال تاکہ کوئی بیلنس مائنس میں نہ لے جا سکے
            const balanceRef = db.ref('users/' + phone + '/balance');
            
            const result = await balanceRef.transaction((currentBal) => {
                const bal = parseFloat(currentBal) || 0;
                if (bal >= pPrice) {
                    return bal - pPrice; // بیلنس کاٹ لیا
                } else {
                    return; // ٹرانزیکشن کینسل اگر پیسے کم ہوں
                }
            });

            if (result.committed) {
                await db.ref('users/' + phone).update({
                    plan: pName,
                    dailyProfit: dailyIncome.replace(/,/g, ''),
                    miningStatus: "Active",
                    lastClaim: 0,
                    planDate: new Date().getTime()
                });
                alert("Success! " + pName + " Activated.");
                window.location.href = "mining.html";
            } else {
                alert("Inssuficient Balance! Transaction failed.");
            }
        } catch (e) { alert("System Error: " + e.message); }
    }
</script>
