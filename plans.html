<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');

    if (!phone) window.location.href = "login.html";

    const plans = [
        {id: 2, name: "Nano AI Bot", rs: 600, daily: 60, bonus: "5%"},
        {id: 5, name: "Micro Miner", rs: 1500, daily: 150, bonus: "5%"},
        {id: 10, name: "Volt Robot", rs: 3000, daily: 300, bonus: "7%"},
        {id: 20, name: "Cyber Hunter", rs: 6000, daily: 600, bonus: "7%"},
        {id: 30, name: "Alpha AI", rs: 9000, daily: 900, bonus: "10%"},
        {id: 50, name: "Delta Power", rs: 15000, daily: 1500, bonus: "10%"},
        {id: 100, name: "Titan X", rs: 30000, daily: 3500, bonus: "12%"},
        {id: 200, name: "Omega Machine", rs: 60000, daily: 7500, bonus: "12%"},
        {id: 300, name: "Galactic Miner", rs: 90000, daily: 12000, bonus: "15%"},
        {id: 400, name: "Supreme AI", rs: 120000, daily: 16000, bonus: "15%"},
        {id: 500, name: "Emperor Robot", rs: 150000, daily: 20000, bonus: "15%"}
    ];

    function loadPlans() {
        const list = document.getElementById('plansList');
        list.innerHTML = "";

        db.ref('users/' + phone).on('value', (snap) => {
            const userData = snap.val() || {};
            const userBal = parseFloat(userData.balance || 0);
            const activePlan = userData.plan || "";

            let html = "";
            plans.forEach(plan => {
                let btnText = "Deposit Now";
                let btnClass = "buy-btn deposit";
                let btnAction = `window.location.href='deposit.html?amount=${plan.id}'`;
                let isDisabled = false;

                if (activePlan !== "" && activePlan !== "No Active Plan") {
                    if (activePlan === plan.name) {
                        btnText = "Activated";
                        btnClass = "buy-btn active-plan";
                        isDisabled = true;
                    } else {
                        btnText = "Locked";
                        isDisabled = true;
                    }
                } else if (userBal >= plan.rs) {
                    btnText = "Invest Now";
                    btnClass = "buy-btn";
                    btnAction = `investNow(${plan.rs}, '${plan.name}', ${plan.daily})`;
                }

                html += `
                    <div class="plan-card">
                        <i class="fas fa-robot robot-bg"></i>
                        <div class="usdt-bonus-tag">BONUS: ${plan.bonus}</div>
                        <div class="plan-name">${plan.name}</div>
                        <span class="price-tag">$${plan.id}.00 <small style="font-size:12px; color:#888;">/ Rs. ${plan.rs}</small></span>
                        <div class="stats-grid">
                            <div class="stat-box"><label>Daily</label><span>Rs. ${plan.daily}</span></div>
                            <div class="stat-box"><label>Life</label><span>30 Days</span></div>
                        </div>
                        <button class="${btnClass}" onclick="${btnAction}" ${isDisabled ? 'disabled' : ''}>${btnText}</button>
                    </div>`;
            });
            list.innerHTML = html;
        });
    }

    async function investNow(price, name, daily) {
        if (!confirm(`Confirm investment in ${name} for Rs. ${price}?`)) return;

        const userRef = db.ref('users/' + phone);
        
        userRef.transaction((currentData) => {
            if (currentData && parseFloat(currentData.balance || 0) >= price) {
                // پیسے کاٹیں اور پلان ایکٹیو کریں
                currentData.balance = parseFloat(currentData.balance) - price;
                currentData.plan = name;
                currentData.dailyProfit = daily;
                currentData.miningStatus = "Active";
                currentData.planDate = new Date().getTime();

                // ریفرل کمیشن (10%) کی لاجک یہاں سے شروع ہوتی ہے
                const referBy = currentData.referredBy; 
                if (referBy && referBy !== "none") {
                    const comm = price * 0.10;
                    
                    // ریفر کرنے والے کے بیلنس میں پیسے جمع کرنا
                    db.ref('users/' + referBy).transaction((refData) => {
                        if (refData) {
                            refData.balance = (parseFloat(refData.balance) || 0) + comm;
                            refData.teamCommission = (parseFloat(refData.teamCommission) || 0) + comm;
                            refData.lvl1Commission = (parseFloat(refData.lvl1Commission) || 0) + comm;
                            
                            // ریفرر کی ریفرل لسٹ میں اس ممبر کو "Activated" دکھانا
                            if(refData.referrals && refData.referrals[phone]) {
                                refData.referrals[phone].status = "Activated";
                            }
                        }
                        return refData;
                    });

                    // ریفر کرنے والے کی ارننگ ہسٹری میں ریکارڈ ڈالنا
                    db.ref('earning_history/' + referBy).push({
                        amount: comm,
                        type: "Team Bonus",
                        from: phone,
                        date: new Date().toLocaleString(),
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                }
                
                return currentData;
            }
            return; 
        }, (error, committed) => {
            if (committed) {
                alert("Success! Plan Activated.");
                window.location.href = "mining.html";
            } else {
                alert("Insufficient balance or error occurred.");
            }
        });
    }

    loadPlans();
</script>
