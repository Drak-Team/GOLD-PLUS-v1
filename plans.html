<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Plus - VIP Crypto Mining</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #f1c40f; --bg: #0f051d; --neon-green: #00ff64; --crypto-blue: #00d4ff; --gold-grad: linear-gradient(135deg, #f1c40f, #e67e22); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top, #1a0b2e, #0f051d); color: white; padding-bottom: 120px; }
        
        .header { padding: 30px 20px; text-align: center; background: rgba(0,0,0,0.6); border-bottom: 2px solid var(--gold); border-radius: 0 0 50px 50px; box-shadow: 0 10px 40px rgba(241, 196, 15, 0.4); }
        .header h2 { margin: 0; color: var(--gold); font-size: 26px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        .container { padding: 15px; }

        .crypto-promo { background: linear-gradient(90deg, #1e004d, #004e92); margin: 20px 0; padding: 15px; border-radius: 25px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--crypto-blue); box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
        .crypto-promo i { font-size: 35px; color: var(--crypto-blue); }
        .crypto-promo b { color: var(--crypto-blue); font-size: 14px; }
        .crypto-promo p { margin: 0; font-size: 11px; color: #ccc; }

        .section-title { color: var(--gold); font-size: 15px; font-weight: bold; margin: 25px 0 15px 5px; text-transform: uppercase; border-left: 4px solid var(--crypto-blue); padding-left: 10px; }

        .plan-card { background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); border: 1px solid rgba(241, 196, 15, 0.2); border-radius: 35px; padding: 22px; margin-bottom: 25px; position: relative; overflow: hidden; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .robot-bg { position: absolute; right: -20px; top: -15px; font-size: 110px; color: rgba(241, 196, 15, 0.05); pointer-events: none; }

        .usdt-bonus-tag { position: absolute; top: 0; right: 0; background: linear-gradient(90deg, #00d4ff, #004e92); color: #fff; font-size: 10px; font-weight: bold; padding: 8px 18px; border-bottom-left-radius: 20px; }
        .plan-name { font-size: 21px; font-weight: bold; margin: 0; color: #fff; }
        .price-tag { display: block; color: var(--gold); font-size: 23px; font-weight: 800; margin: 8px 0; }
        .price-rs { font-size: 14px; color: #bbb; font-weight: normal; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .stat-box { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-box label { display: block; font-size: 8px; color: #888; text-transform: uppercase; }
        .stat-box span { font-size: 14px; font-weight: 700; color: var(--neon-green); }

        .bonus-box { background: rgba(0, 212, 255, 0.1); border: 1px dashed var(--crypto-blue); padding: 12px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .bonus-box b { font-size: 15px; color: #fff; }

        .buy-btn { background: var(--gold-grad); color: #000; border: none; width: 100%; padding: 18px; border-radius: 20px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; }
        .buy-btn:disabled { background: #555; cursor: not-allowed; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0a0414; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(241, 196, 15, 0.2); }
        .nav-btn { color: #555; text-decoration: none; text-align: center; flex: 1; }
        .nav-btn.active { color: var(--gold); }
    </style>
</head>
<body>

<div class="header"><h2>GOLD PLUS MINING</h2></div>

<div class="container">
    <div class="crypto-promo">
        <i class="fab fa-bitcoin"></i>
        <div><b>USDT CRYPTO BONUS!</b><p>ڈپازٹ کے لیے USDT منتخب کریں اور 15% تک اضافی کمیشن حاصل کریں۔</p></div>
    </div>

    <div class="section-title">Investment Plans</div>
    <div id="plansList"></div>

    <div style="text-align: center; padding: 40px; color: #555; border: 2px dashed rgba(255,255,255,0.1); border-radius: 30px; margin-top: 20px;">
        <i class="fas fa-lock" style="font-size:30px;"></i><br><br>VIP $1000+ PLANS COMING SOON
    </div>
</div>

<nav class="nav-bar">
    <a href="dashboard.html" class="nav-btn"><i class="fas fa-home"></i><br><span>Home</span></a>
    <a href="plans.html" class="nav-btn active"><i class="fas fa-gem"></i><br><span>Plans</span></a>
    <a href="mining.html" class="nav-btn"><i class="fas fa-microchip"></i><br><span>Mining</span></a>
    <a href="refer.html" class="nav-btn"><i class="fas fa-users"></i><br><span>Refer</span></a>
    <a href="profile.html" class="nav-btn"><i class="fas fa-user-gear"></i><br><span>Profile</span></a>
</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyByanDKaCErU1mV7ebXd3KsuLWF55LbgnQ",
        authDomain: "gold-plus-v1.firebaseapp.com",
        databaseURL: "https://gold-plus-v1-default-rtdb.firebaseio.com",
        projectId: "gold-plus-v1",
        storageBucket: "gold-plus-v1.firebasestorage.app",
        messagingSenderId: "474592887487",
        appId: "1:474592887487:web:e9261d51df5af58a367c0a"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const phone = localStorage.getItem('userPhone');

    const plans = [
        {id: 2, name: "Nano AI Bot", rs: "600", daily: "60", bonus: "5%"},
        {id: 5, name: "Micro Miner", rs: "1,500", daily: "150", bonus: "5%"},
        {id: 10, name: "Volt Robot", rs: "3,000", daily: "300", bonus: "7%"},
        {id: 20, name: "Cyber Hunter", rs: "6,000", daily: "600", bonus: "7%"},
        {id: 30, name: "Alpha AI", rs: "9,000", daily: "900", bonus: "10%"},
        {id: 50, name: "Delta Power", rs: "15,000", daily: "1,500", bonus: "10%"},
        {id: 100, name: "Titan X", rs: "30,000", daily: "3,500", bonus: "12%"},
        {id: 200, name: "Omega Machine", rs: "60,000", daily: "7,500", bonus: "12%"},
        {id: 300, name: "Galactic Miner", rs: "90,000", daily: "12,000", bonus: "15%"},
        {id: 400, name: "Supreme AI", rs: "120,000", daily: "16,000", bonus: "15%"},
        {id: 500, name: "Emperor Robot", rs: "150,000", daily: "20,000", bonus: "15%"}
    ];

    function renderPlans() {
        let html = "";
        plans.forEach(plan => {
            html += `
                <div class="plan-card">
                    <i class="fas fa-robot robot-bg"></i>
                    <div class="usdt-bonus-tag">USDT BONUS: ${plan.bonus}</div>
                    <div class="plan-name">${plan.name}</div>
                    <span class="price-tag">$${plan.id}.00 <small style="font-size:12px; color:#888;">/ Rs. ${plan.rs}</small></span>
                    <div class="stats-grid">
                        <div class="stat-box"><label>Daily Earning</label><span>Rs. ${plan.daily}</span></div>
                        <div class="stat-box"><label>Life</label><span style="color:#fff;">30 Days</span></div>
                    </div>
                    <button class="buy-btn" id="btn_${plan.id}" onclick="activatePlan(${plan.id}, '${plan.name}')">Activate Now</button>
                </div>`;
        });
        document.getElementById('plansList').innerHTML = html;
    }

    async function activatePlan(cost, pName) {
        if (!phone) return alert("Please Login First!");
        
        const btn = document.getElementById('btn_' + cost);
        btn.innerText = "Processing..."; btn.disabled = true;

        try {
            const snap = await db.ref('users/' + phone).once('value');
            const userData = snap.val();
            const currentBal = parseFloat(userData.balance || 0);

            if (currentBal < cost) {
                alert("Insufficient Balance! Please Deposit First.");
                window.location.href = "deposit.html";
                return;
            }

            if (confirm(`Are you sure to activate ${pName} for $${cost}?`)) {
                const newBal = currentBal - cost;
                const updateData = {
                    balance: newBal.toFixed(2),
                    plan: pName,
                    planCost: cost,
                    planDate: new Date().toLocaleDateString(),
                    miningStatus: "Active"
                };

                await db.ref('users/' + phone).update(updateData);
                
                // ہسٹری میں اندراج
                const historyID = Date.now();
                await db.ref('users/' + phone + '/history/' + historyID).set({
                    type: "Plan Purchase",
                    item: pName,
                    amount: "-" + cost,
                    date: new Date().toLocaleString()
                });

                alert(pName + " Activated Successfully!");
                window.location.href = "dashboard.html";
            }
        } catch (e) {
            alert("Error: " + e.message);
        }
        btn.innerText = "Activate Now"; btn.disabled = false;
    }

    renderPlans();
</script>
</body>
</html>
